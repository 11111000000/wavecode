# GitVerse Actions — math-coding v5 gate.
#
# Триггеры:
#   - push в master           → проверка live tree
#   - pull_request            → проверка PR
#   - workflow_dispatch       → ручной запуск
#
# Что делает:
#   1. Ставит `mathc` из релиза ядра v5 (v5.0.2): готовый статический
#      бинарь linux-x86_64 + проверка SHA-256 по SHA256SUMS того же
#      релиза. Старый edge-релиз (ядро 3.7) отдаёт 404 — его формат
#      `decisions/*.yaml` ядро 5 не читает вовсе.
#   2. `mathc run` — исполняет verifier'ы и отрицательные контроли всех
#      утверждений из `spec.json` и печатает вердикт + карту покрытия.
#      Коды возврата: 0 — green, 1 — red, 3 — unknown (утверждение не
#      доказано). Любой ненулевой код валит шаг: «unknown» — это тоже
#      «не доказано», а не «доказано, что всё хорошо».
#   3. Артефакт: вывод прогона (вердикт, состояния, uncovered).
#
# Формат решений: `spec.json` (schema_version 5). Исторический реестр
# `decisions/*.yaml` — источник мотивации, а не формат ядра.
# См. docs/math-coding-v5.md.

name: math-coding

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wavecode-math-coding-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: math-coding v5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Verifier'ы — это `node scripts/check-invariants.mjs` (только
        # stdlib), поэтому Node нужен гейту, а не приложению.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mathc (kernel v5)
        env:
          MC_VERSION: "v5.0.2"
        run: |
          set -eu
          base="https://github.com/11111000000/math-coding/releases/download/${MC_VERSION}"
          curl -fsSL "${base}/mathc-v${MC_VERSION}-linux-x86_64" -o /tmp/mathc
          curl -fsSL "${base}/SHA256SUMS" -o /tmp/SHA256SUMS
          cd /tmp
          grep "mathc-v${MC_VERSION}-linux-x86_64" SHA256SUMS | sha256sum -c -
          chmod +x /tmp/mathc
          sudo install -m 0755 /tmp/mathc /usr/local/bin/mathc
          mathc --version

      - name: Run the v5 gate
        run: |
          set -eu
          mkdir -p artifacts
          mathc run | tee artifacts/mathc-run.txt
