# GitVerse Actions — auto-deploy на angara-1 (NixOS dev host, держит Caddy + /var/lib/wavecode/dist/).
#
# ════════════════════════════════════════════════════════════════════════
# STATUS: DISABLED (2026-10-15)
# ════════════════════════════════════════════════════════════════════════
#
# Push-триггер (`on.push.branches: [master]`) закомментирован. workflow
# никогда не стартует на push. Это временная мера, пока секреты для SSH
# deploy не настроены (и не настраиваются — см. ниже).
#
# Деплой происходит ЛОКАЛЬНО на angara-1 через `bin/deploy.sh` (читает
# /etc/secrets/llm-proxy/master.key, имеет sudo, копирует в
# /var/lib/wavecode/dist/, Caddy подхватывает автоматически). CI-deploy
# через GitVerse Actions — дубликат этого flow, который сейчас не нужен:
#   - на GitVerse не настроены секреты WAVECODE_DEPLOY_{HOST,PORT,USER,SSH_KEY}
#     (14 последовательных run-ов упали с `WAVECODE_DEPLOY_HOST not set`)
#   - даже если настроить, дублировать локальный bin/deploy.sh через CI —
#     лишний слой без выгоды, когда есть прямой shell на хосте
#
# Чтобы включить обратно:
#   1. настроить секреты (см. таблицу ниже) в gitverse → Settings → Secrets
#   2. раскомментировать блок `on: push / on: workflow_dispatch`
#   3. протестировать через `workflow_dispatch` в UI GitVerse
#   4. при желании добавить cron `*/10 * * * *` на angara-1, чтобы запускать
#      `bin/deploy.sh` после `git pull` (полностью автономный flow без CI)
#
# ════════════════════════════════════════════════════════════════════════
#
# Оригинальное описание flow (для справки, пригодится при re-enable):
#
# Триггеры (когда включены):
#   - push в master      → автодеплой (production)
#   - workflow_dispatch  → ручной запуск (для отладки / hotfix)
#
# Поток:
#   1. SSH на angara-1 как пользователь `az` (deploy key ограничен в
#      authorized_keys: command=".../bin/deploy.sh", no-pty, no-forwarding).
#   2. На хосте `git fetch + reset --hard gitverse/master` — приводим
#      tree к gitverse (origin = github mirror, отстаёт).
#   3. `bin/deploy.sh` делает pnpm install + pnpm build + sudo cp
#      в /var/lib/wavecode/dist/ (caddy:caddy). Caddy подхватывает новые
#      файлы автоматически (не требует reload для статики).
#
# Secrets (настраиваются в gitverse → Settings → Secrets):
#   WAVECODE_DEPLOY_HOST         — hostname или IP angara-1 (например "nixos")
#   WAVECODE_DEPLOY_PORT         — SSH port (на angara-1 = 1984)
#   WAVECODE_DEPLOY_USER         — пользователь на хосте (на angara-1 = "az")
#   WAVECODE_DEPLOY_SSH_KEY      — приватный ключ ed25519
#                                  (public в ~/.ssh/authorized_keys на angara-1
#                                  с command= ограничением)

name: deploy

# Push-триггер отключён 2026-10-15 — CI-deploy не используется.
# Деплой идёт локально через bin/deploy.sh на angara-1.
# Оставлен `workflow_dispatch` для редких случаев отладки CI-flow
# (потребует настроенных secrets, иначе упадёт с тем же WAVECODE_DEPLOY_HOST not set).
on:
  # push:                                          # ← DISABLED
  #   branches: [master]                           # ← DISABLED
  workflow_dispatch:                               # manual only

concurrency:
  group: wavecode-master-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to angara-1 via SSH
        env:
          DEPLOY_HOST: ${{ secrets.WAVECODE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.WAVECODE_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.WAVECODE_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.WAVECODE_DEPLOY_SSH_KEY }}
        run: |
          set -eu
          : "${DEPLOY_HOST:?WAVECODE_DEPLOY_HOST not set}"
          : "${DEPLOY_SSH_KEY:?WAVECODE_DEPLOY_SSH_KEY not set}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_USER="${DEPLOY_USER:-az}"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/wavecode_deploy_key
          chmod 600 ~/.ssh/wavecode_deploy_key

          # The deploy key on the host is locked to a forced command that
          # does `git fetch + reset + clean + bin/deploy.sh` — so this
          # single SSH opens a session, the host runs the full pipeline
          # against the freshly-reset master tree, and stdout/stderr
          # land in the CI log.
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/wavecode_deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Verify deployment
        env:
          PUBLIC_URL: https://wavecode.kosov.online/
        run: |
          # Smoke test: the public URL should serve fresh index.html.
          # Caddy serves /var/lib/wavecode/dist/ which was just rewritten
          # by deploy.sh. We allow up to 60s for cache + propagation.
          for i in 1 2 3 4 5 6; do
            last_modified=$(curl -sI "$PUBLIC_URL" | grep -i '^last-modified:' | tr -d '\r')
            if [ -n "$last_modified" ]; then
              echo "OK: $PUBLIC_URL"
              echo "  $last_modified"
              exit 0
            fi
            echo "retry $i: $PUBLIC_URL not reachable yet"
            sleep 10
          done
          echo "ERROR: $PUBLIC_URL did not become reachable"
          exit 1
