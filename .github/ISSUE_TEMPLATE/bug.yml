name: Bug report
description: Сообщить об ошибке в wavecode
title: "[bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Спасибо за репорт! Заполните шаблон ниже — чем больше информации, тем быстрее fix.

  - type: input
    id: version
    attributes:
      label: Версия wavecode
      description: |
        Что показано в левом нижнем углу #/admin (или в `git describe` для self-build).
      placeholder: "0.1.0 (commit 4ddf034)"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Браузер
      description: В каком браузере воспроизводится
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Mobile Chrome (Android)
        - Другой
    validations:
      required: true

  - type: dropdown
    id: context
    attributes:
      label: Контекст
      description: Где именно воспроизводится
      options:
        - Landing page (#/)
        - Editor (#/app) — score panel
        - Editor (#/app) — AI chat
        - Editor (#/app) — piano
        - Editor (#/app) — step grid
        - Editor (#/app) — mixer
        - Admin (#/admin)
        - Console (Ctrl/⌘+`)
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: |
        Минимальный сценарий: что вы делали, что произошло, что ожидали.
      placeholder: |
        1. Открыл http://localhost:5173/
        2. Кликнул на пресет "Creep"
        3. Нажал ▶
        4. Увидел ошибку в Console: "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншот
      description: |
        Скопируйте вывод из Console (Ctrl/⌘+`) → вкладка Errors,
        или прикрепите screenshot. Для больших дампов — используйте gist/pastebin.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Чеклист
      options:
        - label: Я проверил, что в свежем `master` проблема ещё воспроизводится
          required: true
        - label: Я проверил Console (Ctrl/⌘+`) на наличие ошибок
          required: true
        - label: Я не нашёл существующий issue с такой же проблемой
          required: true
