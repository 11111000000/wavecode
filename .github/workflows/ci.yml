name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-flight runs for the same branch on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck + lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: ui
        run: npm run typecheck

      - name: Lint (no-console in domain/application)
        working-directory: ui
        run: npm run lint:no-console

      - name: Validate built-in presets
        working-directory: ui
        run: npm run validate:presets

      - name: Unit tests (vitest)
        working-directory: ui
        run: npm run test:run

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build (vite + tsc)
        working-directory: ui
        env:
          # CI build uses placeholder; real LLM key is per-app, injected at deploy time.
          VITE_LLM_PROXY_URL: https://llm.kosov.online/v1
          VITE_LLM_PROXY_KEY: ci-placeholder-not-used-at-runtime
        run: |
          # Skip the prebuild key check in CI — it requires interactive prompt.
          # Production deploy (GitVerse workflow) runs the real check.
          npx vite build

      - name: Upload build artefact
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  python-scripts:
    name: python scripts (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: scripts
          args: 'check'

  e2e-smoke:
    name: e2e smoke (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # CI has no NixOS system Chromium, so Playwright downloads its own
      # build here. Locally the suite reuses /run/current-system/sw/bin/
      # chromium instead — see decisions/wavecode-e2e-system-browser.yaml.
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The e2e webServer is `vite preview`, which serves the built
      # bundle — the specs assert on artefacts (chunk split, PWA
      # manifest, precache) that a dev server does not produce.
      - name: Build bundle
        working-directory: ui
        env:
          VITE_LLM_PROXY_URL: https://llm.kosov.online/v1
          VITE_LLM_PROXY_KEY: ci-placeholder-not-used-at-runtime
        run: npx vite build

      - name: E2E smoke
        working-directory: ui
        run: npx playwright test --grep @smoke

  e2e-full:
    name: e2e full (playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    # The full suite still carries specs pinned to the pre-transport-bar
    # DOM. It runs as observability so the drift stays visible without
    # turning master red; the smoke tag above is the hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build bundle
        working-directory: ui
        env:
          VITE_LLM_PROXY_URL: https://llm.kosov.online/v1
          VITE_LLM_PROXY_KEY: ci-placeholder-not-used-at-runtime
        run: npx vite build

      - name: E2E full suite
        working-directory: ui
        run: npx playwright test
