  owner: human:operator

counterexample: |
  «Whistling — это просто pitch detection; main-thread YIN достаточно,
  Worker — overengineering». Counterargument: pitchy MPM на 2048-sample
  буфере занимает ~5-10ms на слабом ноуте. На main thread это
  конкурирует с RAF-loop'ом Visualizer (30Hz × 1k FFT) и Cyclist
  scheduler lookaheads; мы наблюдали audio-glitches при включённом
  Visualizer + tab in background. Worker через Transferable zero-copy
  добавляет ~0ms latency при этом убирает конкуренцию за main thread.

  «Strudel snippets с `note("c4 e4 g4")` без `.slow()` или `.every()`
  проиграют ноты слишком быстро — это не музыка». Counterargument:
  user picking free-form transcription explicitly asked for arbitrary
  length (cycle-driven playback). Глобальный CPS scheduler
  инхеритится от существующего snippet — пользователь контролирует
  темп через встроенный Transport или явный `.slow(N)` wrapper,
  который мы НЕ навязываем.

antithesis: |
  (1) «Whistling — слишком неточно для live-coding; лучше MIDI-клавиатура».
  Возражение: целевой юзер НЕ имеет hardware MIDI; он работает в
  браузере за ноутбуком без USB-контроллера. Mic input — strictly
  complementary к существующему PianoKeyboard + WebMIDI. (2) «Just
  ship LLM-based: whistle → audio buffer → llm → Strudel snippet».
  Возражение: latency (3-10s) vs 60ms here. Качество LLM-transcription
  сильно зависит от качества модели, тогда как MPM — deterministic
  DSP. (3) «Можно использовать существующий `analyserNode` из
  LiveAudioEngine». Возражение: тот analyserNode читает OUTPUT
  Strudel (Speakers → analyser), а нам нужен INPUT с MIC. Разные
  AudioSource — разные AnalyserNode по спеке Web Audio. (4) `pitchy`
  — YIN, не McLeod — почему не YIN? Возражение: pitchy v4 by-default
  предоставляет MPM, который переопределяет YIN под monophonic вокал;
  мы используем тот API, который есть.

  Three affordance surfaces (mic toggle / slot row / apply) вместо
  одной «Press to whistle» кнопки:
  - Slot selector позволяет пользователю выбирать append vs replace
    vs cursor — без него destructive replace-score — единственный
    affordance, и пользователь боится пользоваться фичей.
  - Instrument selector (8 опций) важен: разные whistles просят разные
    тембры (sine для мягкого, square для резкого).
  - Three discrete-action row (freeze/clear/apply) — материал для
    предсказуемого UX, в отличие от одной auto-commit кнопки.

