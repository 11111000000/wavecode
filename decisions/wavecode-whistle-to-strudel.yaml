intent: |
  Добавить в wavecode `WhistlePanel` — live-инструмент транскрипции
  насвистанной мелодии в Strudel-паттерн. User whistling → mic →
  AnalyserNode → Web Worker (pitchy MPM) → Midi notes → preview-pill
  → Insert/Replace/Append в редакторе. Реализуем на той же 4-слойной
  архитектуре (domain / application / infrastructure / presentation),
  что и остальные wavecode-фичи. YIN-pipeline отделён от UI через
  чистую state-машину в `ui/src/domain/audio/whistle.ts` —
  тестируется без Web Audio.

commitment: |
  1. Pipeline getUserMedia → AnalyserNode (fft=2048, latencyHint=interactive)
     → Worker (pitchy MPM, single instance, clarityThreshold=0.9) →
     preview-буфер AudioNote[] в whistleStore.
  2. `ui/src/domain/audio/whistle.ts` — pure: `hzToMidi`, `feed(state, frame, tune?)`,
     `closeOpenNote`, `notesToSnippet`. Тестируется 28 unit-тестами
     без Web Audio (vitest, jsdom).
  3. Solid-сигналы в `ui/src/presentation/state/whistleStore.ts`
     (mirrors pianoRecStore shape): listening, state, error, previewNotes,
     currentHz, slot ∈ {append-stack, replace-score, at-cursor},
     instrument, editorFocused. Slot selector использует уже существующий
     CodeMirrorEditorApi accessor (ScorePanel.onReady).
  4. `ui/src/presentation/components/WhistlePanel.tsx` — inline
     toolbar внизу ScorePanel: mic-button + Hz-meter + slot-row +
     instrument-row + freeze/clear/apply + preview-pill + error-pill.
  5. Snippet output: `note("${names.join(' ')}").s("${instrument}")`
     (transcription, не loop). Slot selector решает куда: append в
     stack, replace score, или insert at editor cursor.

