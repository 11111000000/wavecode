outcomes:
  - id: whistle-take-has-no-drums
    statement: |
      A whistle take committed into the score contains the notes and
      NO drum layer: neither the whistle's own onset nor a
      deliberate tap reaches the snippet. The orchestrator's
      `MicCaptureLike` no longer exposes the hit buffer at all.
  - id: rhythm-button-exists
    statement: |
      The voice cluster renders THREE mini-FABs — «Голос»,
      «Свист» and «Ритм» — and the third one is a toggle that starts
      and pauses a rhythm take.
  - id: rhythm-hits-land-on-the-grid
    statement: |
      A take of two hits 125 ms apart (one 16th note at the default
      120 BPM) commits as a drum grid whose two hits sit on step 0
      and step 1 of the first bar — 16 tokens per bar, the pattern
      spanning a whole number of bars.
  - id: rhythm-preview-matches-the-commit
    statement: |
      The panel draws the pattern as a grid of four voice rows × the
      steps of the pattern, and the number of lit cells equals the
      number of hits the commit writes into the score.
  - id: rhythm-never-carries-a-tempo-override
    statement: |
      The committed rhythm pattern contains no `setCpm` — it plays
      at the transport's tempo, in the score's own time.
  - id: one-clock-in-the-mic-pipeline
    statement: |
      Every timestamp the mic pipeline produces (pitch frames,
      onsets, meter frames) is on the `performance.now()` clock, the
      same clock `stopMic` closes the open note with and the meter
      positions its peak markers with.
  - id: long-takes-are-not-truncated
    statement: |
      The segmenter's sliding window is 5 minutes wide and measured
      from the newest frame, so a take longer than 30 s keeps its
      beginning.

obligations:
  - id: rhythm-grid-arithmetic-tested
    claim: |
      `ui/src/domain/audio/rhythmGrid.test.ts` passes and covers the
      placement rules: the nearest-step snap, the whole-bar span, the
      merging of two hits on the same voice and step, and the absence
      of `setCpm` in the emitted snippet.
    acceptance:
      all:
        - verifier: tests/domain/audio/rhythmGrid.test.ts
  - id: rhythm-store-tested
    claim: |
      `ui/src/presentation/state/rhythmStore.test.ts` passes and
      covers: the mic-direct channel is claimed on start and
      released on stop, a second start fails with MicBusyError, the
      grid preview follows the hits as they arrive, and the commit
      writes the quantised pattern into the score.
    acceptance:
      all:
        - verifier: tests/presentation/state/rhythmStore.test.ts
  - id: whistle-stays-drumless
    claim: |
      The whistle's two test files pass, and both assert that the
      committed snippet of a whistle take contains no `drums_` layer.
    acceptance:
      all:
        - verifier: tests/application/voice/WhistleSession.test.ts
        - verifier: tests/presentation/state/whistleStore.test.ts
  - id: rhythm-button-tested
    claim: |
      The cluster renders three mini-FABs, the third one toggles the
      take, and a paused take keeps the panel armed.
    acceptance:
      all:
        - verifier: tests/presentation/components/RhythmMiniFAB.test.tsx
        - verifier: tests/presentation/components/VoiceFAB.test.tsx
  - id: precommit-green
    claim: |
      `npm run test:precommit` (typecheck + vitest +
      `lint:no-console` + `validate:presets`) returns exit 0 in
      `ui/`. No `any`, no `console.*`, no unused imports added by
      this patch.
    acceptance:
      all:
        - verifier: bash npm --dir ui run test:precommit
  - id: decision-validates-clean
    claim: |
      `mathc validate decisions/wavecode-rhythm-recorder.yaml`
      returns exit 0 with zero `MC-*` reject diagnostics.
    acceptance:
      all:
        - verifier: mathc validate

