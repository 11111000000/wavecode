outcomes:
  - id: wavecode-mobile-topbar-gap-outcome
    statement: |
      Между шапкой и полосой транспорта нет зазора ни в покое, ни при
      открытом нижнем листе: шапка не сжимается, её высота постоянна, а
      полоса транспорта начинается ровно под ней.
  - id: wavecode-mobile-topbar-overlap-outcome
    statement: |
      Строка состояния не наезжает на кнопки шапки на 360px, 390px и
      412px: она умеет сжиматься до многоточия, а её бокс физически
      ограничен. Точка в строке одна, состояние читается и глазом, и
      скринридером.
  - id: wavecode-mobile-topbar-budget-outcome
    statement: |
      На узком экране шапка умещается целиком: слово «wavecode» скрыто,
      «Поделиться» и «Консоль» доступны в меню «Ещё» (вместе со значком
      непрочитанных ошибок), и каждый пункт меню кликабелен — полоса
      транспорта его не перекрывает.
  - id: wavecode-mobile-ai-footer-outcome
    statement: |
      Лист ИИ на телефоне не тратит место впустую: подпись пустого
      состояния мелкая, поле ввода выше, «Применить» занимает всю ширину
      футера и стоит в ряду с чипами, а под листом нет мёртвого
      72-пиксельного резерва.
obligations:
  - id: wavecode-mobile-topbar-and-ai-footer-e2e
    claim: |
      The e2e suite pins the three complaints: the gap between the topbar
      and the transport strip is zero in idle state and with the AI sheet
      open, the status never reaches the action buttons, the narrow
      topbar hides the word and the two buttons that moved into the
      "Ещё" menu, "Поделиться" from that menu opens the share modal, and
      the AI footer has no dead space under the full-width send button.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/mobile-topbar-and-ai.spec.ts"
          result: pass
  - id: wavecode-mobile-topbar-and-ai-footer-unit
    claim: |
      The AI panel still renders its empty-state placeholder when there
      are no messages, so shortening the caption did not remove the
      placeholder.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/panels/AIEditPanel.test.tsx"
          result: pass
  - id: wavecode-mobile-topbar-and-ai-footer-quality-gate
    claim: |
      The repository quality gate is green: typecheck, unit tests,
      console lint and preset validation.
    acceptance:
      all:
        - verifier: "cd ui && npm run test:precommit"
          result: pass
  - id: wavecode-mobile-topbar-and-ai-footer-zen-guard
    claim: |
      The zen guard reports no regression against the recorded baseline:
      the stylesheet does not grow, no new surface class is introduced,
      and the focus-visible count does not shrink.
    acceptance:
      all:
        - verifier: "node scripts/check-zen-ui.mjs --targets"
          result: pass
  - id: wavecode-mobile-topbar-and-ai-footer-invariants
    claim: |
      The repository invariants hold: the four layers keep their
      boundaries, every decision file keeps its readable keys, and the
      recorded visual baseline is still reproducible.
    acceptance:
      all:
        - verifier: "node scripts/check-invariants.mjs layering && node scripts/check-invariants.mjs decisions && node scripts/capture-baseline.mjs --check"
          result: pass
  - id: wavecode-mobile-topbar-and-ai-footer-kernel-validates
    claim: |
      The decision file is structurally valid under the math-coding 3.3
      schema and keeps the keys the kernel reads.
    acceptance:
      all:
        - verifier: "mathc validate"
          result: pass
negative_control: |
  The checks have teeth in every direction the change could go wrong. If
  the topbar started shrinking again, the e2e assertion that the gap to
  the transport strip is exactly 0 (in idle state and with the AI sheet
  open) fails, and so does the assertion that the topbar height does not
  change between the two states. If the status overflowed its box again,
  the e2e check that `overflow` is `hidden` on `.wc-status` and
  `.wc-status__led`, and that the right edge of the status does not pass
  the left edge of the action buttons, fails — at 360px as well as at
  390px. If a mobile rule stopped applying (for example because an
  un-layered duplicate returned to `index.html`), the assertions that
  `.wc-topbar__title`, `.wc-topbar__share` and `.wc-topbar__console` are
  hidden fail, and so does the count of two mobile items in the "Ещё"
  menu. If the dead 72px reserve came back, the e2e check that the space
  under "Применить" is at most 24px and that the footer bottom equals
  the sheet bottom fails. If the send button went back to being an
  orphan, the check that its width exceeds the footer width minus 32
  fails. If the transport bar covered the overflow menu again, the
  "Поделиться" click in the menu would land on the transport strip and
  the share modal would never open — the e2e test fails on the missing
  `.share-modal`. If the empty-state caption grew back, the check that
  its font size is at most 12px fails.
counterexample: |
  The strongest objection is that the topbar now hides things that used
  to be one tap away: "Поделиться" and "Консоль" are two levels deep
  (tap "Ещё", then the item), and the word "wavecode" is gone entirely,
  so the brand is only the logo glyph. The objection is accepted as a
  real cost and bounded by three rules. First, the two hidden buttons
  are exactly the two that are not needed to work — the play button and
  the composition tools stay on the first tap. Second, the console
  signal is not lost: the unread-error badge moves onto the "Ещё"
  button, so the moment when a person needs the console is still
  visible from the top bar. Third, hiding the word is not a loss of
  branding but of redundancy: the logo already carries the waveform
  mark, and on a 390px screen the truncated word was rendering as
  "W…" — less legible than no word at all. The alternative — keeping
  all six buttons and shrinking the status to an icon — was rejected
  because an icon-only status is unreadable, and the status is the one
  thing the owner asked not to break.
antithesis: |
  The coherent alternative was to treat the topbar as a desktop layout
  that simply scales down: keep all six buttons, let the status shrink
  to an icon, and let the word truncate to "W…". It was rejected
  because a phone is not a small desktop — at 390px the topbar was
  136px short, so something had to give, and the two things that gave
  were the ones a phone user needs least. A second alternative was to
  move the whole overflow menu into a bottom sheet on mobile (which is
  what the component's own docstring already promised). It was
  rejected for this change because the panel is the same markup that
  works as an anchored popover, the transport-bar overlap is fixed at
  its root (stacking order), and a new sheet surface would add a layer
  the owner did not ask for. The third alternative — shrink the AI
  sheet's dead reserve only — was rejected because it left the orphan
  button and the oversized caption untouched, which is two thirds of
  the third complaint.
assumptions:
  - id: wavecode-mobile-topbar-and-ai-footer-assumption-narrow
    state: assumed
    statement: |
      The narrow-screen budget is decided at 520px, and a phone in the
      owner's hands is 360–412px wide. The status word and the two
      secondary buttons fit inside that budget, so the compact topbar
      is not a special case but the normal case on a phone.
    owner: human:operator
    consequence_if_false: |
      If wider phones need the full topbar, the breakpoint moves and the
      mobile-only menu entries disappear at the new threshold — the
      rules live in one media query, so the change is local. If even
      360px is not enough, the status becomes an icon, which is the
      alternative already considered and rejected.
  - id: wavecode-mobile-topbar-and-ai-footer-assumption-stacking
    state: assumed
    statement: |
      The transport strip and the topbar are siblings in the tree, and
      the transport strip is meant to be above ordinary page content but
      below anything the topbar opens. The topbar's own popovers must
      therefore be above the transport strip, not below it.
    owner: human:operator
    consequence_if_false: |
      If a future change moves the transport bar into the topbar's
      subtree, the raised topbar z-index becomes harmless and the
      popover can rely on its own z-index again; the hit-test in the
      e2e suite (a click on the menu item must open the modal) still
      catches a regression either way.
risk:
  declared_triggers:
    - topbar-gap-returns
    - status-overlaps-actions
    - overflow-menu-item-unreachable
    - ai-sheet-footer-wastes-space
  owner: human:operator
reversal:
  - signal: |
      The gap between the topbar and the transport strip appears again
      when a bottom sheet is opened.
    action: rework
  - signal: |
      The status word again reaches the action buttons on a phone.
    action: rework
  - signal: |
      A popover of the topbar is again covered by the transport strip.
    action: review
  - signal: |
      People complain that "Поделиться" or the console is now too hard
      to reach on a phone.
    action: review
relations:
  implements:
    - wavecode-zen-minimal-ui@2
    - wavecode-unified-input-entry@1
  refines:
    - wavecode-sound-choice-and-rhythm-feedback@1
