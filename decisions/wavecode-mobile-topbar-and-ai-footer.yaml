---
schema: math-coding/3.3
id: wavecode-mobile-topbar-and-ai-footer
revision: "1"
state: active
body_sha: "sha256:b9d547a44d66542b551ebd28f2c447bc2163f47db4166d2fb4e15ca30aac29ed"
yaml_sha: "sha256:b9d547a44d66542b551ebd28f2c447bc2163f47db4166d2fb4e15ca30aac29ed"

intent: |
  Владелец (2026-11-17) прислал два скриншота с телефона (390×844) и
  описал три дефекта:

    * «На верхней границе в заголовке есть отступ… если открываешь нижнюю
      панель (любую из нижних кнопок), появляется отступ от верхнего меню»;
    * «на Верхнем меню настраиваются друг на друга кнопки которые создать
      новую композицию и Что сейчас играет — явно не хватает места на
      мобильном»;
    * «в нижней панели… поле ввода маленькая, сверху какая-то длинная
      надпись, она должна быть мельче, снизу вообще свободное место, а
      кнопка отправить как-то криво расположена и выпадает из дизайна».

  Замеры вживую (Chromium, 390×844) подтвердили все три и добавили
  четвёртый, который владелец увидел как «накладываются»:

    * **Отступ между шапкой и полосой транспорта.** Шапка жила в
      flex-колонке с дефолтным `flex-shrink: 1`. Когда открывался нижний
      лист, `.app-body` переполнялся, и шапка сжималась с 56px до 45px
      (в покое — до 53.84px), а полоса транспорта оставалась на
      `top: var(--header-h)` = 56px. Зазор: 2.16px в покое и 11px при
      открытом листе. Это ровно тот «отступ от верхнего меню».
    * **Наложение в шапке.** Естественная ширина содержимого шапки —
      526px при доступных 390px, дефицит 136px. Шапка сжимала сама
      себя: `.wc-topbar__title` — до 10.4px (на экране «W…»),
      `.wc-status` — до 17.6px при `scrollWidth` 103px и
      `overflow: visible`. Слово «остановлен» физически вылезало из
      своего бокса и ложилось поверх кнопки «Новая композиция» (на
      скриншоте владельца кнопка стоит прямо на слове «остановлен»).
      Рядом с этим в строке статуса стояли ДВЕ точки: `::before` у
      `.wc-led` и собственный глиф «●» в тексте.
    * **Лист ИИ.** `.ai-footer` занимал 231px, из них 72px — мёртвый
      резерв `padding-bottom: calc(space-md + tabbar-h + safe-bottom)` от
      старой overlay-раскладки (лист и так в-flow, его низ упирается в
      верх рельса). Кнопка «Применить» висела сиротой справа
      (`margin-left: auto`) на отдельной строке, поле ввода было 56px, а
      надпись пустого состояния занимала пять строк кеглем `--fs-md`.
    * **Перекрытый пункт меню «Ещё» (не в жалобе, найдено при правке).**
      Поповер меню живёт внутри stacking-контекста шапки, а полоса
      транспорта — её сосед в дереве с `z-index` 52. Поэтому транспорт
      перекрывал верх поповера: `elementFromPoint` в центре первого
      пункта отдавал `app-transport-bar__strip`, а не сам пункт. Первый
      пункт меню не получал ни клика, ни hover.

  Решение фиксирует четыре исправления: несжимаемая шапка, статус,
  который умеет сжаться до многоточия и не вылезает, компактный
  мобильный бюджет шапки, переиспользованный футер листа ИИ — и
  корректный порядок слоёв, без которого третье из них не работает.

commitment: |
  1. **Шапка не сжимается.** `.wc-topbar` имеет `flex-shrink: 0`, а
     `.wc-topbar__actions` — `flex-shrink: 0`: место под кнопки забирает
     строка статуса, а не сами кнопки. Высота шапки постоянна (56px), и
     зазор до полосы транспорта равен нулю — в покое и при открытом
     нижнем листе.
  2. **Статус не вылезает и не наезжает.** `.wc-status` и
     `.wc-status__led` имеют `overflow: hidden`, вся цепочка
     (`.wc-led` → `.wc-led__label`) — `min-width: 0`, а надпись —
     `text-overflow: ellipsis`. Правый край статуса не заходит за левый
     край блока кнопок ни на 360px, ни на 390px, ни на 412px. Плашки
     «офлайн» и счётчик сэмплов получили `flex-shrink: 0` — ужимается
     строка состояния, а не сигнал.
  3. **Одна точка, а не две.** Глиф (`●` / `▶` / `⚠`) убран из текста
     строки состояния: точку рисует `::before` у `.wc-led` (несёт тон и
     ореол), а слово («остановлен» / «играет» / «ошибка») называет
     состояние. В шапке больше нет «● ● остановлен». Состояние аудио
     остаётся доступным и для скринридера: `aria-label="Звук: …"`.
  4. **Компактный бюджет шапки на ≤520px.** Скрываются: слово «wavecode»
     (рядом логотип) и кнопки «Поделиться» и «Консоль» — они уезжают в
     меню «Ещё», где на десктопе их нет (там обе кнопки есть прямо в
     шапке, и два входа в одну поверхность проект уже убирал — кнопка
     «Инструменты»). `gap` 8→6px, `padding` 12→8px. Итог 335px: запас
     55px на 390px и 25px на 360px.
  5. **Значок непрочитанных ошибок не потерян.** Он переезжает с кнопки
     консоли на кнопку «Ещё» (`data-testid="overflow-error-badge"`),
     потому что кнопка консоли на узком экране уходит в меню.
  6. **«Поделиться» — одна поверхность из двух точек.** Модалка
     вынесена из кнопки в отдельный компонент `ShareDialog` с общим
     состоянием `shareState.isOpen`; её открывают и кнопка шапки, и
     пункт меню «Ещё».
  7. **Поповер шапки не перекрывается полосой транспорта.** Шапка
     поднята на `z-index: calc(var(--z-sheet) + 14)` = 54: выше
     транспорта (52), ниже листа (53), тоста (80) и модалки (60).
  8. **Футер листа ИИ ужат.** Мёртвый резерв `padding-bottom: 72px`
     удалён; низ футера совпадает с низом листа, а низ листа — с верхом
     рельса.
  9. **«Применить» — полноширинная кнопка под чипами.** На ≤720px
     `.ai-apply-btn` получает `flex: 1 0 100%` и `margin-left: 0`:
     кнопка занимает всю ширину футера (366px при 390px экрана) и
     стоит в ряду с чипами, а не висит сиротой справа.
  10. **Поле ввода выше.** На ≤720px `textarea.ai-textarea` получает
      `min-height: 72px` (было 56px).
  11. **Надпись пустого состояния мельче.** `.ai-messages-empty` —
      `var(--fs-xs)` с `line-height: var(--lh-base)`, копия сокращена,
      а подсказка вынесена в `<small>` (`--fs-3xs`, `--fg-ghost`).
  12. **Убраны мёртвые правила и дубли.** Из `components.css` удалены
      несуществующие в разметке `.wc-topbar__logo`, `.wc-topbar__led`,
      `.app-header`, `.app-title`, `.app-header h1`, `.app-subtitle`,
      `.app-header-row1`. Из `index.html` удалены un-layered дубли
      правил шапки (`.wc-topbar`, `.wc-topbar__title`,
      `.wc-topbar__actions`, `.wc-icon-btn`): они перебивали
      `@layer components` и молча убивали мобильные правила.
  13. **Инварианты закреплены тестом.** `ui/tests/e2e/mobile-topbar-and-ai.spec.ts`
      проверяет зазор, отсутствие наложения, мобильный бюджет шапки,
      доступность «Поделиться» из меню и геометрию футера листа ИИ.

