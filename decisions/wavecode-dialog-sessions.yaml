counterexample: |
  Сильнейшее возражение: «один проект — одна композиция;
  worktree-метафора — overkill для браузерного
  live-coding'а. Сложность state-машины и миграции IDB
  не оправдана». Контраргумент: оператор явно
  сформулировал use-case: «пользователи ведут несколько
  направлений одновременно, и сейчас контексты
  смешиваются». Это та же проблема, что и в
  разработке ПО: без изоляции unit-ов работы
  невозможно ни A/B, ни безопасный эксперимент. v1
  модели (общий score, диалог per-track) решает
  половину проблемы и оставляет score общим — а это
  самый ценный контекст, и именно его оператор
  хочет изолировать. Реальная стоимость Track-модели —
  ~700 LoC плюс миграция IDB; обратно к single-композиции
  откатиться стоит столько же, если потребуется.

  Второе возражение: «на мобиле selector будет
  неудобен». Контраргумент: selector делается
  horizontal-scroll chips (как в tab-bar) — это
  уже знакомый pattern в wavecode. Если UX
  провалится, reversal `rework` под UI-полировку.

antithesis: |
  (1) «Оставить single-composition, дать
  пользователю manual export/import score в виде
  файла, плюс текстовое поле для заметки "в каком
  направлении работаем"». Возражение: ручной
  export/import не решает задачу «переключиться
  обратно к состоянию 5 минут назад» — для этого
  нужен undo или явный save. А undo без persistence
  теряет работу при reload. Текстовое поле «в каком
  направлении» — это подсказка LLM, а не изоляция
  контекста; LLM всё равно видит чужой score и
  путается.

  (2) «Track = просто "name" + "score" + "messages",
  без lifecycle». Возражение: без `state` нет
  способа отличить «работаю над этим сейчас» от
  «закончил вчера, оставил как reference». LLM-
  промпт одинаков для активного и архивного
  трека, но UI должен по-разному их показывать.
  Draft-state дополнительно позволяет явно отметить
  «идея, ещё не отправлено ни одного запроса» —
  эта разница теряется без маркера.

  (3) «Сделать Track только в памяти, без
  persistence в IDB». Возражение: тогда reload
  стирает всю работу — это и есть исходная
  жалоба. Persistence обязательна.

  (4) «Сделать switch-track без audio.stop+eval —
  пусть юзер сам нажмёт play». Возражение: тогда
  «активный трек» = «тот, чей score в редакторе»,
  но «звучит» = «другой». Это самый
  запутанный UX, который был раньше (когда
  редактировали код во время play и слышали
  старый). Авто-stop+eval устраняет этот класс
  багов. Reversal: `rework` если юзеры будут
  жаловаться на автоплей.

  (5) «Делать по одному таску в kanban, с прогресс-
  стримом». Возражение: оператор явно попросил
  «одним PR, без kanban». math-coding/3.3
  (этот файл) — audit-trail без отдельной
  системы. Kanban-streaming избыточен для одного
  PR.

  (6) «Запустить parallel multi-agent (по одному
  LLM на трек)». Возражение: за рамками этого
  решения. Один активный трек = один LLM-stream.
  Multi-agent добавим, если оператор попросит, в
  отдельном решении.

