outcomes:
  - id: track-entity-and-state
    statement: |
      `ui/src/domain/types.ts` экспортирует `Track` со
      всеми восемью полями и `TrackState =
      'draft'|'active'|'archived'`; `AppState` содержит
      `tracks: ReadonlyArray<Track>` и `activeTrackId:
      string`; поля `score` и `messages` верхнего уровня
      удалены.
  - id: per-track-score-and-history
    statement: |
      `AppState.tracks[i].score` — единственное место
      хранения score; `AppState.tracks[i].messages` —
      единственное место истории диалога. `applyEdit`
      берёт оба значения из `tracks.find(t => t.id ===
      activeTrackId)`, не из глобального state.
  - id: switch-track-auto-eval
    statement: |
      Событие `switchTrack` (через
      `audioActions.applySwitchTrack` или эквивалентный
      side-effect) выполняет `audio.stop()` +
      `audio.eval(track.score)` атомарно; после успешного
      `eval` в редакторе CodeMirror виден новый score.
  - id: idb-migration
    statement: |
      `IDBRepo.loadTracks` поднимает legacy
      `wavecode-score-v6` + `wavecode-messages-v6` в один
      `Track{id:'default'}`; после записи нового
      состояния старые ключи удаляются.
  - id: ui-track-selector
    statement: |
      `AIEditPanel` рендерит Track selector с шестью
      кнопками; список отрендеренных сообщений — это
      `tracks[activeIdx].messages`, не глобальный массив.
      В `HelloPanel` счётчик сообщений
      `appStore.messages.length` заменён на
      `tracks[activeIdx].messages.length`.
  - id: last-track-cannot-delete
    statement: |
      Когда `tracks.filter(t => t.state !== 'archived')
      .length === 1`, кнопка «удалить трек» отключена
      с tooltip; reducer событие `deleteTrack` отвергает
      удаление с сохранением state.

