intent: |
  Заменить single-composition модель (один `AppState.score` +
  один `AppState.messages`) моделью **Track** — самостоятельной
  единицей работы, в духе git worktree + AI-agent session:
  каждый трек несёт собственный `score`, собственную историю
  диалога с LLM и собственный жизненный цикл
  (`draft → active → archived`). Активный трек определяет,
  какой score виден в редакторе, какой eval'ится в audio
  и какая история диалога отправляется в LLM. Переключение
  трека — атомарный swap: audio.stop, загрузка нового
  score в редактор, audio.eval нового score. Score
  глобальным больше не существует; редактор/аудио/LLM
  всегда работают с активным треком.

axiom_link:
  - A1
  - A4

commitment: |
  1. `ui/src/domain/types.ts` определяет `Track`
     (`id`, `title`, `state: 'draft'|'active'|'archived'`,
     `score: Score`, `messages: ReadonlyArray<Message>`,
     `createdAt`, `updatedAt`, `lastActiveAt`). `AppState`
     теряет поля `score` и `messages`; получает
     `tracks: ReadonlyArray<Track>` и `activeTrackId: string`.
     Поле `score` в `Track` — единственный источник истины
     для редактора/аудио/LLM.
  2. Reducer (`ui/src/application/reducer.ts`) обрабатывает
     события: `createTrack`, `switchTrack`, `archiveTrack`,
     `restoreTrack`, `deleteTrack`, `renameTrack`,
     `clearTrackDialog`. Старые `userMessage`,
     `assistantMessage`, `replaceScore`, `editScore`,
     `undoScore`, `redoScore`, `commitHistoryCheckpoint`,
     `clearMessages` переписаны: они маршрутизируют
     мутации в активный трек (`state.tracks.find(t =>
     t.id === activeTrackId)`). `score`/`messages` на
     верхнем уровне `AppState` больше нет.
  3. `applyEdit` (`ui/src/application/useCases/llmEdit.ts`)
     принимает `activeTrack: Track | undefined` и читает
     историю только из него; в LLM уходят последние
     N ≤ 20 сообщений именно этого трека. System prompt
     остаётся глобальным (per-track prompt — вне scope).
  4. `switchTrack` reducer event дополнительно через
     side-effect (в `presentation/state/audioActions.ts`)
     триггерит `audio.stop()` + `audio.eval(newScore)`.
     Audio всегда синхронизирован с активным треком; нет
     ситуации «score в редакторе X, играет Y».
  5. `IDBRepo` (`ui/src/infrastructure/repo/IDBRepo.ts`)
     переходит на ключи `wavecode-tracks-v1` и
     `wavecode-active-track-id-v1`. Если в IDB есть
     legacy `wavecode-score-v6` и/или
     `wavecode-messages-v6`, они мигрируют в один
     `Track { id: 'default', title: 'Главный', state:
     'active', score: <legacy>, messages: <legacy> }` с
     `activeTrackId = 'default'`. Старые ключи удаляются
     через `del` после успешной записи нового состояния.
  6. `AIEditPanel` (`ui/src/presentation/panels/AIEditPanel.tsx`)
     рендерит Track selector (dropdown или горизонтальные
     chips — выбирается в UI-эпике) с кнопками
     «+ новый», «✎ переименовать», «🗑 очистить диалог»,
     «⨯ удалить трек», «⏏ в архив», «↩ из архива».
     Удаление последнего активного (`active` или `draft`)
     трека запрещено с подсказкой «нельзя удалить
     единственный трек — сначала создайте новый или
     очистите диалог». Архивный трек нельзя удалить
     (его можно только восстановить).
  7. Старая кнопка «новая композиция» (`App.tsx onNew`)
     больше не очищает score — она создаёт **новый
     draft-трек** и переключается на него. Score
     прежнего активного трека сохраняется в этом
     треке (ничего не теряется).

