outcomes:
  - id: landing-mount-triggers-preload
    statement: |
      `Landing.onMount` calls `preloadLandingSamples()`, which
      dynamically imports `~/infrastructure/audio/SampleLoader`
      and invokes `loadAllSamples()` exactly once. The preload
      runs in the background via the existing ServiceWorker +
      decode-Worker pipeline (no main-thread block).
  - id: progress-badge-visible-on-landing
    statement: |
      While `wavecode:sample-progress` events carry
      `status: 'loading'`, a small pill containing
      "N/M семплов" + a progress bar appears in the top-right
      corner of the landing surface. The pill is hidden once
      `status` transitions to `'loaded'` (the same
      `<SampleProgressBadge />` component the BottomBar uses).
  - id: sample-based-preset-preview-runs-full-mix
    statement: |
      After the preload resolves, tapping ▶ on a sample-based
      preset (Creep, Hip-hop, Trap) on `SnippetShowcase`
      evaluates the full preset score in `LiveAudioEngine` and
      the drum / synth layers all sound — no
      "sound <X> not found" errors in the console.
  - id: idempotent-against-app-bootstrap
    statement: |
      Navigating from `/` to `/#/app` does NOT cause a second
      `samples()` registration or a second decode-Worker pass.
      The second call from `useAppBootstrap` short-circuits
      inside `SampleLoader` because each bank's
      `BankState.status === 'loaded'` after the first call.
  - id: mathc-3-3-decision-recorded
    statement: |
