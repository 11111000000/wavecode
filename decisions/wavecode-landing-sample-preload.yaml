intent: |
  Pre-load the Strudel sample banks (piano + drums + synth) on
  the landing route (`/`), so that tapping a per-card preset
  preview on SnippetShowcase delivers the advertised full mix —
  including kick, snare, hat, and crash — instead of falling
  through `getTrigger` with "sound <X> not found" and only
  playing the synth layer. The fix is a fire-and-forget
  background preload fired from the Landing page's onMount; the
  existing `SampleLoader.loadAllSamples()` API is reused, the
  existing `SampleProgressBadge` event-listener wiring powers a
  small corner pill on landing, and SampleLoader's per-bank
  short-circuit (`state.status === 'loaded'`) keeps the call
  idempotent against the later `/app` route's `useAppBootstrap`
  trigger.

commitment: |
  Add `preloadLandingSamples()` to
  `ui/src/presentation/components/landing/preloadLandingSamples.ts`,
  call it from `Landing.onMount`, render `<SampleProgressBadge />`
  inside a `.l-sample-progress-corner` wrapper at the top-right
  of the landing surface, and add the corresponding
  `decisions/wavecode-landing-sample-preload.yaml` mathc-3.3
  decision file. Behavior: the preload fires once per session as
  soon as the Landing mounts, runs in the background through the
  existing ServiceWorker + decode-Worker pipeline, and the
  existing `useAppBootstrap` call on the later `/#/app` route
  short-circuits to a no-op (no double-registration, no double
  worker decode, no double network fetch).

