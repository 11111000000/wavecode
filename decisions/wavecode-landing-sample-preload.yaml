    - progress-badge-overlaps-topnav-cta-on-narrow-viewport
  owner: human:operator

counterexample: |
  "Landing is a marketing surface — visitors rarely tap a
  preview, so the preload is wasted bandwidth on every visit
  for the 70%+ who bounce without previewing." Counter: the
  SW cache absorbs subsequent visits (no re-fetch), the
  decode-Worker runs off the main thread so the read-through
  is not blocked, and the cost is ~1 MB MP3s that the user
  WILL need anyway the moment they navigate to `/#/app` or
  back. The bytes-not-fetched-on-bounce saving (≈1MB/visitor)
  is dwarfed by the bytes-not-fetched-on-engaged-visit saving
  (≈0; both paths load the bank, just at different times).

antithesis: |
  "Don't preload on landing. Wait until the visitor taps a
  card — at that moment we KNOW the user wants audio and we
  can fetch + decode on demand. Preloading speculatively burns
  the user's bandwidth on every marketing-page load, including
  the 70%+ who bounce without previewing anything, and it adds
  a competing network burst during the very first second of
  page load when the marketing page is still rendering."

  Rejected because: (a) the cost is bounded — ServiceWorker
  precache already ships most of the bank bytes on first
  install (see `.workboxWindow` registration in
  `useAppBootstrap`/`useBootstrap` chain); the landing
  preload only re-confirms registration in the live
  soundMap, it does NOT pull new bytes in steady state. (b)
  the latency budget for "tap preview → first hap" is what
  the visitor judges: a 500ms decode race on first tap
  surfaces as "click and nothing happens for half a second,
  then drums kick in" — that is the bug we are fixing.
  (c) the user who bounces pays nothing extra; the user who
  engages pays the same bandwidth they would have paid on
  the `/#/app` route, just paid earlier in the session.
  (d) SampleLoader.loadAllSamples is idempotent — double
  calls on landing-then-app navigation are a free no-op.

