axiom_link:
  - A0
  - A3

intent: |
  Пользователь сообщил о трёх симптомах голосового ввода, которые
  мы НЕ смогли воспроизвести ни тестами, ни чтением кода как
  одну поломку — и попросил проанализировать, можно ли перенести
  запись целиком на серверный вариант, починить текущий, и
  «сделать бэкенд, который работает быстро и надёжно и всегда».

  Журнал `stt-web.service` за 24 часа ДО этого решения закрыл
  половину вопроса эмпирически: 8 POST-запросов к
  `/v1/audio/transcriptions`, все `200 OK`, ни одной ошибки,
  латентность 2.6-5.2 с, корректная русская расшифровка, User-Agent
  — Chrome/155 Mobile с `wavecode.kosov.online`, то есть реальный
  пользовательский трафик этого приложения. Вывод: бэкенд УЖЕ
  существует и исправен; строить второй — значит потратить работу
  на дублирование работающей подсистемы.

  Все четыре дефекта — в клиенте. Ниже они названы так, как их
  увидит пользователь, а не так, как они выглядят в коде.

  (1) «Запись идёт не сразу». `VITE_STT_BACKEND` не был задан →
      `auto` → в любом Chrome резолвится Web Speech. В Chrome
      нет распознавателя за Speech-объектом: он стартует и молчит.
      `FallbackSTT` не отличает «ещё не начал» от «начал и молчит»
      и тратит `WATCHDOG_MS = 2_500` на каждый press. Итого
      ~8 с тишины до первого слова — и отправка голоса в Google,
      что прямо противоречит
      `AngaraConfig/KB/30_decisions/llm-proxy-audio-route-2026-10-20.md`,
      где в таблице сравнения сам Cloud-STT помечен как «утечка
      голоса наружу».

  (2) «Повторное нажатие не работает». `stopVoiceAI()` оставлял
      FSM в `paused`, а в `fromPaused` НЕ БЫЛО ветки `arm`.
      Второе нажатие → `dispatch({arm})` = no-op →
      `dispatch({stt-ready})` = no-op → `chunk` = no-op.
      Микрофон писал, аудио уходило на сервер, whisper
      возвращал текст, и reducer его ВЫБРАСЫВАЛ. Панель не
      менялась. Ровно то, что описал пользователь.

  (3) «Отжал — take пропал». `ServerWhisperSTT.stop()` был
      отменой без отправки. Единственные загрузки — interim-тик
      раз в 2.5 с или silence-flush через 1.3 с тишины, и то
      только пока палец НЕ отпущен. Фраза короче тика при
      естественном жесте «зажать, сказать, отпустить» не
      отправлялась вообще. Это же объясняет 1.7-секундные клипы
      в журнале сервера — доезжали только те take, где
      пользователь случайно задержался на середине фразы.

  (4) «ЛМ парсинг не удался». Голосовой путь вызывал
      `audio.eval(cleanedScore)` и на этом заканчивал. Ни одного
      `dispatch({type:'replaceScore'})` во всём
      voice-пути — микрофон, свисток, пианино и AIEditPanel его
      делают, голос был единственным исключением. Правка
      проигрывалась, а буфер редактора не менялся.

commitment: |
  (1) `fromPaused` получает ветку `arm` → `listening` с
      СОХРАНЕНИЕМ транскрипта. Именно в `listening`, а не через
      `arming`: `fromArming + stt-ready` выделяет СВЕЖИЙ
      транскрипт и выбросил бы уже сказанное. `stt-ready`,
      приходящий из `listening`, — no-op, поэтому
      стартовая последовательность оркестратора остаётся
      корректной. Симметрично существующей ветке `arm` в
      `fromReview`.

  (2) `ServerWhisperSTT.stop()` перестаёт быть отменой: он
      зовёт `requestFlush()` — тот же silence-flush-путь. Идемпо-
      тентен по построению: no-op, если flush уже идёт (тишина
      1.3 с успела раньше) или если `released` (потребитель сам
      снёс take). Отмена остаётся у `dismiss`, который
      прерывает subscriber-фибру ДО вызова `stt.stop()`, а значит
      приводит `released` в true и делает flush no-op'ом.

  (3) `VoiceAISession.stop()` перестаёт делать `pause` первым.
      Порядок здесь и есть исправление: раньше FSM уходил в
      `paused` до того, как приходил финальный chunk, а
      `fromPaused` не имел ветки `chunk`. Теперь `stop()` зовёт
      `stt.stop()`, держит FSM в `listening`, и ждёт завершения
      subscriber-фибры (`Fiber.await` под потолком
      `DRAIN_MAX_MS = 12_000` — в happy path это один
      server-раундtrip). Редуктор сам проходит
      listening → transcribing → review, что и нужно
      пользователю: текст перед глазами, «→ В ИИ» доступна,
      следующий press дописывает в тот же take.
      `teardownSubscriber` остаётся для `dismiss` и
      `enterReview` — там take действительно выбрасывается.

  (4) `VoiceSessionDeps` получает `onApplied?: (score) =>
      void`, который оркестратор зовёт с очищенным скором
      успешного маршрута. `application/` не имеет права импортировать
      `presentation/`, поэтому write-back внедряется сверху:
      `voiceAIStore` передаёт
      `dispatch({type:'replaceScore', text})` — тот же вызов,
      который уже делают `AIEditPanel`, `micStore`,
      `whistleStore` и `pianoRecStore`.

  (5) `start` ждёт незавершённый release-drain (`drainRef`).
      FAB зовёт `stop` из pointerup и НЕ ждёт его — это жест,
      блокировать его на сети нельзя. Поэтому без барьера
      повторное нажатие внутри окна в ~4 с доходило до `start`
      при живом flush: `arm` из `listening` (который по контракту
      сбрасывает транскрипт) и жёсткий `aborted` от
      single-recording-guard движка. Дренирование живёт на своей
      фибре, `stop` сам ждёт исхода (callers полагаются на
      settled-FSM), а `start` просто присоединяется.

  (6) `VITE_STT_BACKEND` по умолчанию становится `server`.
      Цепочка fallback'а НЕ удалена — `auto` и `web` её
      по-прежнему выбирают, для A/B облака. Просто пользователь
      больше не получает её случайно.

  (7) `voiceAIFlushing` — presentation-сигнал между «палец
      отпущен» и «транскрипт пришёл». Без него панель
      замирала на «записываю… 3 с» на те ~4 с, что уходит на
      раундtrip, — то есть на время, которое выглядит как
      зависание. Тот же мотив, по которому
      `wavecode-voice-rec-and-meter` отказался рисовать
      фейковую метру.

  (8) `npm run test:precommit` (tsc strict + 114 vitest-файлов +
      lint:no-console + validate:presets) завершается exit 0.

counterexample: |
  «Бэкенд всё равно нужен свой — текущий на angara-1 это
  один 4-vCPU хост, а под нагрузкой те же 2 секунды аудио
  обрабатывались 121 секунду (это зафиксировано в ADR
  `llm-proxy-audio-route-2026-10-20`). Надо поднять
  отдельный сервис под голос». Возражения: (a) журнал
  показывает 8 запросов за 24 часа и 100% успеха — при такой
  нагрузке «надёжно» уже выполнено, а не обещано;
  (b) узкое место ADR уже называет и уже сделало
  настраиваемым: `services.stt-web.threads` — понижается при
  просадке хоста без переписывания сервиса; (c) проблема,
  которую видел пользователь, воспроизводится целиком на
  клиенте — четыре бага ниже не требуют ни одной серверной
  правки, и починка бэкенда не изменила бы ни один симптом;
  (d) новый сервис — это новая точка отказа в дополнение к
  работающей, а ADR `llm-proxy-audio-route-2026-10-20`
  прямо позиционирует стек «whisper-cpp из nixpkgs + HTTP-
  обёртка» как «остаточная работа — обёртка, а не новый
  ML-стек». Строить второй стек — ровно то, от чего этот ADR
  предостерегает.

  «Запись вообще должна идти через WebSocket на сервер, раз
  уж мы всё равно на сервере — там можно честно стримить
  partial-ы без перезагрузки всего клипа». Возражения:
  (a) этот репозиторий — SPA без серверных компонентов
  (`AGENTS.md`), всё разворачивается копированием статики в
  `/var/lib/wavecode/dist`; появление WebSocket-сервера
  означает переход на модель с процессом, HealthChecks и
  рестартами — не «починить запись», а смена формы
  развёртывания; (b) измеренная латентность 2.6-5.2 с при
  encode, не зависящем от длины аудио (окно 30 с), означает,
  что стриминг partial-ов не сокращает латентность первого
  ответа — он сокращает только последние ~2 с на длинных
  take; (c) окупаемость несоразмерна: четыре бага ниже
  съедали 100% пользовательского недовольства, и все четыре
  лечатся в клиенте.

  «Просто вернуть `arm` в `fromPaused` и починить
  re-press, а flush-on-release считать отдельной фичей».
  Возражения: без (2) нажатие-отпускание теряет всё, что
  короче 2.5 с, то есть ремонтируется ровно тот же жест,
  который пользователь считает сломанным. Половинчатая
  правка оставила бы баг, воспроизводимый чаще, чем
  re-press (у паузы внутри hold ещё есть шанс сработать,
  а у отпускания — нет).

antithesis: |
  (1) «`stop()` не должен стримить — отмена должна остаться
  отменой, а take пусть доливается через silence-flush, как
  задумано». Возражения: silence-flush требует 1.3 с
  тишины НЕ ОТПУСКАЯ кнопку, а пользователь отпускает —
  и take пропадает. Для gesture «зажать-сказать-отпустить»,
  который и есть основной, отмена несовместима с
  использованием. `dismiss` остаётся отменой, и это
  правильное место для неё.

  (2) «Пусть `stop()` всё-таки делает `pause`, а
  `fromPaused` научится принимать `chunk`». Возражения:
  тогда панель останется в live-body с текстом и без формы
  «→ В ИИ» — отправка потребовала бы ещё одного жеста
  поверх уже произнесённого, то есть UX станет хуже
  именно в том сценарии, который чиним. Кроме того, `pause`
  до дренирования стрима — это гонка: chunk может
  прийти и до, и после. Дренирование в `stop()` делает
  порядок детерминированным.

  (3) «Держать транскрипт в `arming` ради чистоты —
  `arming` ведь и означает "будущий listening"». Возражения:
  `arming` — это `{tag:'arming'}` без транскрипта в принципе
  (см. `initialVoiceSession`); чтобы сохранить буфер,
  пришлось бы расширить тип состояния и все его
  потребители. Прямой переход в `listening` дешевле и
  уже доказан на `fromReview`.

  (4) «Раз Web Speech не работает в Chrome, удалить его
  совсем вместе с `FallbackSTT` — меньше кода». Возражения:
  `auto`/`web` остаются как явный инструмент A/B; их
  удаление — отдельное решение со своим профилем
  обратимости, и оно не является частью починки. Здесь
  меняется только значение по умолчанию.

  (5) «Заодно убрать confirm-before-send: STT на нашем
  сервере достаточно точен». Возражения: `decision
  wavecode-voice-confirm-before-send` зафиксировал
  обратное осознанно (одна ошибка распознавания молча
  портит скор), и подтверждение работает — жалоба была
  не на лишний шаг, а на то, что до формы не доходили
  вовсе.

