outcomes:
  - id: arm-from-paused-resumes-take
    statement: |
      `voiceSession.test.ts > voiceSessionReducer — take
      continuation after release`: `fromPaused + arm` даёт
      `listening` с `transcript.final === 'первая фраза'`,
      а последующий `final` дописывает: итоговый буфер
      `'сделай тише и добавь немного ритма'` доходит до
      `review.editedText`.
  - id: release-ships-the-take
    statement: |
      `ServerWhisperSTT.test.ts`: `stop() flushes the take to
      the server instead of discarding it` — ровно один POST;
      `stop() emits the flushed transcript as a final chunk` —
      ровно один `final` с текстом. Именно `final`, потому
      что только его оркестратор поднимает в буфер review.
  - id: server-is-the-default-engine
    statement: |
      `selectSttLayer.test.ts`: `parseSttBackend(undefined)`,
      `parseSttBackend('')`, `parseSttBackend('nonsense')` →
      `'server'`. `auto` и `web` по-прежнему доступны явно.
  - id: routed-score-reaches-the-editor
    statement: |
      `VoiceAISession.test.ts > hands the routed score back for
      the editor write-back`: `onApplied` вызывается ровно один
      раз и получает очищенный скор маршрута.
  - id: re-press-mid-flush-waits-out-the-drain
    statement: |
      `VoiceAISession.test.ts > re-press during the release flush >
      waits out the in-flight drain instead of colliding with it`:
      второй press, не дожидаясь `stop`, даёт settled FSM
      `listening` с `transcript.final === 'первая фраза'`. Сохранённый
      транскрипт — sharp-наблюдение: если бы drain не завершился
      первым, `arm` ушёл бы из `listening`, а `fromListening + arm`
      сбрасывает буфер по контракту.
  - id: no-frozen-recording-counter-during-flush
    statement: |
      `voiceAIFlushing` поднимается в `stopVoiceAI` и
      сбрасывается зеркалом FSM при выходе из `listening`;
      `RecordingPanel` рендерит «распознаю…» вместо
      «записываю… N с» на этом окне.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + 114
      vitest-файлов, 1834 теста + lint:no-console +
      validate:presets) завершается exit 0.
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-voice-take-continuation.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.

obligations:
  - id: rearm-keeps-transcript
    claim: |
      `voiceSession.test.ts` содержит три теста в `describe
      ('voiceSessionReducer — take continuation after release')`,
      включая `arm from paused resumes listening with the
      transcript intact`, который падает при удалении ветки
      `arm` из `fromPaused` (проверено мутацией: 4 теста падают).
    acceptance:
      all:
        - verifier: vitest-run-voice-session-domain
          result: pass
  - id: release-flushes-instead-of-cancels
    claim: |
      `ServerWhisperSTT.test.ts` содержит `stop() flushes the
      take to the server instead of discarding it` и `stop()
      emits the flushed transcript as a final chunk`.
    acceptance:
      all:
        - verifier: vitest-run-server-whisper-stt
          result: pass
  - id: stop-drains-before-parking
    claim: |
      `VoiceAISession.test.ts` содержит `a released take lands
      in review instead of being discarded` и `a silent release
      parks in paused and the next press still works`.
    acceptance:
      all:
        - verifier: vitest-run-voice-session-orchestrator
          result: pass
  - id: two-presses-one-send
    claim: |
      `VoiceAISession.test.ts > re-pressing appends to the same
      take and one send ships both phrases`: после двух
      press/release `review.editedText` содержит обе фразы,
      `rec.llmCalls === 1`.
    acceptance:
      all:
        - verifier: vitest-run-voice-session-orchestrator
          result: pass
  - id: drain-barrier-clears-the-transcript-reset-race
    claim: |
      `VoiceAISession.test.ts` содержит `re-press during the
      release flush`; тест падает при удалении ожидания
      `drainRef` из `start` (проверено мутацией).
    acceptance:
      all:
        - verifier: vitest-run-voice-session-orchestrator
          result: pass
  - id: score-written-back-to-editor
    claim: |
      `VoiceAISession.test.ts > hands the routed score back for
      the editor write-back` и вручную: `grep -rn
      'replaceScore' ui/src/presentation/state/voiceAIStore.ts`
      показывает `dispatchApp({ type: 'replaceScore', text:
      score })` внутри `onApplied`.
    acceptance:
      all:
        - verifier: vitest-run-voice-session-orchestrator
          result: pass
        - verifier: text-scan-replace-score
          result: pass
  - id: server-default-no-cloud-leak
    claim: |
      `selectSttLayer.test.ts` фиксирует `server` как значение
      по умолчанию, и `resolveSttEngine('server', caps(true,
      true)) === 'server'` — то есть при наличии Web Speech в
      браузере он всё равно не выбирается.
    acceptance:
      all:
        - verifier: vitest-run-select-stt-layer
          result: pass
  - id: precommit-gate-green
    claim: |
      `cd ui && npm run test:precommit` завершается exit 0.
    acceptance:
      all:
        - verifier: pnpm-ui-test-precommit
          result: pass
  - id: mathc-validate-clean
