    - ui/src/styles
    - ui/src/App.tsx
    - ui/src/index.css
    - ui/tests/e2e
    - scripts/check-zen-ui.mjs
    - scripts/zen-ui-baseline.json
  capabilities:
    - ui-visual-language
    - ui-information-architecture
    - ui-accessibility
    - ui-content-truthfulness
  exclusions:
    - ui/src/domain
    - ui/src/application
outcomes:
  - id: wavecode-zen-ui-implementation-outcome-navigation
    statement: |
      В оболочке приложения четыре пункта рельса и один лист
      «Инструменты»; нижняя панель из восьми вкладок отсутствует, а
      ИИ открывается слоем поверх холста, а не панелью рядом с ним.
  - id: wavecode-zen-ui-implementation-outcome-visual-noise
    statement: |
      В стилях нет обращений к несуществующим токенам и литералов
      цвета вне `tokens.css`; свечения удалены; бесконечная анимация
      осталась одна — функциональная, у индикатора загрузки.
  - id: wavecode-zen-ui-implementation-outcome-reachability
    statement: |
      Каждый инструмент реестра открывается из состояния покоя не
      более чем за два действия; состояние «реализовано, но не
      выведено» больше невозможно.
  - id: wavecode-zen-ui-implementation-outcome-input
    statement: |
      Голос и ритм доступны через одну плавающую кнопку и один док с
      явным переключателем «Голос | Ритм»; логика ритма перенесена из
      ветки `feat/rhythm-recorder` без второй кнопки.
  - id: wavecode-zen-ui-implementation-outcome-truth
    statement: |
      README, лендинг и e2e-ожидания не обещают того, чего нет:
      промпт с лендинга применяется через ИИ, MIDI и WAV-экспорт
      доступны в листе «Экспорт».
obligations:
  - id: wavecode-zen-ui-implementation-guard-targets
    claim: |
      The zen guard reports the phase-1 targets met: no dangling token
      reference, no hardcoded colour outside the token file, at most one
      infinite animation, and no regression against the recorded
      baseline.
    acceptance:
      all:
        - verifier: "node scripts/check-zen-ui.mjs --targets"
          result: pass
  - id: wavecode-zen-ui-implementation-quality-gate
    claim: |
      The repository quality gate is green: typecheck, unit tests,
      domain lint and preset validation.
    acceptance:
      all:
        - verifier: "cd ui && npm run test:precommit"
          result: pass
  - id: wavecode-zen-ui-implementation-registry-test
    claim: |
      The tool registry keeps four rail items, opens every tier-2 tool
      in its own layer and is searchable.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/state/toolRegistry.test.ts"
          result: pass
  - id: wavecode-zen-ui-implementation-reachability-e2e
    claim: |
      The navigation exposes exactly four rail items, the tools sheet
      with search, and the ⌘K palette; every tier-2 tool opens from the
      sheet.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/tool-reachability.spec.ts"
          result: pass
  - id: wavecode-zen-ui-implementation-kernel-validates
    claim: |
      The decision file is structurally valid under the math-coding 3.3
      schema.
    acceptance:
      all:
        - verifier: "mathc validate"
          result: pass
negative_control: |
  `scripts/check-zen-ui.mjs --targets` has teeth: removing a single
  token definition (`--space-md`) from a scratch copy of
  `ui/src/styles/tokens.css` raises `danglingRefs` from 0 to 193 and
  the guard exits 1. The registry test has teeth as well: adding a
  fifth tier-1 tool to `TOOLS` breaks the expectation of exactly four
  rail items in `toolRegistry.test.ts`.
counterexample: |
  The strongest objection is that the redesign removes affordances the
  user was used to — eight visible tabs, a permanently open AI panel, a
  direct Piano tab — and that hiding them behind one sheet makes the
  product feel emptier than before. The objection is acknowledged, and
  it is answered by the reachability guarantee: every removed surface
  is one action away and is covered by a test, while the default view
  drops from about 49 interactive regions to at most 20.
antithesis: |
  The coherent alternative was to keep the tab bar and only clean up
  the CSS layer (phase 1 alone). It was rejected because the audit
  showed the overload is structural, not cosmetic: two contradictory
  navigation contracts are active in the decision corpus, and the
  eight-tab bar is what makes the AI panel and the piano disclosure
  compete for the same attention.
assumptions:
  - id: wavecode-zen-ui-implementation-assumption-keyboard
    state: assumed
    statement: |
      Keyboard operation is a first-class path, not a fallback: the
      focus ring, focus trap and keyboard piano are treated as part of
      the interface, not as an accessibility afterthought.
    owner: human:operator
    consequence_if_false: |
      If the audience is exclusively touch, the focus-trap work has
      lower priority than the rhythm capture surface.
risk:
  declared_triggers:
    - tool-reachability-regression
    - time-to-first-sound-regression
    - focus-visibility-regression
    - navigation-contract-ambiguity
  owner: human:operator
reversal:
  - signal: |
      Reachability e2e fails for a shipped tool, or users report that a
      tool "disappeared" from the interface.
    action: rework
  - signal: |
      Time to first sound gets worse against the pre-change baseline.
    action: review
