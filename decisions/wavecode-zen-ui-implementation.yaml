intent: |
  Решение владельца (2026-11-15): после аудита и плана
  (`docs/2026-11-15-zen-ui-plan.md`) направление утверждено целиком,
  спорные вопросы закрыты по рекомендациям аудита, и владелец
  потребовал реализовать всё по фазам.

  Это решение фиксирует ЧТО именно реализовано в фазах 0–5 и чем
  это проверяется. Фазы 6–7 (тишина по умолчанию и замер) остаются
  запланированными и будут отдельным решением.

  Реализовано:
    * Фаза 0 — правда: лендинг, README и e2e-ожидания приведены в
      соответствие с тем, что реально есть в интерфейсе.
    * Фаза 1 — токены Zen v1: 25 висящих `var(--x)` → 0, 14
      литералов цвета → 0, 25 бесконечных анимаций → 1, свечения
      удалены, радиусы сведены к двум ступеням, минимальный кегль
      11 px.
    * Фаза 2 — доступность: фокус-ловушка и возврат фокуса в
      листах, видимый фокус на рельсе и в палитре, `aria-live` для
      диалога ИИ, программная метка редактора, доступное имя у
      кнопки «Поделиться», клавиатурная игра на пианино.
    * Фаза 3 — структура: рельс из четырёх пунктов вместо восьми
      вкладок, один лист «Инструменты», палитра команд `⌘K`,
      ИИ переехал из панели рядом с холстом в слой поверх него,
      удалён дубль `TransportPanel` и панель состояния из потока.
    * Фаза 4 — вход: голос и ритм делят одну плавающую кнопку и
      один док с явным переключателем «Голос | Ритм».
    * Фаза 5 — инструменты-сироты: MIDI и WAV-экспорт выведены в
      лист «Экспорт», промпт с лендинга больше не становится кодом
      (он идёт в ИИ, а партитура остаётся играбельной), закрытие
      селектора с несохранённым черновиком спрашивает подтверждение.
commitment: |
  1. **Реестр инструментов — источник правды.** `toolRegistry.ts`
     описывает каждый инструмент; рельс, лист «Инструменты», палитра
     команд и e2e-проверка достижимости строятся из него.
  2. **Пять структурных поверхностей.** Холст, рельс, транспорт,
     входной док, лист «Инструменты». Восьми вкладок внизу нет.
  3. **Одна плавающая кнопка.** Голос и ритм — режимы одного дока;
     третья FAB-кнопка не вводится.
  4. **Ни одного висящего токена.** `node scripts/check-zen-ui.mjs
     --targets` падает при `danglingRefs > 0`, `hardcodedColors > 0`,
     `infiniteAnimations > 1`.
  5. **Каждый инструмент достижим за ≤ 2 действия** из состояния
     покоя — это проверяется e2e, а не обещанием.
  6. **Лендинг не обещает несуществующего.** Промпт с лендинга — это
     инструкция ИИ, а не код; стартовая композиция играбельна.
axiom_link:
  - A1
scope:
