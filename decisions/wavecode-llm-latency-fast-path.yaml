axiom_link:
  - A0
  - A3

intent: |
  2026-11-02 пользователь сообщил: «Ответ от нейросети идёт слишком долго —
  что при распознании голоса, что при собственно получении кода». Подозрение
  выдвинуто верное: выбранная модель размышляет, а время размышления видно
  пользователю как пустой экран.

  Замеры через llm.kosov.online (системный prompt wavecode — 4630 симв. —
  плюс правка одного паттерна в score, streaming, 2026-11-02):

    effort=high → первый видимый токен  7.35-11.23 с, reasoning 1417-2544 симв.
    effort=low  → первый видимый токен  4.57-10.27 с, reasoning  732-1785 симв.
    effort=none → первый видимый токен  1.07-1.44 с, reasoning     0 симв.  (3/3)

  Три причины складывались в одну:

  (1) Размышление невидимо. `LiveLLMClient` намеренно НЕ enqueue-ит
      `delta.reasoning_content` в поток (`cleanLLMResponse` вычистит его
      позже). Это правильно для транскрипта, но превращает время
      размышления в пустой чат: пользователь смотрел в молчание 5-12 с.

  (2) Голосовой путь был зашит на `smart`. `intentRouter` звал
      `applyEditStream` с пустыми опциями, и тот уходил в свой дефолт
      `smart` (deepseek-v4-pro) + `low`. Это худшая комбинация: тяжёлая
      модель И размышление. Тир, выбранный пользователем, голос игнорировал
      полностью.

  (3) Настройка «выключить размышление» не выключала размышление. DeepSeek
      игнорирует `effort=off` и `effort=minimal` — это было зафиксировано
      2026-10-26 и считалось актуальным. Замер 2026-11-02 опроверг это:
      `effort=none` РЕАЛЬНО отключает reasoning (0 символов, 3/3 прогона).
      Старое поведение клиента отправляло `low` вместо «выключено», то
      есть 4.6-12.1 с пустоты вместо 1.1 с.

  Отдельно: кэш LiteLLM на диске не включает `extra_body` в ключ, поэтому
  уровень размышления, посчитанный первым запросом, залипал на все
  последующие запросы с тем же промптом и моделью на час (ttl 3600).

commitment: |
  (1) `thinking: 'off'` на профиле DeepSeek означает
      `extra_body.reasoning_effort = 'none'` — реальное отключение
      размышления, а не деградацию до 'low'. Подпись в UI: «выкл».

  (2) Интерактивные дефолты: тир `fast` и размышление `off`. Историческая
      комбинация v1 (`fast` + `low`), которую пользователь никогда не
      выбирал руками, мигрирует на новый дефолт; явный выбор уважается.

  (3) Голосовой маршрут использует тир, выбранный пользователем, и ВСЕГДА
      идёт без размышления: голос — быстрый канал, а reasoning-токены
      пользователю не видны.

  (4) Ремонтный (self-heal) запрос всегда идёт без размышления: это
      синтаксическая правка по уже известной причине, и размышление
      добавило бы 5-12 с невидимого ожидания к каждому повтору.

  (5) Запрос к LLM несёт AbortSignal: потолок 45 с на заголовки ответа и
      30 с на «тишину» в теле SSE-потока. Прерывание Effect-волокна
      (barge-in в голосовом сценарии) abort-ит HTTP-запрос, а не только
      волокно.

  (6) Уровень размышления кодируется в поле `user` тела запроса: ключ
      диск-кэша LiteLLM включает `user`, но не включает `extra_body`, —
      поэтому у каждого уровня своя запись кэша.

  (7) Префикс промпта ограничен: история диалога — не больше 4 ходов и
      не больше 4000 символов; при переполнении выкидываются самые старые
      ходы, последний ход не трогается.

counterexample: |
  «Достаточно отправлять `reasoning_effort: 'low'` и не трогать больше
  ничего — модель и так отвечает быстро».

  Возражения: (а) замер 2026-11-02 на реальном промпте wavecode даёт
  4.57-10.27 с до первого видимого токена на `low` против 1.07-1.44 с на
  `none` — разница в 3-9 раз, и она вся в невидимой части ответа; (б)
  голосовой путь при `low` остаётся на 4.6-12.1 с пустоты, то есть
  исходная жалоба («долго при распознании голоса») не лечится вовсе;
  (в) 217 предупреждений math-coding в этом репозитории — прямое
  следствие того, что «достаточно поправить одну строку» оставляет
  неучтёнными измеренные факты.

  «Размышление нужно оставить включённым по умолчанию — оно улучшает
  качество score-правок». Возражения: качество измерено — на восьми
  типовых инструкциях («добавь бит», «сделай быстрее», «убери бас»,
  «добавь хэт», «приглуши всё», «сделай мелодию выше на октаву», «добавь
  фильтр на бас», «добавь синтезатор») и flash, и pro дали 0/8 нечитаемых
  ответа без размышления. Размышление не купило ни одного разбора с
  первого раза; оно купило 5-12 с ожидания.

  «Просто показывать reasoning пользователю, чтобы он видел, что модель
  думает». Возражения: (а) reasoning — это внутренний черновик модели, а
  не ответ; показ черновика в UI score-редактора — это шум, который
  конкурирует с самим score; (б) даже показ не убирает задержку: первый
  токен ответа всё равно приходит после всего размышления.

antithesis: |
  «Размышление должно включаться автоматически для сложных инструкций —
  тогда качество вырастет, а быстрый путь останется для простых». Отвергнуто:
  сложность инструкции клиенту неизвестна (это свободный текст), а
  авто-режим означает ровно то невидимое ожидание, на которое жалуются.
  Порог «сложная инструкция» пришлось бы угадывать на стороне клиента;
  явный выбор пользователя («Размышление: много») даёт ту же
  управляемость без угадывания.

  «Уровень размышления не должен влиять на кэш — иначе один и тот же
  промпт будет давать разные ответы». Возражение-в-ответ: сейчас
  влияет, и как раз неявно: ключ кэша игнорирует `extra_body`, поэтому
  ответ, посчитанный с `high`, отдаётся как ответ на запрос с `none`.
  Разделение по уровню делает кэш честным: одинаковый уровень → одинаковый
  ответ, разный уровень → разные записи.

