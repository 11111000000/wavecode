outcomes:
  - id: first-visible-token-within-two-seconds
    statement: |
      На типовой правке score (системный prompt wavecode + один паттерн)
      первый видимый токен ответа приезжает за ≤ 2 с на обоих тирах:
      `fast` — 0.97 с в среднем, `smart` — 1.19 с в среднем (замер
      2026-11-02, 8 инструкций на тир). До правки `smart` давал 4.6-12.1 с.
  - id: voice-route-honours-user-tier
    statement: |
      Голосовой маршрут отправляет в LLM тир, выбранный пользователем в
      настройках ИИ, и `thinking: 'off'` — независимо от настройки
      размышления.
  - id: reasoning-off-really-disables-reasoning
    statement: |
      При `thinking: 'off'` тело запроса содержит
      `extra_body.reasoning_effort = 'none'`, и поток не содержит ни одного
      символа `reasoning_content`.
  - id: self-heal-retry-costs-one-fast-round-trip
    statement: |
      Ремонтный запрос отправляется с `thinking: 'off'` даже если первая
      попытка была с `high`.
  - id: hung-upstream-cannot-hang-the-ui
    statement: |
      Запрос к LLM уходит с `signal: AbortSignal`; прерывание волокна
      abort-ит HTTP-запрос; потолок на заголовки — 45 с, на «тишину» в
      теле потока — 30 с.
  - id: cache-key-separates-reasoning-levels
    statement: |
      Поле `user` тела запроса содержит уровень размышления
      (`wavecode-effort-none|low|high`), поэтому ключ диск-кэша LiteLLM
      различает уровни.
  - id: prompt-prefix-is-bounded
    statement: |
      История диалога, уходящая провайдеру, — не больше 4 ходов и не
      больше 4000 символов; последний ход сохраняется всегда.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0.
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-llm-latency-fast-path.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.

obligations:
  - id: off-maps-to-reasoning-none
    claim: |
      В теле запроса при `thinking: 'off'` поле `extra_body` равно
      `{ reasoning_effort: 'none' }`, а не `{ reasoning_effort: 'low' }`.
    acceptance:
      all:
        - verifier: tests/infrastructure/llm/LiveLLMClient.test.ts
  - id: effort-level-is-part-of-the-cache-key
    claim: |
      Поле `user` тела запроса равно `wavecode-effort-none|low|high` в
      зависимости от уровня размышления.
    acceptance:
      all:
        - verifier: tests/infrastructure/llm/LiveLLMClient.test.ts
  - id: request-carries-an-abort-signal
    claim: |
      Вызов `fetch` в `LiveLLMClient` передаёт `signal`, а прерывание
      волокна abort-ит запрос.
    acceptance:
      all:
        - verifier: tests/infrastructure/llm/LiveLLMClient.test.ts
  - id: interactive-defaults-are-fast-and-unreasoned
    claim: |
      `DEFAULT_MODEL` = 'fast', `DEFAULT_THINKING` = 'off', и вызов
      `applyEditStream` без явных опций уходит с ними.
    acceptance:
      all:
        - verifier: tests/application/useCases/llmEdit.test.ts
  - id: self-heal-retry-disables-reasoning
    claim: |
      Второй запрос `applyEditStream` (self-heal) несёт
      `thinking: 'off'` независимо от уровня первой попытки.
    acceptance:
      all:
        - verifier: tests/application/useCases/llmEdit.test.ts
  - id: history-is-bounded
    claim: |
      `trimHistory` держит не больше `MAX_HISTORY_TURNS` ходов и не
      больше `MAX_HISTORY_CHARS` символов, сохраняя последний ход.
    acceptance:
      all:
        - verifier: tests/application/useCases/llmEdit.test.ts
  - id: voice-route-uses-user-tier-without-reasoning
    claim: |
      `routeIntent` отправляет тир из `RouterContext.model` и всегда
      `thinking: 'off'`.
    acceptance:
      all:
        - verifier: tests/application/voice/intentRouter.test.ts
  - id: settings-default-and-labels-match-reality
    claim: |
      Дефолт настроек ИИ — `{ model: 'fast', thinking: 'off' }`,
      `thinkingLabel('off')` = 'выкл', а непрочитанная комбинация v1
      мигрирует на новый дефолт.
    acceptance:
      all:
        - verifier: tests/presentation/state/llmSettings.test.ts
  - id: typecheck-lint-green
    claim: |
      `npm run typecheck`, `npm run lint:no-console` и
      `npm run validate:presets` завершаются exit 0.
    acceptance:
      all:
        - verifier: text-scan-ui-precommit-green
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-llm-latency-fast-path.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: mathc validate

