intent: |
  Фазы 6 («Тишина по умолчанию») и 7 («Замер») плана
  `docs/2026-11-15-zen-ui-plan.md` — последние две фазы редизайна,
  закрывающие его целиком.

  Фаза 6 убирает шум из интерфейса. К моменту её начала три вещи
  кричали о себе без необходимости:
    * ошибка уходила в админку (`⚠` → `/admin`) или терялась в молчаливом
      сэмпле — пользователь не знал, что сломалось;
    * состояние приложения было размазано: счётчик сэмплов в верхней
      панели, индикатор офлайна где-то ещё, LED аудио отдельно;
    * транспортная строка показывала CPS, swing и пресеты темпа сразу —
      шесть интерактивных регионов там, где нужен один play;
    * мини-нотация (14 кнопок) и отладочная строка висели в партитуре
      постоянно;
    * интерфейс был двуязычным: русские подписи рядом с английскими.

  Фаза 7 измеряет результат. После шести фаз структурных изменений
  «выглядит хорошо» — не аргумент: нужен снимок эталона и число,
  которое можно ухудшить.

  Это решение фиксирует ЧТО именно реализовано в фазах 6–7 и чем
  это проверяется.
commitment: |
  1. **Один регион ошибок.** Ошибки больше не живут в тостах и не
     ведут в админку: под холстом появляется `ErrorRegion`
     (`data-testid="error-region"`) с текстом ошибки, действием
     «Повторить» и ссылкой «Подробнее». Тост — только мимолётные
     сообщения, и в интерфейсе он один (последний по времени).
  2. **Одно место состояния.** `StatusStrip` (`data-testid="status-strip"`)
     в верхней панели показывает состояние аудио, счётчик сэмплов и
     индикатор офлайна. Показывается честный `audio.status`
     («играет» / «ошибка» / «остановлен»), а не состояние AudioContext:
     контекст остаётся `running` и после «Стоп», и по нему нельзя
     понять, звучит ли музыка. **Кнопка play/stop читает тот же
     статус.** Раньше она считала «играет ли» по состоянию
     AudioContext, которое обновляется раз в полсекунды: кнопка
     успевала показать «Стоп» вместо «Запуск», а нажатие «Запуск» в
     гонке с опросом превращалось в «Стоп» и выключало только что
     запущенную музыку.
  3. **Транспорт — «play · темп · позиция».** Ровно три показания и
     одна кнопка play в строке. CPS, свинг и готовые темпы — за
     раскрытием «▼ Темп». Выбор композиции уехал в лист «Инструменты».
     Раньше строка транспорта дублировала `TransportPanel` — дубль
     удалён.
  4. **Диагностика и мини-нотация — за раскрытием.** Переключатель
     вида, 14 кнопок мини-нотации и отладочная строка живут под
     «⋯ Ещё» под партитурой; раскрытие закрыто по умолчанию на всех
     экранах.
  5. **Один язык интерфейса.** Пользовательские подписи — на русском.
     Служебные перечисления не переименовываются (их значения участвуют
     в логах и фильтрах), но на экран выводятся через `labels.ts`.
     Имена пресетов и артистов — имена собственные, они не переводятся.
  6. **Baseline в репозитории.** `ui/tests/baseline/desktop-1440.png`
     и `ui/tests/baseline/mobile-390.png` снимаются скриптом
     `scripts/capture-baseline.mjs` и лежат в репозитории.
  7. **Время до первого звука измеряется.** `first-sound.spec.mjs`
     проходит путь «лендинг → Создать → Запуск» и замеряет появление
     сигнала в миксе (RMS анализатора), потолок — 30 секунд.
  8. **Контролы обещают то, что делают.** Полный e2e-прогон фазы 6
     вскрыл две поломки, которые пользователю обещали работу, а её
     не было: слот «⌖ курсор» в пианино нельзя было включить никогда
     (`editorApi` была обычной переменной, и `createEffect` на неё не
     подписывался — слушатели фокуса редактора не подключались), а
     выбор слота забирал фокус у редактора, из-за чего слот
     блокировался ещё до доставки `click`.
axiom_link:
  - A1
