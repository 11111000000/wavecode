outcomes:
  - id: wavecode-zen-ui-phases-6-7-outcome-errors
    statement: |
      У пользователя один адрес для ошибок — регион под холстом: с
      текстом ошибки, действием «Повторить» и ссылкой «Подробнее» на
      консоль. Ссылка «⚠» на `/admin` из верхней панели убрана,
      молчаливый сэмпл больше не остаётся без реакции.
  - id: wavecode-zen-ui-phases-6-7-outcome-status
    statement: |
      Состояние аудио, загрузка сэмплов и офлайн читаются из одной
      строки в верхней панели. Строка показывает, звучит ли музыка
      сейчас, а не состояние аудиоконтекста; кнопка play/stop
      показывает и переключает то же самое.
  - id: wavecode-zen-ui-phases-6-7-outcome-quiet
    statement: |
      В дефолтном виде транспорт — это «play · темп · позиция», а
      14 кнопок мини-нотации и отладочная строка спрятаны под
      раскрытием «⋯ Ещё».
  - id: wavecode-zen-ui-phases-6-7-outcome-language
    statement: |
      Пользовательские подписи интерфейса — на русском; английские
      слова остались только в именах собственных (пресеты, артисты) и
      в служебных значениях, которые на экран не выводятся напрямую.
  - id: wavecode-zen-ui-phases-6-7-outcome-measured
    statement: |
      В репозитории лежат baseline-скриншоты дефолтного вида на двух
      размерах экрана, а время до первого звука с лендинга измеряется
      e2e-сценарием и укладывается в 30 секунд.
obligations:
  - id: wavecode-zen-ui-phases-6-7-guard-targets
    claim: |
      The zen guard reports the phase-1 targets met and no regression
      against the re-recorded baseline: no dangling token reference, no
      hardcoded colour outside the token file, at most one infinite
      animation.
    acceptance:
      all:
        - verifier: "node scripts/check-zen-ui.mjs --targets"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-quality-gate
    claim: |
      The repository quality gate is green: typecheck, unit tests,
      console lint and preset validation.
    acceptance:
      all:
        - verifier: "cd ui && npm run test:precommit"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-error-region
    claim: |
      An unhandled promise rejection reaches the user as an entry in the
      error region below the canvas, not as a toast and not as a silent
      log line.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/console.spec.ts"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-first-sound
    claim: |
      The time from landing page load to the first audible signal is
      measured and stays within thirty seconds.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/first-sound.spec.mjs"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-baseline-present
    claim: |
      The visual baseline of the default editor view exists in the
      repository for both a desktop and a mobile viewport.
    acceptance:
      all:
        - verifier: "node scripts/capture-baseline.mjs --check"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-transport-toggle
    claim: |
      The transport play/stop control follows the application's audio
      status: it reads «Стоп» while `audio.status` is `playing` and
      «Запуск» otherwise, so a press on «Запуск» starts playback
      instead of stopping what is already playing.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/state/audioActions.test.ts src/presentation/components/app/StatusStrip.test.tsx"
          result: pass
  - id: wavecode-zen-ui-phases-6-7-kernel-validates
    claim: |
      The decision file is structurally valid under the math-coding 3.3
      schema.
    acceptance:
      all:
        - verifier: "mathc validate"
          result: pass
negative_control: |
  `scripts/capture-baseline.mjs --check` has teeth: removing either PNG
  from `ui/tests/baseline/` (or replacing it with a file under 10 KB)
  makes the check exit 1. The error-region e2e has teeth as well: an
  unhandled rejection that only reached the logger would leave
  `[data-testid="error-region"]` empty, and the assertion on
  «Необработанный отказ промиса» would fail. The transport-toggle
  check has teeth in the same way: if `audioRunning()` went back to
  reading the AudioContext, the unit test that maps
  `audio.status → running` would fail for the `stopped` and `error`
  cases.
counterexample: |
  The strongest objection is that the error region adds a permanent
  surface below the canvas, and a separate Russian translation of the
  whole interface doubles the maintenance cost of every future label
  while breaking links, screenshots and e2e expectations that were
  written against the English wording. The objection is acknowledged for
  the translation: it is accepted as the cost of one language — the
  product is Russian-speaking, and a mixed interface is a defect, not a
  neutral choice. The error region, however, is conditional: it renders
  nothing at all until something actually fails, so in the resting view
  it costs zero pixels.
antithesis: |
  The coherent alternative was to keep errors inside the toast channel
  and just translate the visible strings. It was rejected because the
  toast is a disappearing notification for transient information: a user
  who missed it loses the error permanently, and the action «Повторить»
  needs a stable anchor. Errors and transient messages are different
  kinds of information and get different lifecycles.
assumptions:
  - id: wavecode-zen-ui-phases-6-7-assumption-russian
    state: assumed
    statement: |
      The audience is Russian-speaking; a single-language interface is
      worth the re-translation cost, and English is reserved for proper
      names and technical identifiers.
    owner: human:operator
    consequence_if_false: |
      If the product goes international, the translation table in
      `labels.ts` becomes the seam for a real i18n layer instead of a
      Russian-only map.
risk:
  declared_triggers:
    - error-region-ignored
    - time-to-first-sound-regression
    - translation-drift
    - transport-density-regression
  owner: human:operator
reversal:
  - signal: |
      Users report that the error region went unnoticed, or that
      transient toasts are missed because the error region steals the
      attention.
    action: rework
  - signal: |
      Time to first sound grows beyond the thirty-second budget on the
      production deployment.
    action: review
relations:
  implements:
    - wavecode-zen-ui-implementation@1
  refines:
    - wavecode-zen-minimal-ui@2
