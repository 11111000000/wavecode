      "Mobile viewport 412×900 (Pixel 7, как на bug-скриншоте) — preset-row 44px + controls-row 52px = 96px резервируется сверху .app-body, оставляя ~804px для editor + tabbar(60)" Evidence: "axiom A5: surface the model. На маленьком viewport'е обе полосы должны быть видны — иначе юзер теряет доступ к primary affordance (preset + play)."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-10
    state: assumed
    statement: |
      "Toast НА topbar'е — правильное место для error/critical severity, но не для info/warn (silent auto-dismiss). UI уже различает: info/warn не clickable, error/critical clickable и открывают console" Evidence: "ui/src/presentation/components/Toast.tsx:99-103 — onClick handler только на isError() (severity error/critical/fatal). info/warn не clickable, но ВСЁ РАВНО отрисовываются наверху — это signal 'something happened', что и нужно."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-11
    state: assumed
    statement: |
