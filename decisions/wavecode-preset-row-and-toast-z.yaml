assumptions:
  - id: wavecode-preset-row-and-toast-z-assumption-1
    state: proven
    statement: |
      "TransportPanel (`.app-controls-row`) занимает место preset-row в DOM-flow из-за `position: fixed; top: var(--header-h)` (z-index 52)" Evidence: "ui/src/styles/components.css:2974-2992 — `position: fixed; top: var(--header-h); z-index: calc(var(--z-sheet) + 12)` (z-sheet=40, итого 52). Подтверждено скриншотом bug report'а: play-полоса в области, где должен быть preset-select."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-2
    state: proven
    statement: |
      "PresetRow рендерится в App.tsx между TopBar и app-controls-row, в обычном flow" Evidence: "ui/src/App.tsx:185-258 — JSX порядок: <TopBar /> → <PresetRow /> → <div class='app-controls-row'> → <PanelsLayout />. PresetRow не имеет position:fixed, поэтому занимает y=56..(56+naturalHeight)."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-3
    state: proven
    statement: |
      "Toast-stack имеет z-index var(--z-toast) (50), что выше TopBar'а (z-sheet+5 = 45)" Evidence: "ui/src/styles/tokens.css:170 — `--z-toast: 50`. ui/src/styles/components.css:625 — topbar `z-index: calc(var(--z-sheet) + 5)` = 45. Toast при любом `top` отрисуется над TopBar'ом, если не сменить z-index."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-4
    state: proven
    statement: |
      "Toast-stack имеет `pointer-events: none`, а `.toast-item` — `pointer-events: auto`. Это значит фон вокруг toast'ов прозрачен для клика" Evidence: "ui/src/styles/components.css:1602 (stack), 1606 (item) — стандартный приём 'clickable area only on the chip itself'."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-5
    state: proven
    statement: |
      "App.tsx (и остальные компоненты) НЕ зависят от позиции preset-row в DOM-flow — Solid не использует layout, только JSX-tree" Evidence: "Solid components: <PresetRow> не имеет refs / measuring hooks. CSS-only изменение position не ломает React-style ref'ы."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-6
    state: proven
    statement: |
      "Material Design / iOS HIG рекомендуют top-position для error/critical уведомлений, чтобы привлечь внимание" Evidence: "Apple Human Interface Guidelines: 'Place alerts at the top of the screen so they're noticeable but don't obstruct content below.' Material Design 3: 'Use a banner at the top of the screen for high-priority notifications.'"
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-7
    state: proven
    statement: |
      "44px высота preset-select — обоснована min-height control-h (32px) + padding-xs (6px×2) = 44px" Evidence: "ui/src/styles/components.css:2294-2315 — `.preset-select { min-height: var(--control-h); padding: 0 var(--space-xl) 0 var(--space-md); }`. control-h=32, но iOS auto-zoom + touch-target ≥44 → высота DOM элемента на mobile ~44px."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-8
    state: proven
    statement: |
      "Wavecode использует convention: каждый значимый layout-fix сопровождается math-coding packet + witness" Evidence: "math/wavecode-transport-always-visible/ (applied 2026-10-13), math/wavecode-piano-toolbar-fix/ (draft), math/wavecode-ui-minimal-pass-phase-2/ (applied) — pattern повторяется."
    owner: human:operator
  - id: wavecode-preset-row-and-toast-z-assumption-9
    state: assumed
