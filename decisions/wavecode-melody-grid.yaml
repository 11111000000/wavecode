intent: |
  wavecode has a 4×8 drum-pad StepGrid (kick / snare / hihat / clap),
  but no visual editor for melodies. Today the only melody workflows
  are: (a) hand-write mini-notation in the editor, or (b) record a
  piano take and transcribe (`🎼 transcribe` per the
  `wavecode-piano-transcribe` packet). Both are great for power
  users, but composers who think in pitch-and-step grids (piano roll
  / tracker / Reason Kongen / FL Studio Channel Step sequencer)
  want a third option: visually lay down 16 columns of note cells,
  tap to toggle, hear the result, edit in place.

  This packet adds a `MelodyGrid` sheet tab: 16 columns (one per
  1/16 step) × 36 pitch rows (C3–B5 = MIDI 48–83), with the same
  3-mode UI as the drum StepGrid (view / sketch / edit). It sits
  beside the drum grid (independent sheet, independent state); the
  two grids together cover the rhythm + lead authoring surface for
  a typical pop loop.

  The grid:
    - IS a read-only mirror of the score's melody in view mode;
      tap = preview the cell via Web Audio.
    - IS a draft buffer in sketch mode; ↑ commit writes the draft
      back to the score via `replaceLayerSources` so the rest of
      the score (drums, bass, FX chains) is preserved byte-for-byte.
    - IS an in-place editor in edit mode, gated on the score
      having a top-level stack AND exactly one `note(...)` / `n(...)`
      call to splice.

  The melody grid never touches drum layers. Drum and melody
  are independent domains; we deliberately do NOT merge with
  `gridState.ts` (different state shape — sparse (step, midi)
  tuples instead of a 2D boolean matrix; different AST target).

commitment: |
  1. `ui/src/domain/music/melodyGridTypes.ts` — pure types:
     `MELODY_COLS = 16`, `MELODY_PITCH_RANGE = { low: 48, high: 83 }`
     (C3..B5, 36 keys), `MelodyCell = { step, midi }`,
     `MelodyMode = 'view' | 'sketch' | 'edit'`.
  2. `ui/src/domain/music/melodyExtract.ts` — pure functions:
     a. `extractMelodyFromScore(score) → { cells, ok, reason? }`
        using `parseScore` + `findTopStackOf` +
        `argLeadingName`/`argText`. Finds the first `note(…)` /
        `n(…)` call inside the top-level stack; if it has a string
        arg, parses tokens on whitespace (each token is a note
        name like `"g3"` or `"~"` for rest) and emits `{ step,
        midi }` tuples skipping rests. Falls back gracefully
        (reason surfaced in the UI).
     b. `commitMelodyToScore(score, melody, opts) → { ok, score }`
        builds `note("<…>").s("<instrument>")` mini-notation
        and uses `replaceLayerSources` to splice the first
        `note(…)` / `n(…)` arg in place. Refuses to splice if
        there is no note-call target inside the top stack
        (returns `{ ok: false, reason }` so the UI can warn
        instead of corrupting the score).
  3. `ui/src/presentation/state/melodyGridState.ts` — parallel
     to `gridState.ts`. Signals: `melodyMode`, `melodyDraft`,
     `melodyLastCommitted`. Functions: `enterMelodyView`,
     `enterMelodySketch`, `enterMelodyEdit`, `toggleMelodyCell`,
     `commitMelodyDraft`, `applyMelodyEditToLayer`,
     `clearMelodyDraft`, `dirtyMelodyCount`. NO shared module
     state with the drum grid (different gate, different
     lastCommitted snapshot).
  4. `ui/src/presentation/components/MelodyGrid.tsx` —
     `<MelodyGrid />` component, structurally identical to
     `StepGrid` (3-mode pill, ↻ reset, ↑ commit button only
     in sketch, beat column indicator synced to
     `AudioEngine.getCycleProgress()`).
  5. `ui/src/styles/components.css` — `.melody-grid`,
     `.melody-grid-toolbar`, `.melody-grid-mode-pill`,
     `.melody-grid-mode-btn`, `.melody-grid-rows`,
     `.melody-grid-row`, `.melody-grid-row-label`,
     `.melody-grid-btn`, `.melody-cell` and friends — adapted
     from the drum StepGrid styles. No new CSS variables.
  6. BPM display: derived from `appStore.transportState.cps`
     (`bpm = cps × 60`, cycle = 1 beat) with default 120;
     surfaced as a small text in the toolbar, NOT an input
     (out of scope for this packet — the melody grid does not
     retune the audio engine).
  7. Edit-mode gate: `extractMelodyFromScore(score).ok === true`
     (i.e. there's at least one `note(…)` or `n(…)` call in the
     top stack). Otherwise the mode pill is disabled with a
     tooltip explaining that the user must have a melody layer
     to edit. Sketch mode is ALWAYS available (sketch + commit
     can append a new melody layer when no note-call exists).

