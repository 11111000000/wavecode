outcomes:
  - id: melody-grid-renders
    statement: |
      `<MelodyGrid />` renders as a 16-column × 36-row grid with
      row labels (note names) and a 3-mode pill. In view mode
      cells mirror the score's first `note(…)` string arg; in
      sketch mode cells are user-toggled; in edit mode cells
      auto-splice on every tap. Verified by unit tests.
  - id: melody-grid-ast-extract
    statement: |
      `extractMelodyFromScore(score)` returns `{ cells, ok: true }`
      for the built-in `creep` preset (8 columns of
      `g3 b3 d4 b3 …` → 8 `{step, midi}` tuples); returns
      `{ cells: [], ok: false, reason: 'no-note-call' }` for
      a score that has only `s("…")` rows. Pure, no Effect.
  - id: melody-grid-ast-commit
    statement: |
      `commitMelodyToScore(score, melody, opts)` returns
      `{ ok: true, score: '<new>' }` after using
      `replaceLayerSources` to swap the first `note(…)` /
      `n(…)` arg in the top stack. The returned score preserves
      every byte around the edited row (verified with a
      regression test for the existing `splice.ts` test
      contract). The grid's BPM-input is wired through
      `opts.bpm` so the future mini-notation can encode
      `<…>.fast(N)` if needed.
  - id: melody-grid-edit-gate
    statement: |
      The `edit` mode pill is disabled when the score has no
      top-level stack OR no `note(…)`/`n(…)` call inside it,
      with a tooltip explaining the constraint (matches the
      StepGrid edit-mode gate UX).
  - id: melody-grid-sync-score
    statement: |
      `<MelodyGrid />` reads `appStore.score` on mount and
      re-reads it whenever the score changes (via Solid
      reactivity). Switching from sketch → view re-seeds the
      cells from the live score, NOT from a stale draft.

obligations:
  - id: melody-grid-extract-unit
    claim: |
      `melodyExtract.test.ts` covers ≥ 6 cases: empty score,
      bare `note("c4 e4 g4")` (3 cells), `n("…")` alias,
      note-with-rests (`"<c4 ~ g4>"`-style splicing), drum-only
      score → ok=false with reason, multi-stack with
      `note(…)` deep inside.
    acceptance:
      all:
        - verifier: "vitest run ui/src/domain/music/melodyExtract.test.ts"
          result: pass
  - id: melody-grid-commit-unit
    claim: |
      The same test file covers the commit path: round-trip
      (extract → commit → extract yields same cells); commit
      into a mixed score preserves `s(…)` rows verbatim
      (use the existing splice-test fixture as a regression
      sentinel); commit without note-call returns
      `{ ok: false, reason: 'no-note-call' }`.
    acceptance:
      all:
        - verifier: "vitest run ui/src/domain/music/melodyExtract.test.ts"
          result: pass
  - id: melody-grid-modes-unit
    claim: |
      `MelodyGrid.test.tsx` covers: view-mode tap → preview
