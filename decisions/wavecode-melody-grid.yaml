assumptions:
  - id: melody-grid-assumption-creep-decomposable
    state: assumed
    statement: |
      "The built-in creep preset contains a top-level `cat(...)`
       whose first child is a `stack(...)` whose first arg is a
       `note(\"g3 b3 d4 …\")` call. The AST walker surfaces this
       as the 'first note(…) inside the first stack' and the
       extract function will correctly read the 8 notes of the
       verse arpeggio."
    evidence: "ui/src/domain/presets.ts:42-93"
    owner: agent
  - id: melody-grid-assumption-replaceLayerSources-stable
    state: assumed
    statement: |
      "`replaceLayerSources` is the public, AST-based splice API
       and is the single source of truth for in-place byte-range
       edits in wavecode (see wavecode-strudel-ast packet)."
    evidence: "ui/src/domain/strudel/splice.ts:152"
    owner: agent
  - id: melody-grid-assumption-edits-once-per-call
    state: assumed
    statement: |
      "Edit-mode taps emit one `commitMelodyToScore` call per
       tap. We do NOT batch taps; we rely on the same 50ms
       `scheduleGridEdit` debounce as the drum StepGrid."
    evidence: "ui/src/presentation/state/audioActions.ts:60-81"
    owner: agent
  - id: melody-grid-assumption-bpm-120-default
    state: assumed
    statement: |
      "BPM = 120 is a reasonable default for the synthesized
       mini-notation; users composing at a different tempo
       adjust the global tempo via the TransportPanel after
       the melody is in place. The BPM display is read-only."
    owner: human:operator

risk:
  declared_triggers:
    - sheet-tab-explosion-creeps-ui
    - chromatic-grid-too-wide
    - wrong-note-call-writes-to-stacked-n-layer
  owner: human:operator

reversal:
  - signal: melodyExtract.test.ts-fails
    action: rework
  - signal: edit-gate-too-restrictive
    action: rework-to-allow-empty-note-call-and-skip-args
  - signal: bundle-size-bloats
    action: lazy-load-melody-grid

counterexample: |
  "Drum grid is enough — anyone composing melodies can just
  record a piano take and transcribe (wavecode-piano-transcribe
  packet) or write the mini-notation by hand."

  Counter: piano transcribe is a CAPTURE tool, not a CREATION
  tool — it needs the user to play the notes first. The
  melody grid lets users who THINK in pitch-time coordinates
  construct melodies note-by-note without a MIDI keyboard,
  without handwriting mini-notation syntax, and without
  recording-then-transcribing latency. It also surfaces the
  harmonic structure of the score visually (pitch rows
  reveal arpeggio patterns in two dimensions that the linear
  score cannot), which is the primary use case for piano-roll
  UIs since the Fairlight CMI (1979) and Bitwig's grid.

antithesis: |
  "(1) Just bolt on a note-roll overlay to the drum grid —
  one grid, two cell types. Rejected: drum cells and
  melody cells have different Y-axis dimensions (4 vs 36),
  different gating (4 s-rows vs 1 note-row), different
  preview semantics (drum sample vs midi note), and
  different storage shape (boolean matrix vs (step, midi)
  tuples). Forcing both into one matrix loses the
  X-is-step / Y-is-pitch piano-roll convention that
  everyone in tracker culture reads natively.

  (2) Use the existing PianoKeyboard as the visual
  melody editor. Rejected: piano is 2 octaves × 7 white-
  keys with no step column. It's an INPUT device for
  playback, not a sequencer."

