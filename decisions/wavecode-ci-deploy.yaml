assumptions:
  - id: wavecode-ci-deploy-assumption-1
    state: proven
    statement: |
      "bin/deploy.sh уже реализует весь deploy-pipeline (install + build + sudo cp), Caddy обслуживает /var/lib/wavecode/dist/" Evidence: "ui/src/... нет, bin/deploy.sh:1-93 — единственный артефакт; /var/lib/wavecode/dist/ owned by caddy:caddy; Caddy vhost в AngaraConfig (см. ls /var/lib/wavecode/dist/)"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-2
    state: proven
    statement: |
      "Manual deploy (bin/deploy.sh по SSH) работал до этого packet'а" Evidence: "Last-Modified /var/lib/wavecode/dist/index.html обновлялось при каждом merge в предыдущих коммитах; AGENTS.md НЕ упоминает CI (значит ручной deploy был convention)"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-3
    state: proven
    statement: |
      "origin = github mirror, отстаёт от gitverse" Evidence: "git remote -v → origin = github.com/11111000000/wavecode, gitverse = gitverse.ru:11111000000/wavecode. На 2026-10-14 gitverse/master = 59694b6, origin/master = 1031d8a — отставание ~5 коммитов"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-4
    state: proven
    statement: |
      "Non-interactive SSH sessions (включая GitVerse Actions runners) не source'ят ~/.bashrc, поэтому /home/az/.local/bin (corepack install) НЕ в PATH" Evidence: "ssh test: PATH=/run/wrappers/bin:/home/az/.nix-profile/bin:... НЕ содержит /home/az/.local/bin. Поэтому `pnpm build` в deploy.sh падает с 'command not found' при CI-запуске, хотя работает при интерактивном SSH"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-5
    state: proven
    statement: |
      "az имеет NOPASSWD: ALL на angara-1 (NixOS default для основного пользователя)" Evidence: "sudo -nl: 'User az may run the following commands on nixos: (ALL : ALL) NOPASSWD: ALL'"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-6
    state: proven
    statement: |
      "GitVerse Actions не имеет self-hosted runner на angara-1 (verified: 0 workflow runs до merge, 1 run после с failure из-за missing secrets)" Evidence: "gitverse_actions_list total_count: 0 до push; после push 59694b6 — 1 run, status=failure, diagnosis='WAVECODE_DEPLOY_HOST not set'"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-7
    state: proven
    statement: |
      "bin/deploy.sh idempotent: повторный запуск переписывает /var/lib/wavecode/dist/ тем же содержимым" Evidence: "deploy.sh:55-83 — `sudo cp -r dist/. dist/` + cleanup loop (drop stale hashed assets) + `sudo chown -R caddy:caddy`. Никаких side-effects вне /var/lib/wavecode/dist/"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-8
    state: proven
    statement: |
      "Reference patterns в соседних репо (Genium-clean, angara-2-config) используют тот же SSH-deploy approach" Evidence: "~/Projects/Genium-clean/.gitverse/workflows/ci.yml (test-only), ~/Projects/angara-2-config/.gitea/workflows/deploy.yml (SSH на VPS + nixos-rebuild) — оба идут через secrets + SSH + remote command"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-9
    state: proven
    statement: |
      "bin/deploy.sh: existing build+deploy script, использовался до этого packet'а" Evidence: "bin/deploy.sh history: 357b0b1, f204de7, fc5c25c — pre-existing script. AGENTS.md НЕ упоминает его до этого пакета, но git log + /var/lib/wavecode/dist/index.html Last-Modified показывают, что он регулярно вызывался"
    owner: human:operator
  - id: wavecode-ci-deploy-assumption-10
    state: proven
    statement: |
      "Wavecode.kosov.online обслуживается Caddy с TLS на angara-1 (тот же хост, где живёт /var/lib/wavecode/dist/)" Evidence: "curl -I https://wavecode.kosov.online/ → Server: Caddy, Etag, Last-Modified обновляются при деплое. Caddy vhost в AngaraConfig (другой repo), но listener — angara-1 (тот же host где bin/deploy.sh работает)"
    owner: human:operator
