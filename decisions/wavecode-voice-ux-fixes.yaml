    - "ui/src/domain/**"
    - "ui/src/application/**"
    - "ui/src/infrastructure/**"

outcomes:
  - id: voice-panel-anchored-to-fab-cluster
    statement: |
      `.voice-recording-panel` и `.voice-review-panel`
      используют `bottom: var(--voice-fab-cluster-h)`, где
      токен = tabbar-h + space-lg + safe-bottom + (2 ×
      --voice-mini-fab-size + space-sm) = 196px на десктопе.
      Панель стоит вплотную над `.voice-mini-fab-stack` и не
      пересекается с `.app-transport-bar`: замер после фикса на
      780×493 — панель top=180/bottom=297 при
      transport-bar bottom=164, зазор 16px; оба её controls
      возвращаются из `document.elementFromPoint` как элементы
      самой панели, а не транспортного бара.
  - id: voice-panel-cannot-grow-into-transport
    statement: |
      Обе панели ограничены `max-height: var(--voice-panel-max-h)`
      и скроллят содержимое; `.voice-recording-panel__head` и
      `__actions` (и head/textarea/footer панели проверки) имеют
      `flex-shrink: 0` / `min-height: 0`, поэтому длинная
      расшифровка скроллится внутри панели, а кнопка ✕ и
      «Проверить» остаются видимыми и кликабельными.
  - id: review-button-only-when-paused
    statement: |
      Кнопка «Проверить» рендерится через `<Show when={canReview()}>`
      только при `voiceAIState().tag === 'paused' || 'review'`; в
      `listening`, `transcribing`, `requesting`, `applying`,
      `errored` она отсутствует в DOM (а не `disabled`). В
      `paused` кнопка активна — раньше она была disabled именно в
      этом состоянии, то есть выход в review-модалку был тупиком.
      Путь до `paused` — кнопка ✕ панели: `stopVoiceAI` →
      `handle.stop()` → dispatch `pause`.
  - id: whistle-instrument-visible-from-store
    statement: |
      `whistleStore` экспортирует `WHISTLE_INSTRUMENT`,
      сигнал `whistleInstrument` и функцию
      `whistleInstrumentLabel()`. `startWhistle` берёт значение из
      `WHISTLE_INSTRUMENT` (единственное место, где записан
      `'piano'`), обновляет сигнал (в т.ч. при переопределении
      через `opts.instrument`) и передаёт то же значение в
      оркестратор. `WhistleMiniFAB` печатает чип
      «слушаю… · пианино», заголовок панели — «Свист · пианино».
  - id: whistle-hint-chip-actually-renders
    statement: |
      `WhistleMiniFAB`'s `showHint` — сигнал (`createSignal`),
      а не обычная `let`-переменная. До фикса `<Show when={showHint ...}>`
      вычислялся один раз при рендере (false) и никогда не
      обновлялся, то есть чип не появлялся вообще — правка
      инструмента без этой правки была бы мёртвым кодом.
  - id: precommit-gate-green
    statement: |
      `cd ui && npm run test:precommit` (tsc --noEmit + vitest +
      eslint lint:no-console + validate:presets) завершается
      exit 0; 111 test-файлов / 1756 тестов зелёные.
      `npx vite build` exit 0.

obligations:
  - id: panel-css-has-no-magic-offset
    claim: |
      В `ui/src/styles/components.css` нет ни одного
      `calc(var(--tabbar-h) + <число>px` для
      `.voice-recording-panel` / `.voice-review-panel` /
      `.voice-transcript-overlay` — все три используют
      `var(--voice-fab-cluster-h)`.
    acceptance:
      all:
        - verifier: text-scan-no-magic-voice-offset
          result: pass
  - id: panel-ceiling-cascade-correct
    claim: |
      Мобильное переопределение `--voice-panel-max-h`
      (`@media (max-width: 720px)`) объявлено в
      `tokens.css`, то есть в том же `@layer tokens`, что и
      базовое значение: `index.css` импортирует stylesheets в
      именованные слои (`@layer tokens, base, components, …`),
      и более поздний слой побеждает независимо от
      specificity. В собранном CSS-бандле оба определения лежат
      внутри `layer(tokens)`, базовое раньше медиа-оверрайда.
    acceptance:
      all:
        - verifier: text-scan-voice-ceiling-in-tokens-layer
          result: pass
  - id: review-button-gated-by-fsm
    claim: |
      vitest на `RecordingPanel.test.tsx` подтверждает, что
      `.voice-recording-panel__btn--primary` отсутствует в
      `listening`, `transcribing`, `requesting`, `applying`,
      `errored`, присутствует и `disabled === false` в
      `paused`. (10+ тестов в файле, все зелёные.)
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: pause-reachable-through-test-seam
    claim: |
      `__dispatchVoiceAIForTests` обрабатывает `pause` так же,
      как доменный `pauseFrom` в `ui/src/domain/voice/voiceSession.ts`
      (listening/transcribing/requesting/applying → paused),
      а `resume` — как ветка `fromPaused`. До фикса оба
      случая возвращали `initial`, из-за чего состояние
      `paused` было недостижимо ни из одного теста, и
      «Проверить» нельзя было проверить.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-store-seam
          result: pass
  - id: instrument-single-source
    claim: |
      `'piano'` как строковый литерал для сессии свиста
      встречается в `ui/src/presentation/state/whistleStore.ts`
      ровно один раз (в `WHISTLE_INSTRUMENT`); ни
      `WhistleMiniFAB.tsx`, ни `RecordingPanel.tsx` не содержат
      собственной копии названия инструмента.
    acceptance:
      all:
        - verifier: text-scan-single-instrument-source
          result: pass
  - id: voice-review-send-untouched
    claim: |
      «Отправить в ИИ» в `VoiceAITextReview.tsx` продолжает
      работать: файл не изменён этим пакетом, его 5 тестов
      (`VoiceAITextReview.test.tsx`) зелёные, кнопка по-прежнему
      вызывает `sendVoiceAIReview(text)` и остаётся disabled на
      пустом драфте.
    acceptance:
      all:
        - verifier: vitest-run-voice-text-review
          result: pass
  - id: hint-chip-reactive
    claim: |
      `WhistleMiniFAB.test.tsx` содержит тест, который после
      удержания FAB дольше `HOLD_NOTICE_MS` находит
      `.voice-mini-fab__hint` в DOM и проверяет, что он
      содержит и «слушаю…», и `whistleInstrumentLabel()`.
    acceptance:
      all:
        - verifier: vitest-run-whistle-mini-fab
          result: pass
  - id: layer-boundaries-untouched
    claim: |
      Ни один файл в `ui/src/domain/`, `ui/src/application/`
      или `ui/src/infrastructure/` не изменён этим пакетом, и
      ни одна правка не добавляет импорт через слой. Правки
      ограничены presentation (компоненты + стор) и CSS.
    acceptance:
      all:
        - verifier: text-scan-no-domain-layer-change
          result: pass
  - id: typecheck-lint-green
    claim: |
      `npm run typecheck`, `npm run lint:no-console` и
      `npm run validate:presets` завершаются exit 0.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
        - verifier: pnpm-ui-lint
          result: pass
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-voice-ux-fixes.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: mathc validate
          result: pass

