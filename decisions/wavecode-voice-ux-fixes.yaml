intent: |
  Починить три UX-бага голосового ввода, найденные при ручном
  осмотре в браузере (viewport 780×493):

  (1) `.voice-recording-panel` и `.voice-review-panel` держали
  `bottom: calc(var(--tabbar-h) + 240px + var(--safe-bottom))`
  (у review-panel — 200px). Реальная высота FAB-кластера —
  196px, поэтому панель уезжала на ~44px выше кластера, целиком
  попадала под `.app-transport-bar` (z-index z-sheet+12 против
  z-sheet+4 у панели) и перехватывала все клики по своим же
  кнопкам. Замерено: панель top=76.2/bottom=193 при
  transport body top=101/bottom=164.

  (2) Кнопка «Проверить» рендерилась (и была активна) в
  `listening`/`transcribing`, вставляя лишний клик в основной
  жест. По outcome `voice-ai-fab-press-and-hold` из
  wavecode-voice-fab@1 цикл «нажал → сказал → услышал» должен
  быть одним жестом с auto-commit на final-чанке.

  (3) Инструмент свиста хардкодился в `whistleStore.ts` как
  `'piano'` и не отображался нигде: чип показывал только
  «слушаю…», и юзер не понимал, что на выходе будет пианино.
commitment: |
  (1) Четырёхслойная архитектура (domain / application /
  infrastructure / presentation) и правила ESLint
  no-restricted-imports per layer остаются инвариантом: все
  правки — presentation (компоненты, стор, CSS-токены), ни один
  слой не импортирует наружу. (2) Геометрия плавающих
  голосовых панелей выражается именованными токенами
  (`--voice-fab-cluster-h`, `--voice-panel-max-h`), а не
  литералами в пикселях: значение выводится из измеренной
  высоты FAB-кластера, поэтому переезд кластера не может снова
  рассинхронизировать панель с ним. (3) `tsc` + `vitest` +
  `eslint` зелёные; `mathc validate` на этом файле зелёный.
  (4) Ни один из трёх фиксов не меняет доменный контракт
  голосового ввода: `VoiceIntent`, `intentRouter`, FSM-события
  и порядок auto-commit остаются как были.

counterexample: |
  «Панель и так работает — юзер просто видит её поверх панели
  транспорта, это мелкое косметическое перекрытие». Возражения:
  измерение в браузере опровергает «мелкое». Панель занимает
  y=76…193, transport body — y=101…164: панель не просто
  перекрывает вид, она накрывает transport body целиком, а
  transport bar стоит выше по z-index, поэтому
  `document.elementFromPoint` в центре кнопок «Остановить
  запись» и «Проверить» возвращает элемент транспортного бара.
  Юзер физически не может нажать «стоп» — запись нельзя
  прервать. Это ломающая функция, а не косметика.

  «Кнопку «Проверить» надо просто задизейблить в listening, а не
  убирать — disabled-кнопка видна и подсказывает, что проверка
  существует». Возражения: disabled-кнопка в первичном жесте —
  это ровно тот «лишний клик» в two clicks, который и жаловались
  убрать; пользователь видит призыв, который не сработает, и
  тратит внимание на тупик.

  «Инструмент свиста можно вынести в селектор обратно, раз
  есть куча места». Возражения: исходное решение
  (wavecode-voice-fab@1, `whistle-fab-press-and-hold») явно
  убрало селекторы piano/synth/drums из мини-FAB, чтобы свист
  стал одним жестом без выбора. Возвращать селектор —
  откат этого решения, а не фикс этого бага. Показываем
  название, выбора не добавляем.

  «Дублировать `'piano'` в компоненте проще, чем тянуть сигнал
  из стора». Возражения: это и есть исходный баг — значение
  живёт в сторе, а UI его не знает. Вторая копия разъедется
  при первом же добавлении селектора, и чип начнёт врать о том,
  что реально коммитит `notesToSnippet`.

antithesis: |
  (1) «Поднять панель ещё выше (например 280px), раз
  транспорт всего 164px сверху — хватит». Возражения: это
  та же магия с другим числом. При 280px панель уедет под
  TopBar на низких viewport, а на мобильном (где
  safe-area-inset-bottom добавляет ещё ~34px) вообще уедет за
  экран. Токен, вычисленный из измеренной геометрии, не ломается
  при изменении входных данных; литерал — ломается.

  (2) «Поднять z-index панели над транспортным баром —
  тогда клики пройдут, и править позиционирование не нужно».
  Возражения: панель — временный оверлей поверх активной
  записи, транспортный бар — постоянный орган управления
  (Play, BPM, CPS). Поднимать панель над ним значит на время
  записи перекрыть Play кнопку, то есть поменять одну поломку
  на другую и более заметную. Правильная геометрия не создаёт
  конфликта, поэтому поднимать стек не нужно.

  (3) «Раз панель всё равно может вырасти, обрежь её
  `overflow: hidden` и не думай». Возражения: обрезка без
  прокрутки прячет текст расшифровки. Текст — главное, ради
  чего панель существует; он должен доезжать скроллом внутри
  панели, а controls (✕, «Проверить») остаются закреплёнными.

