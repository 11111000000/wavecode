counterexample: |
  «Достаточно править промпт: сказать модели “используй только
  piano и drums_*” — и всё, генераторы трогать не надо». Возражения:
  (а) генераторы пишут код БЕЗ модели: микрофон, пиано и свист
  коммитят сниппеты сами, и три из них писали имя, которого нет в
  реестре; промпт на них не влияет вообще; (б) даже если бы
  промпт был идеальным, у пользователя не было бы способа выбрать
  инструмент в AI-панели — то есть просьба «сделай на пиано»
  оставалась бы просьбой, которую модель может проигнорировать.

  «Оставить промпт как есть, но чинить падение через fallback в
  рантайме: если звук не найден — подставить ближайший». Возражения:
  (а) это маскирует проблему: пользователь пишет «на гитаре»,
  получает пиано и не понимает почему; (б) fallback всё равно
  требует перехвата в superdough (чужой модуль, чужой
  soundMap) — это ровно тот класс «фикса», который уже дважды
  ломался в этом проекте (см. историю `applyBankAliasFallback` в
  `wavecode-strudel-runtime-patches`); (в) правильный слой для
  «какие звуки вообще есть» — список, а не подстановка.

antithesis: |
  «Сделать так, чтобы промпт и генераторы брали список из
  реестра ЗВУКОВ В RUNTIME (soundMap), а не из статического
  каталога». Возражения: (1) soundMap наполняется асинхронно
  (SampleLoader грузит три банка при старте), и промпт собирается
  раньше, чем реестр готов — в промпте оказался бы пустой или
  неполный список; (2) soundMap содержит и мусор (алиасы вида
  `a4`, `bd`, `bass-c2`), который модель начала бы копировать в
  `.s("a4")` — а это уже другое имя, другой регистр и другая
  семантика; (3) статический каталог проверяется тестом против
  soundMap и против доставленных файлов — то есть «реальность»
  фиксируется в коде, а не hoped-on на момент загрузки.

  «Оставить статический список в промпте, но не трогать
  генераторы — у них свои дефолты, и они устраивают». Возражения:
  (1) дефолты расходились: микрофон писал 'piano', пиано —
  'triangle', а 'piano' в момент записи был единственным именем,
  которое вообще не существовало в реестре — то есть микрофон и
  пиано звучали по-разному и оба не по тому, что обещали; (2)
  три имени ('casio', 'guitar', 'synth') предлагались в UI и были
  мертвы — это и есть тот случай, когда пользователь «не должен
  задумываться»: он выбрал гитару и получил тишину.

outcomes:
  - id: the-agent-knows-the-real-sounds
    statement: |
      `SYSTEM_PROMPT` собирается из `soundCatalogForPrompt()`: в нём
      есть каждый id каталога (9 осцилляторов + 6 мелодических
      сэмплов + 14 ударных) и нет ни одного выдуманного имени.
      `llmEdit.test.ts` это фиксирует.
  - id: one-default-instrument
    statement: |
      `DEFAULT_MELODIC_SOUND = 'piano'` — единственный источник
      дефолта: его читают микрофон, запись пиано, транскрипция,
      извлечение мелодии, генератор одиночной ноты и свист.
  - id: the-fictional-instruments-are-gone
    statement: |
      'casio', 'guitar' и 'synth' не встречаются в коде как
      инструменты: тип `PianoInstrument` (= `PIANO_INSTRUMENTS`)
      их не содержит, тулбар пиано их не предлагает, промпт их не
      упоминает. `sounds.test.ts` сверяет `PIANO_INSTRUMENTS` с
      каталогом.
  - id: the-ai-panel-has-an-instrument-picker
    statement: |
      В AI-панели есть `<select>` инструмента (каталог, по
      умолчанию 'piano'); выбранное имя едет в user prompt блоком
      «=== ИНСТРУМЕНТ ===». `AIEditPanel.test.tsx` фиксирует список
      и дефолт, `llmEdit.test.ts` — блок в промпте.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0.
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-sound-catalogue-propagation.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.

