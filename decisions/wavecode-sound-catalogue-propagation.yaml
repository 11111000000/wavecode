intent: |
  Пользователь: «лучше просто Агента, чтобы он точно знал, что
  писать, чтобы всегда правильный код выдавал; но и также все
  алгоритмы, которые выдают код, надо чтобы они использовали
  настоящие инструменты, и так далее, чтобы пользователь интуитивно
  было, чтобы он не задумывался об этом; но и возможность выбрать
  где удобно инструмент».

  Требование распадается на три связанных части.

  (1) АГЕНТ ДОЛЖЕН ЗНАТЬ, ЧТО ПИСАТЬ. LLM-агент wavecode получает
      системный промпт, в котором до этого перечислялись звуки
      вручную: `s("sawtooth")`, `s("sbd")`, `s("bd" | "sd" | …)`.
      Ни пиано, ни синты, ни реальные имена ударных в списке не
      было — агент не мог выбрать их, а если выбирал, то по
      привычке из обучающей выборки. Хуже: промпт советовал имена,
      которых в wavecode НЕТ (`s("synth")`, `s("drums")`,
      `github:user/repo`), а каждое такое имя убивает весь паттерн
      (`sound X not found!`).

  (2) ВСЕ АЛГОРИТМЫ, ВЫДАЮЩИЕ КОД, ДОЛЖНЫ БРАТЬ РЕАЛЬНЫЕ
      ИНСТРУМЕНТЫ. Генераторов кода в приложении несколько: запись
      микрофона, запись пиано, транскрипция пиано, извлечение
      мелодии из score, свист, генератор одиночной ноты. Каждый
      держал СВОЙ литерал ('triangle' / 'piano' / 'synth' /
      'guitar' / 'casio'), и три из них ('casio', 'guitar',
      'synth') не были зарегистрированы нигде: выбрать такой
      инструмент в тулбаре пиано означало записать в score сниппет,
      который роняет весь паттерн при воспроизведении.

  (3) ВЫБОР ИНСТРУМЕНТА ДОЛЖЕН БЫТЬ ТАМ, ГДЕ УДОБНО. Пикер есть
      в панели свиста, в панели микрофона и по клику на имя звука в
      коде. Но у AI-панели — места, где пользователь РАЗГОВАРИВАЕТ
      о музыке — выбора не было: сказать агенту «на пиано» можно
      было только словами в инструкции, и он мог проигнорировать.

commitment: |
  (1) Системный промпт агента ГЕНЕРИРУЕТСЯ из каталога звуков
      (`domain/sounds.ts`): в нём перечислены все реально
      зарегистрированные имена — 9 осцилляторов, 6 мелодических
      сэмплов, 14 ударных — и правило «других имён нет». Запрещённые
      имена в промпте НЕ перечисляются: модель копирует токены из
      контекста, и упоминание `s("guitar")` в запрете повышает
      шанс, что модель его напишет.

  (2) User prompt получает блок «=== ИНСТРУМЕНТ ===» с выбранным
      пользователем инструментом — из AI-панели. Инструмент едет
      в запрос как явное указание, а не как пожелание.

  (3) Один инструмент по умолчанию на всё приложение:
      `DEFAULT_MELODIC_SOUND = 'piano'` (domain/sounds.ts). Его
      читают микрофон, запись пиано, транскрипция, извлечение
      мелодии, генератор одиночной ноты и свист. «По умолчанию» —
      это одно решение в одном месте, а не литерал в пяти модулях.

  (4) Тип `PianoInstrument` = реальные имена (`PIANO_INSTRUMENTS`):
      6 сэмплов банка + 6 осцилляторов. Выдуманные 'casio',
      'guitar', 'synth' убраны из кода и из типа; компилятор
      теперь ловит их на уровне типов.

  (5) Тулбар пиано предлагает каталог (нативный `<select>` — на
      телефоне 12 кнопок не помещаются).

  (6) `tsc --noEmit` + `vitest` + `lint:no-console` +
      `validate:presets` — exit 0; `mathc validate` на этом файле —
      exit 0.

