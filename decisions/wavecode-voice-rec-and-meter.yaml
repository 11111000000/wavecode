outcomes:
  - id: armed-state-lives-in-presentation-not-domain-fsm
    statement: |
      `RecordingPanel.test.tsx > RecordingPanel — voice-AI armed body`
      и `WhistleMiniFAB.test.tsx > WhistleMiniFAB — pointerdown /
      pointerup`: сигналы `voiceAIPanelArmed` и `whistlePanelArmed`
      хранятся в `voiceAIStore` / `whistleStore` соответственно,
      и НЕ в `voiceSessionReducer.tag` / `whistleSessionReducer.tag`.
      Доменный редуктор остаётся чистой функцией `(state, event) →
      nextState`; «пользователь открыл панель до старта» — это
      presentation concern, и его место в presentation-слое.
  - id: meter-availability-is-server-only
    statement: |
      `RecordingPanel.test.tsx > RecordingPanel — voice-AI live
      RMS meter — does not render the meter when voiceAIRmsLevel
      is null (cloud / off path)`: на облачном (Web Speech)
      пути `voiceAIRmsLevel()` остаётся `null`, и метра в DOM
      не рендерится. На серверном пути
      `getServerWhisperRmsLevel()` возвращает число, и
      `RecordingPanel` рендерит горизонтальную полосу
      с тем же `* 400` калибром, что и свист.
  - id: hold-vs-tap-keeps-existing-fast-tap-semantics
    statement: |
      `VoiceAIMiniFAB.test.tsx > VoiceAIMiniFAB — pointer handlers
      drive the FSM > fast pointerdown+pointerup (tap) opens the
      armed panel without starting a session`: быстрый тап на
      «Голос» не запускает сессию (`voiceAIState().tag === 'idle'`),
      а поднимает `voiceAIPanelArmed === true`. Hold-старт (>=
      50 мс) сохраняется без изменений.
  - id: whistle-fast-tap-opens-armed
    statement: |
      `WhistleMiniFAB.test.tsx`: быстрый тап на «Свист»
      (< 80 мс) НЕ вставляет нот; `whistlePanelArmed === true`;
      релиз на ≥ 80 мс останавливает orchestrator, но не
      вставляет ничего в score. Тест «pointerdown starts a
      session» сохранён — `fireEvent.pointerDown` + `await 120мс`
      всё ещё запускает orchestrator. «pointerup stops the
      session» обновлён, чтобы опираться на новое поведение.
  - id: apply-button-disabled-without-notes
    statement: |
      `RecordingPanel.test.tsx > RecordingPanel — whistle armed
      body — «Применить» stays disabled even with the panel armed
      but no notes`: при `micPreviewNotes().length === 0` кнопка
      «Применить» имеет `disabled === true`. После
      `setMicPreviewNotes([...])` и активной записи
      `disabled` снимается.
  - id: commit-on-release-removed-from-fab
    statement: |
      В `WhistleMiniFAB.releaseIfReal` и `onSpuriousLeave`
      вызов `commitWhistle()` убран — теперь они вызывают только
      `stopWhistle()` (или короткий эквивалент для sub-threshold
      pointer-up). Ручная вставка через «Применить» протестирована
      отдельным контрактом (см. `recording-panel-apply-splices` в
      obligations), и существующий тест `whistleStore.test.ts >
      commit splices the buffered notes into appStore.score via
      replaceScore` остаётся авторитативным для поведения
      `commitWhistle`.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0;
      все новые тесты (armed body для голоса и свиста, метра,
      behavior fast tap, apply disabled) проходят; старые
