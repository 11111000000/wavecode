intent: |
  Вытащить AI и свист из-под табов TabBar в always-visible Floating
  Action Button (FAB) — один большой FAB + два мини-FAB (voice-AI и
  whistle). Voice-AI: push-to-talk + tap-to-session (continuous) →
  Web Speech API (ru-RU) → llmEdit → eval, barge-in по дефолту.
  Whistle: press-and-hold → существующий micCapture → snippet →
  eval. Один MediaStream-канал на двоих через micChannelMutex
  (mutext на уровне намерений; в MVP Chrome разделяет speech-api
  и mic-direct физически). Архитектура с первого дня готова к
  wake-word (WakeWordDetector interface), Whisper fallback
  (STTEngine interface + WhisperSTTStub), voice transport /
  preset / system intents (VoiceIntent tagged union + intentRouter),
  voice history, persona, мультиязычности (stores объявлены пустыми).

commitment: |
  (1) 4-слойная архитектура (domain / application / infrastructure /
  presentation) с Effect-TS, ESLint no-restricted-imports per layer
  остаётся инвариантом — все новые модули подчиняются тем же правилам.
  (2) STTEngine / WakeWordDetector / VoiceIntent — extension points
  для последующих пакетов; MVP импл-ы (WebSpeechSTT, no-op
  WakeWordDetector-stub, edit-score-only intentRouter) подключаются
  без правок домена. (3) micChannelMutex — pure reducer в domain,
  один mic-direct owner за раз; speech-api-internal (Chrome) сосуществует
  с mic-direct. (4) tsc + eslint + vitest зелёные; mathc validate
  + self-check зелёные.

counterexample: |
  «Всё это уже есть — MicPanel + AIEditPanel живут в TabBar, FAB
  overengineering». Возражения: (a) TabBar = 8 табов на mobile-first
  viewport 360px, иконки 20px — affordance "нажми чтобы управлять
  голосом" теряется среди Step/Piano/Mixer/Visualize; (b) AIEditPanel
  требует 4 шага до результата (открыть таб → написать → submit →
  ждать), а не 1 (нажать FAB → сказать → слышать); (c) MicPanel
  заставляет выбирать piano/synth/drums + slot перед первым
  свистом — для elementary UX это лишнее трение.

  «Web Speech API deprecated — лучше сразу Whisper». Возражения:
  Web Speech API НЕ deprecated (активно поддерживается Chrome 33+,
  Edge, текущая спецификация W3C); deprecation касался старого
  webkitSpeechGrammarList, не основного API. Whisper-WASM = +30 MB
  bundle, server-Whisper = +сетевой round-trip + cost. STTEngine
  интерфейс готов к plug-in, fallback — отдельный пакет когда
  появится спрос.

  «Wake-word обязателен для hands-free elementary UX». Возражения:
  wake-word требует (a) Porcupine/Snowboy (~2 MB WASM + license key)
  и (b) постоянного listening = расход батареи + privacy concern.
  Tap-on-FAB = 0.5s до начала записи, проще, не требует запоминания
  фразы. Wake-word — отдельный opt-in пакет.

antithesis: |
  (1) «AI и Mic должны оставаться в табах — discoverability через
  navigation». Возражения: navigation tabs в mobile-first layout —
  для продвинутых настроек, а не для primary actions. Live-coding —
  это primary action. Material Design / iOS HIG explicit: primary
  action = FAB, не buried в navigation.

  (2) «Whistle — фича для гиков, не нужна в MVP». Возражения:
  уже работает (см. decisions/wavecode-mic-to-strudel@1), просто
  закопана. Zero marginal cost пересадить из MicPanel в专用
  мини-FAB без селекторов. Свист — наиболее естественный
  free-hand input для тех, кто не имеет MIDI-клавиатуры.

  (3) «micChannelMutex — overengineering, просто проверять флаг».
  Возражения: гонка между arm()-проверкой и реальным start()
  даёт двойную запись. Effect.Ref + mutex.reduce дают
  typed busy-state + structured concurrency. 60 строк domain
  кода, 8 строк теста — окупается при первом реальном
  race-condition в Firefox (speech-api + mic-direct).

  (4) «VoiceIntent classifier и intentRouter избыточны для MVP
  где только edit-score». Возражения: 30 строк domain + 50 строк
  application; добавление voice-transport / voice-preset в следующих
  пакетах = +20 строк в router, ноль касаний STT / session / store.
  Сейчас = investment в extensibility за 1 час работы.

