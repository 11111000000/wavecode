          result: pass
  - id: domain-audio-tests
    claim: |
      vitest на `ui/src/domain/audio/MicChannel.test.ts`,
      `micChannelMutex.test.ts`, `whistleSession.test.ts` зелёный,
      ≥8 тестов покрывают: MicChannel ownership semantics,
      mutex acquire/release/contention, whistleSession lifecycle.
    acceptance:
      all:
        - verifier: vitest-run-domain-audio
          result: pass
  - id: stt-engine-interface
    claim: |
      `ui/src/application/voice/STTEngine.ts` экспортирует
      `STTEngine` interface (Context.Tag) с методами `start`,
      `stop`, `stream: Stream<TranscriptChunk>`. WebSpeechSTT
      реализует его; компилируется через `implements STTEngine`
      (type-check обязателен, не runtime check).
    acceptance:
      all:
        - verifier: tsc-implements-check
          result: pass
  - id: web-speech-stt-fallback
    claim: |
      WebSpeechSTT определяет `isSupported(): boolean` (проверяет
      `window.SpeechRecognition || window.webkitSpeechRecognition`);
      WhisperSTTStub возвращает `isSupported() === false` и `start`
      → `Effect.fail(SttUnsupportedError)`. Presentation ловит
      ошибку и рендерит disabled FAB с tooltip "открой Chrome".
    acceptance:
      all:
        - verifier: vitest-run-stt-web-speech
          result: pass
  - id: intent-router-routes-edit-score
    claim: |
      `intentRouter.route({ kind: 'edit-score', instruction: 'add bass' })`
      вызывает `LLMClient.streamCompletion` с правильным system
      prompt, парсит ответ, вызывает `AudioEngine.eval`. Тест с
      мокнутыми LLMClient + AudioEngine подтверждает порядок и
      аргументы.
    acceptance:
      all:
        - verifier: vitest-run-intent-router
          result: pass
  - id: presentation-lifecycle
    claim: |
      `VoiceFAB.test.tsx` + `voiceAIStore.test.ts` +
      `whistleStore.test.ts` + `micMutexStore.test.ts` зелёные,
      покрывают: press-and-hold lifecycle (pointerdown → listening
      → release → applying → idle), tap-continuous (tap → listening
      → second tap → idle), error display (STT unsupported),
      mutex contention (whistle active → voice-AI.start() rejected).
    acceptance:
      all:
        - verifier: vitest-run-presentation-voice
          result: pass
  - id: typecheck-clean
    claim: |
      `pnpm -C ui typecheck` exit 0 после merge.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
  - id: eslint-clean
    claim: |
      `pnpm -C ui lint` exit 0; layer rules (no-restricted-imports)
      не нарушены.
    acceptance:
      all:
        - verifier: pnpm-ui-lint
          result: pass
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-voice-fab.yaml` exit 0;
      `mathc self-check` exit 0 на коммите merge.
    acceptance:
      all:
        - verifier: mathc-validate
          result: pass
        - verifier: mathc-self-check
          result: pass
  - id: no-cross-layer-regressions
    claim: |
      `grep -rE 'from .@strudel|from .@ai-sdk|from .idb-keyval' ui/src/domain/voice ui/src/domain/audio/MicChannel.ts ui/src/domain/audio/micChannelMutex.ts ui/src/domain/audio/whistleSession.ts ui/src/application/voice` returns no matches. Domain остаётся pure; infrastructure не импортит solid-js.
    acceptance:
      all:
        - verifier: text-scan-no-cross-layer
          result: pass
  - id: preserves-micpanel-and-aieditpanel
    claim: |
      `ui/src/presentation/components/MicPanel.tsx` и
      `ui/src/presentation/panels/AIEditPanel.tsx` НЕ удалены,
      продолжают работать. MicPanel остаётся доступен через TabBar
      "Mic" таб для продвинутых; AIEditPanel — через TabBar "AI"
      для текстового ввода и настроек. FAB — дополнительный путь,
      не замена.
    acceptance:
      all:
        - verifier: text-scan-micpanel-aieditpanel-present
          result: pass

