outcomes:
  - id: voice-ai-fab-press-and-hold
    statement: |
      Press-and-hold на voice-mini-FAB → Web Speech API запускается
      с lang='ru-RU' и interim=true; interim-транскрипт появляется
      в VoiceTranscriptOverlay в течение 200ms; release →
      final-транскрипт летит в intentRouter, классифицируется как
      edit-score, applyEditStream вызывается, AudioEngine.eval
      исполняет очищенный score, юзер слышит результат.
  - id: voice-ai-fab-tap-continuous
    statement: |
      Tap (короткое нажатие) на voice-mini-FAB → стартует continuous
      сессия: STT продолжает слушать между utterance-ами, каждая
      новая фраза → apply + apply. Второй tap → disarm + idle.
      Только один voice-AI mini-FAB активен за раз (mic mutex).
  - id: voice-ai-fab-barge-in
    statement: |
      Если новая final-транскрипт приходит во время applying (state
      = `applying`), текущий LLM-запрос отменяется через
      Fiber.interrupt, новый запрос стартует немедленно. Музыка
      не прерывается. Barge-in toggle в voice settings (default ON).
  - id: whistle-fab-press-and-hold
    statement: |
      Press-and-hold на whistle-mini-FAB → существующий
      `micCapture.startMic()` стартует (через whistleStore wrapper
      без селекторов piano/synth/drums — дефолт piano); interim
      preview нот в MicMeter. Release → `micSnippetFromBuffers` →
      `appStore.dispatch({ type: 'replaceScore' })` (или append-stack,
      по дефолту append) → AudioEngine.eval. Детектор отрабатывает
      тот же MPM-pipeline, что и MicPanel.
  - id: mic-mutex-correct
    statement: |
      `micChannelMutex.acquire({ owner: 'whistle' })` во время
      активного voice-AI (если последний использует mic-direct —
      Whisper-путь) — возвращает `MicBusy`. В MVP voice-AI
      использует speech-api-internal → mutex фактически
      не срабатывает; test suite покрывает оба пути для
      forward-compat.
  - id: transcript-overlay
    statement: |
      VoiceTranscriptOverlay показывает interim-транскрипт
      ("🎙️ слышу: сделай по…") во время `listening`, final
      ("✓ «сделай побыстрее»") во время `transcribing`,
      скрывается в `idle` и `errored`. Floating под FAB,
      не перекрывает critical UI (SafeArea bottom >= 16px).
  - id: extension-points-stable
    statement: |
      STTEngine interface, WakeWordDetector interface, VoiceIntent
      tagged union, intentRouter dispatcher, micChannelMutex
      — все объявлены в MVP-имплах и стабильны. Добавление
      Whisper / wake-word / voice-transport / voice-preset /
      voice-undo = новый файл в infrastructure/ или новая case в
      VoiceIntent union + route в intentRouter. Никаких правок
      в domain / store / FAB components.
  - id: eslint-layers-still-clean
    statement: |
      `pnpm -C ui lint` exit 0 после merge. ESLint rules per layer
      (no-restricted-imports) применяются к новым файлам; новые
      override-блоки не нужны.
  - id: tsc-clean
    statement: |
      `pnpm -C ui typecheck` exit 0 после merge. Strict mode
      TypeScript; новые типы exhaustive (VoiceIntent = noFallthrough
      в switch; VoiceSessionState — `as const` union).
  - id: tests-pass
    statement: |
      `pnpm -C ui test` exit 0, ≥30 тестов на новый код:
      voiceSession, voiceIntentClassifier, micChannelMutex,
      Transcript, WebSpeechSTT interface compliance,
      intentRouter routing, VoiceAISession orchestrator
      (с моками LLMClient + AudioEngine), WhistleSession,
      presentation lifecycle (press/release/tap).

obligations:
  - id: domain-voice-tests
    claim: |
      vitest на `ui/src/domain/voice/*.test.ts` зелёный, ≥10 тестов
      покрывают: Transcript transitions, voiceSession state machine
      (idle → arming → listening → applying → idle + barge-in path),
      voiceIntentClassifier (edit-score routing + unknown → null),
      VoiceIntent exhaustive type tests.
    acceptance:
      all:
