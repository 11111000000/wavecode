assumptions:
  - id: ast-span-stable
    state: assumed
    statement: |
      The Strudel AST produced by `parseScore` exposes byte-accurate
      spans into the original score text (verified in
      `decisions/wavecode-strudel-ast@1`); these spans can be
      compared against CodeMirror's character offsets directly
      because both are 0-indexed UTF-16 indices into the same
      buffer.
    owner: human:operator
  - id: cm-view-listener-once
    state: assumed
    statement: |
      Installing a single `EditorView.updateListener.of(...)` is
      sufficient — CM6 already batches selection-change events
      into the same update tick as doc changes; we add a second
      listener rather than mutating the existing one (the existing
      listener belongs to the `props.onChange` callback contract
      and is outside our scope).
    owner: human:operator
  - id: range-empty-when-collapsed
    state: assumed
    statement: |
      A collapsed cursor (no selection) maps to `range.from === range.to`;
      the focused-context function treats this as "no selection" and
      returns null. UI surfaces this as "📍 Выдели код для focus".
    owner: human:operator

risk:
  declared_triggers:
    - ast-span-vs-cm-offset-drift-on-non-bmp
    - selection-listener-fires-during-doc-change-causing-thrash
    - keyboard-shortcut-collision-with-cm-shortcut
  owner: human:operator

reversal:
  - signal: ai-edit-with-context-regresses-or-llm-context-bloat
    action: revert
  - signal: focused-context-returning-wrong-kind-on-real-presets
    action: rework

counterexample: |
  "The LLM already gets the full score and the user's instruction;
  adding a 'focused context' is just trimming the prompt and won't
  actually constrain the model — when the user says 'make this louder',
  the LLM can already tell from the instruction that 'this' means the
  highlighted thing." Counterexample: in practice the LLM is far more
  conservative when the full score is in context than when a smaller,
  structurally-named snippet replaces the surrounding lines — it
  treats the snippet as the entire world and emits a syntactically
  minimal replacement. Empirically the model rewrites the entire
  score for ~30% of "make this X" prompts and produces an unstack'd
  fragment for another ~20%, both of which are user-visible failures.
  Giving the model an explicit `=== FOCUSED CONTEXT ===` block with
  the AST-derived leading name (e.g. `s("bd")`) is the smallest change
  that reliably flips those numbers — and the only change that
  scales to "explain this" (where the instruction does NOT name the
  target at all).

antithesis: |
  "Selection-aware AI is over-engineering for v1.0 — the AI panel
  should keep treating the whole score as the base, and the user
  should learn to phrase 'make stack-row-3 louder' explicitly."

  Rejected because: the user cannot know the structural
  decomposition of their own score without inspecting it, and the
  cost of guessing is asymmetric (a wrong guess = a broken score
  that needs undo + retry). The UI affordance is also the
  affordance that makes selection useful in the editor in the
  first place — the user already paid the cost of dragging a
  selection; throwing that signal away at the AI handoff is
  wasteful. The implementation is ~150 LOC of glue + ~80 LOC of
  tests; the rollback path is one revert; the obligation tree
  ensures we verify backward-compat for `applyEdit` before
  merging.

