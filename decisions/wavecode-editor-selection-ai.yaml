outcomes:
  - id: focused-context-public-api
    statement: |
      `ui/src/presentation/state/editorSelection.ts` exports the
      `FocusedContext` discriminated union and
      `getFocusedContext(scoreText, range)`. The function is pure
      and depends only on `ui/src/domain/strudel` (parseScore +
      walker span matching).
  - id: ast-aware-precedence
    statement: |
      When a range falls inside BOTH a `CallNode` and the
      surrounding `StackNode`'s row, the returned context kind is
      `function-call` (more specific scope wins). When the range
      spans exactly one stack arg but no inner call, kind is
      `stack`. Partial / inter-node ranges return `text`. Empty
      ranges return `null`.
  - id: selection-signals-live
    statement: |
      `selectionRange()` and `selectedText()` are Solid signals
      updated by an `EditorView.updateListener` registered inside
      `installSelectionTracker`. The first update fires within
      the same tick as the first selection change (verified by a
      unit test that drives a mock view).
  - id: apply-edit-backward-compat
    statement: |
      `applyEdit(score, instruction, history, audioState, opts)`
      compiles and runs unchanged — no new required parameter,
      byte-identical prompt output for any input that does NOT
      pass a focused context. Verified by the existing
      `llmEdit.test.ts` passing without edits.
  - id: apply-edit-with-context-prompt
    statement: |
      `applyEditWithContext(... , context)` produces a user
      prompt that contains a `=== FOCUSED CONTEXT ===` block with
      the context kind, name (when present) and verbatim source
      text; the rest of the prompt matches `applyEdit` byte-for-
      byte. Verified by a new test in `llmEdit.test.ts`.
  - id: ui-toggle-and-status
    statement: |
      AIEditPanel renders a "Применить к выделенному" toggle and a
      status line `📍 Focus: <name>` when AST matching succeeds,
      or `📍 <N> символов` when text-fallback applies. Submit is
      disabled when toggle is ON and selection is empty.
  - id: hotkey-wired
    statement: |
      `Ctrl+Shift+L` / `Cmd+Shift+L` invokes the registered
      `aiExplainSelected` handler, which sets the toggle ON and
      focuses the AI textarea. The handler is registered from
      AIEditPanel's onMount via a module-level signal so the
      frozen App.tsx is not modified.

