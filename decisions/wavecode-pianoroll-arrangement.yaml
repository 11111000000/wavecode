counterexample: |
  "Слои, секции и ударные — это уже визуализатор Strudel (панель
   Visualize) и StepGrid; дублировать их в piano roll не нужно."

  Возражение: Visualize показывает ОДНУ репетицию паттерна как
  «визуализацию» (спектро/форму волны), а StepGrid — сетку 16×8 для
  ручного набора ударных. Ни один из них не показывает аранжировку
  на таймлайне: где куплет, где припев, какой слой играет, где
  бас, а где хэт. Именно это и есть «диаграмма-гант» по музыке,
  ради которой человек открывает roll. Плюс Visualize и StepGrid
  живут в других панелях — рядом с партитурой они не сравнимы.

antithesis: |
  "Вместо самодельной модели слоёв взять настоящие хапы Strudel
   (`compileAndQuery` → queryArc): они уже содержат и точные
   времена, и длительности, и реальные события."

  Отклонено — но с оговоркой, что это правильная цель на
  следующую итерацию. `queryArc` даёт абсолютные координаты
  планировщика, а у ролла — собственные такты скорба (и `.slow(1.3)`
  на весь скорб растягивает их по-разному). Свести эти две системы
  координат — отдельная работа, и она тянет за собой перенос
  редактирования (клик-add сейчас пишет в номинальную модель).
  Сейчас модель честно разбирает AST скорба: если скорб написан
  слоями — он нарисован слоями; если это не так (например, один
  `note(...)` с европейским ритмом), ролл покажет ноты, но не
  покажет «слои», которых в скорбе нет.

