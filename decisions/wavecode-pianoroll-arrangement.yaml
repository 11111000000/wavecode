intent: |
  Piano roll — это «диаграмма-гант» по музыке. Она должна показывать
  не серые прямоугольники, а АРАНЖИРОВКУ: какие слои играют, где
  секции, где ударные, что сейчас звучит.

  До этого решения roll показывал только ноты — одним цветом, без
  секций и без барабанов. На пресете Creep (8 секций: куплет без
  ударных, припев с полным набором) это выглядело как однородная
  каша: из визуализации невозможно было понять, где куплет, где
  припев и почему один такт звучит совсем иначе, чем следующий.

axiom_link:
  - A0
  - A1
  - A3

commitment: |
  1. Roll показывает СТРУКТУРУ скорба:
     - слой = ветка `stack(...)`; каждый слой получает свой цвет
       (мелодия — холодная половина круга, ударные — тёплая), и
       цвет закреплён за ПОЗИЦИЕЙ слоя, поэтому один и тот же
       инструмент сохраняет цвет от секции к секции;
     - ударные (`s("...")`) рисуются отдельными дорожками под
       линейкой — с названием сэмпла (bd/sd/hh/crash);
     - секции (`cat`) рисуются полосами с разделителями и номерами
       S1..SN в линейке; секция под playhead'ом подсвечена ярче.
  2. Громкость слоя (`.gain(...)` из скорба) видна как яркость:
     тихий слой нарисован тише.
  3. Дорожки ударных живут ПОД линейкой, а не внизу холста: низ
     ролла перекрывает панель ИИ, а дорожка под панелью — это
     дорожка, которой нет.
  4. Полоса ударных не съедает область высот: под неё остаётся не
     меньше 96 px.
  5. Roll занимает ту высоту, которую даёт раскладка (панель ИИ
     докирует снизу), и перерисовывается при её изменении
     (ResizeObserver). Раньше высота была жёстко 320 px, и низ
     ролла (басовая линия) обрезался.
  6. Модель ролла — ЕДИНСТВЕННЫЙ источник правды: `rollModel`
     отдаёт ноты, удары, слои, секции и тайминг из одного обхода
     AST. Двух параллельных извлечений (таймлайн + события) больше
     нет — они могли разойтись, и playhead рисовался бы по другой
     модели, чем ноты.
  7. Mini-notation разбирается одним парсером: `parseMiniSteps`
     отдаёт токены с их позициями, из них строятся и ноты
     (токен → MIDI), и удары (токен → имя сэмпла). `*N` раскрывается
     и в голой последовательности (`s("drums_hh*8")` = 8 хэтов).

outcomes:
  - id: layers-have-colours
    statement: |
      Каждая ветка `stack` нарисована своим цветом; ударные — тёплой
      палитрой, мелодия — холодной, один и тот же инструмент сохраняет
      цвет между секциями.
  - id: drums-are-visible
    statement: |
      Ударные рисуются отдельными дорожками (bd/sd/hh/crash) с
      реальными ударами: куплет без ударных и припев с кистью видны
      как разные.
  - id: sections-are-visible
    statement: |
      Секции `cat` видны как полосы с разделителями и номерами S1..SN;
      текущая секция подсвечена.
  - id: gain-is-visible
    statement: |
      Тихое слоя нарисовано тише (его `.gain` из скорба).
  - id: nothing-is-clipped
    statement: |
      Roll занимает всю доступную высоту и не обрезается нижней
      панелью; при изменении раскладки он перерисовывается.
  - id: one-model
    statement: |
      Ноты, удары, слои, секции и тайминг приходят из одного
      `extractRollModel`; отдельного извлечения событий для playhead
      больше нет.

