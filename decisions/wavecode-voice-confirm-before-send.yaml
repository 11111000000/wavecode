outcomes:
  - id: auto-commit-removed-final-lands-in-review
    statement: |
      `VoiceAISession.test.ts > createVoiceAISession — happy-path
      FSM transitions`: финальный чанк не приводит FSM в
      `requesting` или `idle` сам по себе; FSM транзитом
      `idle → arming → listening → (chunk) → transcribing →
      enter-review → review`. `rec.llmCalls === 0` сразу после
      финального чанка. Это прямое утверждение «ничего не
      уходит в ИИ без нажатия».
  - id: send-review-routes-text-and-reaches-idle
    statement: |
      `VoiceAISession.test.ts > walks idle → ... → sendReview after
      auto-review routes the edited text and FSM reaches idle`:
      после автоматического попадания в `review` пользовательский
      `sendReview(text)` через `runRouteFromReview` (форк через
      `Effect.forkDaemon` + `inFlightRef`) переводит FSM через
      `requesting → applying → idle` и `rec.llmCalls === 1`,
      `rec.evalInputs[0]` совпадает с LLM-ответом. Это прямое
      утверждение «нажатие «→ В ИИ» отправляет текст и
      завершается».
  - id: review-state-transit-only-after-send
    statement: |
      `VoiceAISession.test.ts > persists state through the queue;
      auto-review is the terminal auto-path tag`: stream API
      публикует тэги `arming, listening, transcribing, review`.
      Tags `requesting` / `applying` НЕ появляются в авто-пути.
      `transitions[last] === 'review'`. Если кто-то случайно
      вернёт auto-commit, `toContain('requesting')` пройдёт и
      тест упадёт с понятным diff'ом.
  - id: recording-panel-review-form
    statement: |
      `RecordingPanel.test.tsx > RecordingPanel — review form
      (voice-AI inline confirmation)`: в состоянии `review` панель
      рендерит `<textarea class="voice-recording-panel__review-textarea">`
      с распознанным текстом, рядом — `<button class="voice-recording-panel__btn voice-recording-panel__btn--primary">`
      с подписью «→ В ИИ». Кнопка `disabled=true` когда текст —
      `trim('')` (whitespace-only или пустой). После
      `fireEvent.input(ta, ...)` с пустой строкой `disabled`
      переключается на `true`. Head-X в этом состоянии имеет
      `aria-label="Отменить и не отправлять текст в ИИ"` и
      `title` со словом «Отменить». Никаких `<role="dialog">`,
      никаких `.voice-review-panel`, ровно одна панель в DOM.
  - id: cancel-review-no-llm
    statement: |
      `VoiceAISession.test.ts > createVoiceAISession — review-and-edit
      > cancelReview returns to idle without invoking the LLM`:
      вход в `review` через `enterReview` → `cancelReview` через
      reducer → FSM `idle`. `rec.llmCalls === 0`. Это
      подтверждает, что ✕ в head действительно отменяет без
      побочных эффектов на LLM.
  - id: barge-in-mid-send-still-interrupts
    statement: |
      `VoiceAISession.test.ts > createVoiceAISession — barge-in
      > cancelInFlight resets the FSM to idle mid-route`: явный
      путь `enter-review-from-listening → sendReview → requesting →
      applying` (через `Effect.runPromise(handle.sendReview(...))`),
      `routeStarted` ловит момент старта LLM-вызова, `cancelInFlight`
      прерывает in-flight fiber. FSM приходит в `idle`. Это
      доказывает, что `runRouteFromReview`'s fork не сломал
      barge-in семантику, которая была нужна автокоммит-пути.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc + vitest +
      lint:no-console + validate:presets) завершается exit 0; 22
      RecordingPanel-теста, 8 VoiceAISession-теста и
      `voiceAIStore`-тесты проходят. `tsc` strict; `lint:no-console`
      не нарушен (нет `console.*` в редактированных файлах).
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-voice-confirm-before-send.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
  - id: live-transcript-decision-superseded-where-needed
    statement: |
      `decisions/wavecode-voice-live-transcript.yaml` помечен как
      `superseded_by: [wavecode-voice-confirm-before-send@1]`
      через явное `relations.superseded_by` — старая запись
      об отсутствии UI-аффорданса для review в outcome
      `live-text-replaces-check-modal` более не действует. Прочие
      outcomes (live interim + watchdog на silent primary,
      TICK_MS, server-round-trip-is-physical) остаются
      авторитативными.

obligations:
  - id: auto-final-no-llm
    claim: |
      `VoiceAISession.test.ts` содержит тест «walks idle → ...
      → review (final chunk awaits confirmation, no LLM call)»:
      финальный чанк в STT-стриме при `transcribing` FSM
      приводит к `review` (НЕ `requesting`/`applying`/`idle`),
      `rec.llmCalls === 0`.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-session
          result: pass
  - id: send-review-after-auto-routes
    claim: |
      `VoiceAISession.test.ts` содержит тест «sendReview after
      auto-review routes the edited text and FSM reaches idle»:
      `Effect.runPromise(handle.sendReview(text))` после
      автоматического `review` приводит к `idle` через
      `requesting → applying`, `rec.llmCalls === 1`.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-session
          result: pass
  - id: stream-emits-review-not-requesting-on-auto-path
    claim: |
      `VoiceAISession.test.ts` тест «persists state through the
      queue; auto-review is the terminal auto-path tag»:
      `handle.stream` после авто-пути публикует tags
      `['arming', 'listening', 'transcribing', 'review']` и
      НЕ публикует `requesting` или `applying`;
      `transitions[last] === 'review'`.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-session
          result: pass
  - id: barge-in-preserved
    claim: |
      `VoiceAISession.test.ts` тест «cancelInFlight resets the FSM
      to idle mid-route»: после `enter-review` явно вызванный
      `sendReview` поднимает FSM до `requesting`/`applying`,
      `cancelInFlight` прерывает in-flight fiber из `inFlightRef`
      и FSM приходит в `idle`.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-session
          result: pass
  - id: recording-panel-review-renders
    claim: |
      `RecordingPanel.test.tsx > renders an editable textarea
      seeded with the recognised text`: в `review` состоянии
      рендерится `.voice-recording-panel__review-textarea` со
      значением, равным `voiceAIState().editedText`. Aria-label
      содержит «Распознанный текст».
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: send-button-disabled-on-empty
    claim: |
      `RecordingPanel.test.tsx > disables the → В ИИ button when
      the buffer is whitespace-only` И
      «disables the → В ИИ button after the user clears the
      textarea»: `.voice-recording-panel__btn--primary` имеет
      `disabled=true` когда `editText().trim().length === 0`;
      после `fireEvent.input(ta, { value: '' })` `disabled`
      переключается на `true`.
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: no-review-modal-returns
    claim: |
      `RecordingPanel.test.tsx > keeps the textarea in the same
      panel — never opens a modal`: в `review` состоянии
      `container.querySelector('.voice-review-panel')` возвращает
      `null`; `container.querySelector('[role="dialog"]')`
      возвращает `null`; ровно один `.voice-recording-panel` в
      DOM (`.length === 1`).
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: head-x-cancels-in-review
    claim: |
      `RecordingPanel.test.tsx > head ✕ label switches to
      "Отменить и не отправлять текст в ИИ" in review`:
      `aria-label` и `title` head-X содержат «Отменить» и
      «не уйдёт» / «не отправлять». В `listening` тот же
      атрибут равен «Остановить запись» (функциональная
      разность, не косметика).
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: precommit-gate-green
    claim: |
      `cd ui && npm run test:precommit` завершается exit 0
      (tsc strict + 22 RecordingPanel теста + 8 VoiceAISession
      теста + lint:no-console + validate:presets).
    acceptance:
      all:
        - verifier: pnpm-ui-test-precommit
          result: pass
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-voice-confirm-before-send.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: mathc validate
          result: pass
  - id: live-transcript-superseded-where-needed
    claim: |
      `decisions/wavecode-voice-live-transcript.yaml` имеет
      `relations.superseded_by: [wavecode-voice-confirm-before-send@1]`
      запись; outcome `live-text-replaces-check-modal`
      документирован как superseded с явным указанием на
      эту ревизию.
    acceptance:
      all:
        - verifier: text-scan-superseded-by-link
          result: pass

