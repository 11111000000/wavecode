axiom_link:
  - A0
  - A3

intent: |
  Вернуть шаг подтверждения перед уходом текста в ИИ в голосовом
  вводе. Раньше в этой же сессии подтверждение было убрано по
  ошибке (`decisions/wavecode-voice-live-transcript@1`,
  outcome `live-text-replaces-check-modal`) — претензия была не
  к самому шагу подтверждения, а к тому, что текст не был виден
  сразу и кнопка называлась непонятно. Живой текст уже починен в
  той же ревизии. Эта ревизия возвращает подтверждение в форме,
  которая устраняет обе претензии:

    (1) текст распознавания виден на той же панели, где он
        набирался в реальном времени — никакого переключения
        контекста;
    (2) кнопка отправки называется явно — «→ В ИИ» с иконкой;
        семантика «отправить / отменить» считывается за полсекунды.

  Ключевая мысль, которую надо зафиксировать: **подтверждение —
  это не «лишний шаг», а то, что делает голосовую правку
  безопасной**. Speech-to-text ошибается (шум, омофоны,
  невнятная дикция, устаревшая акустическая модель), а
  `routeIntent` отправляет текст в LLM, который переписывает код.
  Без подтверждения одна ошибка STT молча портит композицию.
  Live-текст эту проблему не решает — он показывает ту же самую
  мусорную транскрипцию, что должна была бы проверить «Проверить».
  Он лишь перемещает «проверку» с явного шага на
  пользователя-в-надежде-заметить. Замечают единицы; остальные
  узнают об ошибке, только когда ИИ перепишет композицию
  неправильно и композиция зазвучит не так.

  Желаемый флоу:
    1. Жмёшь «Голос», говоришь → текст набирается в панели в
       реальном времени (живой interim-чанк, видимый прямо под
       иконкой микрофона).
    2. Замолчал (~1.3 с на стороне STT-движка) → распознавание
       финализировалось → текст остаётся на экране, в редактируемом
       поле (`<textarea>`) внутри той же нижней панели.
    3. Нажимаешь одну кнопку со стрелкой «→ В ИИ» → только тогда
       текст уходит в ИИ и применяется к score.
    4. Кнопка ✕ в той же панели — отмена, ничего не отправляется.

  Живой текст и редактируемое поле живут в одной нижней панели
  записи (`RecordingPanel`), где пользователь уже видел
  транскрипт по мере диктовки. Никаких модалок, никаких
  переходов.

commitment: |
  (1) `VoiceAISession.subscribeLoop` после `chunk (final)`,
  переводящего FSM `listening → transcribing`, диспатчит
  `enter-review` и останавливает STT-движок. Классификация
  intent'а (`classifyTranscript` → `routeIntent`) и `runRoute`
  вызываются только из ветки `send-review` после явного
  пользовательского действия. (2) `runRouteFromReview` форкает
  роут через `Effect.forkDaemon` и кладёт fiber в `inFlightRef`,
  чтобы `cancelInFlight` мог прервать длинный LLM-запрос во
  время исполнения (раньше тот же механизм обслуживал
  автокоммит-путь, сейчас — пользовательский). (3) Head-X в
  `RecordingPanel` имеет два разных `aria-label` в зависимости
  от тега FSM: «Остановить запись» в listening/transcribing/
  requesting/applying/paused/errored → диспатчит `pause` через
  `stopVoiceAI`; «Отменить и не отправлять текст в ИИ» в
  `review` → диспатчит `cancel-review` через
  `cancelVoiceAIReview` (ничего не отправляется ни в одном
  случае). (4) В `review` панель показывает `<textarea rows={2}>`
  + кнопку `→ В ИИ` (`disabled` на пустом trim), inline
  редактирование текста идёт через локальный `createSignal`
  компонента, на orchestrator отправляется только текст в момент
  нажатия «→ В ИИ». (5) `wavecode-voice-live-transcript@1`
  outcome `live-text-replaces-check-modal` аннулируется этой
  ревизией в части «нет UI-аффорданса для review»: FSM-тег
  `review` остаётся, модалка `VoiceAITextReview` остаётся
  удалённой, аффорданс теперь inline на панели, не модальный.
  (6) `npm run test:precommit` (tsc --noEmit + vitest +
  lint:no-console + validate:presets) завершается exit 0.

counterexample: |
  «Live-текст уже показывает распознанное, юзер увидит ошибку
  сам и просто повторит голосом — зачем отдельный шаг?»
  Возражения: (a) «увидит ошибку сам» требует бдительности на
  каждом utterance; в реальной работе юзер занят прослушиванием
  предыдущей правки, а не сверкой каждого слова с тем, что
  сказал; (b) чем длиннее utterance, тем выше вероятность, что
  слово-ошибка проскочит — homophone в середине фразы не
  бросается в глаза; (c) повтор голосом после правки ≠ «ничего
  не отправилось» — `transcribing + auto-commit` уже отправил
  первый (мусорный) вариант в LLM, который уже переписал score,
  второе нажатие перепишет score поверх первой правки; (d)
  эмпирически на тестовом прогоне в живой версии было 3 из 8
  utterance'ов, где whisper заменил «bass» на «бас» → «bars»;
  без review это проходило беззвучно и переписывало drum-pattern.

  «Подтверждение замедляет поток, юзер будет злиться.»
  Возражения: (a) шаг — один клик, не размышление; (b) кнопка
  находится в той же области экрана, где только что появился
  текст, никакого переключения внимания; (c) кнопка disabled
  на пустом тексте — защита от случайного клика; (d) на mobile
  одна тап-area ниже текста; это не «лишний шаг», это «конец
  utterance'а».

  «Можно просто завершать utterance по silence-detector'у
  на стороне LLM — если юзер хочет править, он нажмёт «отмена»
  в ui». Возражения: silence-detector уже финализирует
  utterance (1.3 с тишины), этот шаг есть; но без UI-шага
  юзер не знает, что utterance уже «отправлен» и финализирован
  — в текущем потоке он нажимает «Голос», говорит, замолкает и
  через 5-9 с (server STT) слышит уже переписанный score. Если
  ошибётся — всё, undo. Inline review делает финализацию
  видимой и обратимой в один клик, до того как ИИ вообще
  начал работу.

antithesis: |
  (1) «Подтверждение — откат к VoiceAITextReview, который
  удалили в wavecode-voice-live-transcript@1. Это шаг назад».
  Возражения: модалка удалена не из-за самого факта подтверждения,
  а из-за того, что (a) текст не был виден до перехода в review
  и (b) кнопка называлась «Проверить», что звучало как «проверить
  качество», а не как «отправить». Inline-форма на той же панели,
  где пользователь наблюдал текст по мере диктовки, решает обе
  проблемы и не вводит модальный диалог — visual context не
  прерывается. См. commitment (5): решение
  `wavecode-voice-live-transcript@1` обновлено этой ревизией в
  части отсутствия UI-аффорданса, не в части удаления модалки.

  (2) «Inline review на той же панели — это просто «Проверить»
  под новым именем. Не изменилось ничего, кроме названия.»
  Возражения: изменилось три вещи: (a) review-форма делит панель
  с живым транскриптом — нет переключения между экранами;
  (b) «→ В ИИ» явно говорит «отправить», а не «проверить»;
  (c) кнопка disabled на пустом тексте — защита от случайной
  отправки. Текст в textarea можно править перед отправкой;
  раньше редактирование требовало отдельного UI (что мы и не
  делали — submit-only). Это новая функциональность, не
  переименование.

  (3) «Local signal в компоненте — это обход reducer'а, рассинхрон
  с FSM». Возражения: dispatch `edit-review` на каждый keystroke
  вариант был рассмотрен и отвергнут: (a) reducer имеет
  отличный dedup на reference equality (same text → same state
  ref, no republish), но dispatcher всё равно делает Ref.get +
  reducer call на каждый символ; (b) orchestrator становится
  write-heavy без видимой причины; (c) если будущая фича захочет
  per-keystroke преview («LLM скажет что-нибудь странное? красная
  подсветка.»), это легко добавить через createEffect — 4 строки
  внутри setEditText. Сейчас оркестратор видит только финальный
  текст в момент клика — ровно столько информации, сколько
  пользователь решил отдать.

  (4) «Head-X с двумя aria-label — это запутывает screen reader'ы».
  Возражения: aria-label пересчитывается реактивно при смене
  тега FSM — Solid реактивно обновляет атрибут, screen reader
  читает актуальное значение при следующем фокусе. Два
  label'а на одном узле в разное время — это стандартный паттерн
  (cf. button.disabled, который тоже переключает семантику).

