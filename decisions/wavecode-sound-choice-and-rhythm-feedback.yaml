schema: math-coding/3.3
id: wavecode-sound-choice-and-rhythm-feedback
revision: 1
state: active
body_sha: "sha256:aa28bf6722bf1dede93dca299aa3c28bb603175b13eba7357580a16bbd26c710"
yaml_sha: "sha256:aa28bf6722bf1dede93dca299aa3c28bb603175b13eba7357580a16bbd26c710"

intent: |
  Владелец (2026-11-16) после волны правок интерфейса сказал:

    * «настучать Ритм у нас не получается ничего не происходит»;
    * «когда мы свестим то мы не можем выбрать инструмент которым это
      потом применится, хотя мы видим ноты но они применяются и играют
      всегда фортепиано, непонятно как это пользоваться»;
    * «сделай так чтобы всё-таки все возможности действительно можно
      было использовать»;
    * «в общем лучше качество интерфейсов у нашего проекта».

  Четыре претензии, и все четыре — про одно и то же: возможности в
  приложении либо не работают, либо работают, но до них нельзя
  добраться, либо работают, но человек не видит результата. Разбор по
  коду и на живом проде (production-бандл `index-CK43MCIz.js`)
  подтвердил каждую:

    * **Ритм не давал обратной связи.** `applyRhythmToScore` делал
      `dispatch(replaceScore)` БЕЗ `evalScore` — паттерн попадал в
      текст, но не звучал. Результат при этом оставался ЗА листом ввода
      (лист занимает пол-экрана и закрывает редактор), а кнопка
      «Отметить» была `disabled` до нажатия «Старт» — на тач-экране
      это выглядит как «кнопка сломалась», потому что подсказка жила
      только в `title`. Во время прохода метронома не было: шаг шёл
      молча, отмечать было не по чему.
    * **Инструмент слоя нельзя было выбрать.** Слой партитуры умеет
      играть на чём угодно (`.s("triangle")`, `.s("sawtooth")`), но
      интерфейс не показывал звук слоя и не давал его сменить. Микшер
      показывал имя слоя и фейдер — и всё. Пиано-ролл писал
      `note("c4")` без `.s(...)`, то есть дефолт Strudel — всегда
      пианино. Человек видел ноты и слышал фортепиано, и не понимал,
      как это пользоваться.
    * **Часть возможностей была недостижима.** `MelodyGrid` (сетка
      16×36, 31 CSS-правило, покрыта тестами) не был смонтирован НИГДЕ
      — только в тесте. Лист `kind="gesture"` («Руки») открывался
      только из вкладки «Свист» листа ввода и не был описан в
      `toolRegistry`, то есть не находился ни в листе инструментов, ни
      в палитре ⌘K.
    * **Микшер схлопывался после записи.** `appendToTopStack` правил
      ТОЛЬКО верхнеуровневый `stack(...)`, а каждый пресет — это
      `cat(stack(…), stack(…), …)`. Поэтому запись оборачивала весь
      пресет во внешний `stack(...)`, и микшер (который перечисляет
      слои верхнеуровневых стеков) с 29 строк пресета `creep` падал до
      двух. Шаг-сетка с четырьмя ударными рядами схлопывалась в ОДИН
      слой: фейдер на нём двигал бы барабан, малый, хай-хэт и клэп
      разом.

  Это решение фиксирует четыре исправления: ритм с обратной связью,
  выбор инструмента слоя, монтаж недостижимых возможностей и
  сохранение адресуемости слоёв при записи.

commitment: |
  1. **Ритм слышен.** Во время прохода по сетке играет щелчок
     метронома (`playRhythmClick`): акцент на начале доли (1600 Гц),
     остальные шаги тише (1100 Гц), 60 мс. Отметка шага проигрывает
     голос этого шага (`previewRhythmHit`) — бочка, малый барабан или
     хай-хэт, — чтобы человек слышал, ЧТО он отметил.
  2. **Результат ритма виден и звучит.** `applyRhythmToScore` после
     `dispatch(replaceScore)` вызывает `evalScore`, и лист ввода
     закрывается (`closeInputSheet`). Паттерн не остаётся за листом.
  3. **Кнопка «Отметить» всегда живая.** Она больше не `disabled`:
     нажатие вне прохода запускает проход, нажатие во время прохода
     отмечает текущий шаг. Подсказка «как пользоваться» переехала из
     `title` в видимую строку `.rhythm-capture__hint`, потому что на
     тач-экране `title` не виден.
  4. **Звук слоя виден.** У каждого слоя микшера показан его звук:
     у мелодического слоя — селектор с текущим инструментом, у
     ударного (`s("drums_bd …")`) — статичная подпись «Сэмпл»: там
     `.s(…)` выбирает сам сэмпл, а не инструмент.
  5. **Инструмент слоя меняется.** Выбор в микшере точечно переписывает
     `.s("…")` ТОЛЬКО этого слоя (`injectLayerSound` → `replaceScore` →
     `evalScore`). Остальные слои и остальной текст партитуры не
     трогаются.
  6. **Новые ноты пиано-ролла играют выбранным инструментом.**
     `noteSnippet` пишет `note("c4").s("piano")`, а инструмент берётся
     из общего сигнала `instrument` (`pianoRecStore`) — одна «концепция
     инструмента» на всё приложение, а не своя в каждом экране.
  7. **Один каталог инструментов.** `MELODIC_INSTRUMENTS` в
     `domain/sounds.ts` — единственный источник правды; `SoundSelect`
     не собирает свой список. Каталог содержит только реально
     существующие звуки (12 мелодических, без шумов), а тест следит за
     паритетом с `PIANO_INSTRUMENTS`.
  8. **`.s(…)` ищется посимвольно.** Регулярка нашла бы `.s(` внутри
     строкового литерала или комментария. Сканер `findSoundCall`
     пропускает строки и оба вида комментариев; побеждает ПОСЛЕДНИЙ
     вызов в цепочке — как и в Strudel.
  9. **Перечисление слоёв — одно на всех.** `listLayerSpans` —
     единственный источник границ слоёв; на нём работают микшер,
     `injectMix` и правка звука. Разные перечисления разъезжаются:
     микшер показывает 4 строки, а правка звука меняет слой 5.
  10. **«Мелодия» смонтирована.** `MelodyGrid` живёт в листе
      `kind="melody"` и открывается карточкой «Мелодия» в листе
      инструментов и из палитры ⌘K.
  11. **«Руки» достижимы.** Лист `kind="gesture"` открывается
      карточкой «Руки» в листе инструментов — раньше он был спрятан в
      глубине вкладки «Свист».
  12. **Тихие no-op стали тостами.** Пустой буфер записи и слот
      «в курсор» без доступа к редактору объясняют, что делать, вместо
      того чтобы выглядеть сломанной кнопкой.
  13. **Слои не схлопываются.** Запись в пресет (`cat(...)`) добавляет
      НОВУЮ СЕКЦИЮ, а не оборачивает пресет во внешний `stack(...)`.
      Шаг-сетка добавляет четыре ряда как ЧЕТЫРЕ отдельных слоя
      (`appendLayersToScore`), чтобы фейдер на бочке двигал только
      бочку.
  14. **Первая секция микшера раскрыта сразу.** Пока все секции были
      свёрнуты, человек открывал микшер и не видел ни одного слоя — а
      значит, и выбрать инструмент не мог.

