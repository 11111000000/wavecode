counterexample: |
  "Ядро 3.7 — это просто версия бинаря; decision-файлы живут по
  схеме 3.3, и трогать 118 файлов вообще не нужно: гейт можно
  просто выключить."

  Возражение: гейт нельзя выключить, потому что он ловит реальный
  класс дефектов, который в дереве уже накоплен. 102 решения с
  устаревшим `body_sha` — это ровно те места, где тело правили, а
  дайджест пересчитывать забыли: ядро обязано резать такое
  содержимое (severity: block), иначе дайджест — декорация. Точно
  так же 175 мёртвых копий ключей: контент, который никогда не
  доходит до гейта, — это не «мусор», а тихая ложь о том, что
  зафиксировано. Обновление инструментария здесь не косметика: оно
  превращает невидимое расхождение между файлом и его
  фиксацией в видимое, а потом — в исправленное.

  Контр-довод против «просто обновить номер»: строка `schema:` —
  это идентификатор ФОРМАТА, а не версия инструмента. 3.7-ядро
  по-прежнему принимает только `3.0-alpha`/`3.2`/`3.3`
  (`lib/schema_embedded.ml`), upstream в дереве 3.7.4 пишет
  `math-coding/3.3`, и `mathc new-decision` скеффолдит то же.
  Бамп `schema:` на `3.7` — это не обновление, а рассинхрон с
  форматом: ядро такое значение примет (enum в YAML-форме не
  проверяется), но файл перестанет соответствовать
  `schemas/decision.json` и policy-решению.

antithesis: |
  "Не трогать 118 решений: сначала довести до ума покрытие
  attestations (51 unknown на 119 решениях), и только потом заниматься форматом."

  Отклонено, потому что это подмена: покрытие attestations —
  отдельная, большая работа (нужно реально выполнить
  verifier'ы и выпустить attestations, а локальный `ui/node_modules`
  сейчас неполон), а устаревшие дайджесты ломают гейт СЕЙЧАС и
  независимо от покрытия. Порядок «сначала формат, потом
  покрытие» дешёв: он чинит то, что уже красное, и не требует ни
  одного запуска тестов. Покрытие остаётся открытым долгом и
  зафиксировано как unknown — честно, без притворства.

assumptions:
