intent: |
  Ядро math-coding ушло на 3.7.4 (edge release), а wavecode-гейт на
  старом ядре был красным: 102 решения из 118 отвергались как
  MC-SHA-DIGEST-STALE (устаревший `body_sha` после правок тела),
  плюс 175 MC-DUPLICATE-KEY и 92 MC-UNPARSED-TAIL от дефекта
  генератора миграции v1.0. Это решение переводит wavecode на
  3.7-инструментарий и возвращает гейт в зелёный статус.

  ФОРМАТ decision-файла при этом НЕ меняется: семейство схемы
  остаётся `math-coding/3.3`, потому что 3.7-ядро принимает только
  `3.0-alpha`, `3.2` и `3.3` — upstream в собственном дереве 3.7.4
  пишет `math-coding/3.3` (118 решений) и `math-coding/3.2` (127),
  а `mathc new-decision` скеффолдит то же самое. Бампится версия
  ядра, а не строка `schema:`.

axiom_link:
  - A0
  - A1
  - A3

commitment: |
  1. Инструментарий — math-coding 3.7.x (`mathc` из edge release;
     версия читается из `../math-coding/VERSION` через
     `mathc version` в checkout'е math-coding). Строка `schema:` в
     `decisions/*.yaml` остаётся `math-coding/3.3`.
  2. `mathc validate decisions/*.yaml` даёт parse-ok по всем файлам
     (zero rejects) — это же проверяет CI-шаг гейта.
  3. `body_sha`/`yaml_sha` каждого решения соответствуют его телу:
     `mathc rehash --dry-run` не находит ни одного изменённого
     файла. Правка тела решения без `mathc rehash --write` режет
     гейт — это обязательный шаг, а не опция.
  4. В дереве нет MC-UNPARSED-TAIL (хвостовой `---` во втором
     маркере документа) и MC-DUPLICATE-KEY (мёртвые вторые копии
     ключей: ядро читает первое вхождение, второе не доходит до
     гейта).
  5. `schemas/` совпадает со схемами ядра 3.7.4: `decision.json`
     содержит `negative_control`, `attestation.json` — требование
     class-tagged `identity` (`human:` / `agent:` / `ci:`).
  6. `mathc self-check` не возвращает `fail` (только pass/unknown).
     Unknown — это долг по покрытию attestations, отдельная работа,
     не дефект инструментария.
  7. Механика миграции зафиксирована в идемпотентном скрипте
     `scripts/migrate-math-coding-3.7.py`, а породивший артефакт
     генератор v1.0-пакетов (`scripts/migrate-v1-packets.py`)
     починен и больше не пишет дубли ключей и хвостовой маркер.

