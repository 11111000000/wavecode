      доступны `mathc rehash`, `mathc doctor`, `mathc verify`,
      `mathc attest-batch`, `mathc decision-state`.
  - id: schema-family-stays-3-3
    statement: |
      Ни один файл в `decisions/` не меняет строку `schema:` на
      `math-coding/3.7`: семейство схемы определяет ФОРМАТ файла, а
      3.7-ядро принимает только `3.0-alpha`/`3.2`/`3.3`.
  - id: validate-parse-ok-everywhere
    statement: |
      `mathc validate decisions/*.yaml` возвращает parse-ok по всем
      119 файлам; MC-* reject — ни одного.
  - id: digests-current
    statement: |
      `mathc rehash --dry-run` сообщает 0 изменённых файлов:
      `body_sha`/`yaml_sha` каждого решения соответствует его телу.
  - id: no-dead-blocks
    statement: |
      Ни одно решение не содержит хвостовой `---` и не содержит
      дублирующихся ключей в одной области видимости: 175
      MC-DUPLICATE-KEY и 92 MC-UNPARSED-TAIL ушли в ноль.
  - id: schemas-synced-3-7-4
    statement: |
      `schemas/*.json` побайтово совпадает со схемами math-coding
      3.7.4 (`decision.json` + `negative_control`, `attestation.json`
      + class-tagged `identity`).
  - id: self-check-without-fail
    statement: |
      `mathc self-check` даёт verdict pass или unknown и ни одного
      MC-SHA-DIGEST-STALE (было: verdict fail, 102 решения).
  - id: ci-gate-fixed
    statement: |
      CI-шаг гейта принимает verdict `parse-ok` (ядро 3.7 переименовало
      `accept` → `parse-ok`) и отдельно проверяет свежесть дайджестов.

