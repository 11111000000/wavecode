    state: assumed
    statement: |
      "Семейство схемы decision-файла в 3.7.x остаётся `3.3`:
      3.7-ядро принимает `3.0-alpha`/`3.2`/`3.3`, upstream в
      дереве 3.7.4 использует `math-coding/3.3` (118 решений) и
      `math-coding/3.2` (127), а `mathc new-decision` скеффолдит
      `math-coding/3.3`."
    evidence: "math-coding lib/schema_embedded.ml:34-39; math-coding decisions/*.yaml; mathc new-decision"
    owner: agent
  - id: mc37-verifier-debt-matches-upstream
    state: assumed
    statement: |
      "Оставшиеся 217 MC-VERIFIER-SCHEME-UNKNOWN — это тот же класс
      долга, что upstream несёт в своём корпусе (35 из 251 его
      решений): идентификаторные метки (`vitest-run-*`,
      `pnpm-ui-*`, `playwright*`), реальную команду которых из
      строки не восстановить без угадывания. Префиксная
      «канонизация» превратила бы строку в ложь (например,
      `tests/vitest-run-recording-panel` — не путь), поэтому долг
      зафиксирован, а не замаскирован."
    evidence: "mathc validate decisions/*.yaml --format=json (wavecode); mathc validate decisions/*.yaml --format=json (math-coding)"
    owner: agent

