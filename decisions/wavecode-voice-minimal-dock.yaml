intent: |
  Голосовой ввод был размазан по ЧЕТЫРЁМ поверхностям, и три из них
  жили одновременно:

  1. `VoiceAIMiniFAB` — плавающая кнопка «Голос» (голос → ИИ).
  2. `WhistleMiniFAB` — вторая плавающая кнопка «Свист» (микрофон →
     ноты), ровно под первой.
  3. `RecordingPanel` — плавающая панель, у которой были СВОЯ шапка
     (иконка микрофона, заголовок «Голос», пилюля «⚠ ошибка») и
     СВОЯ красная кнопка ●REC — второй красный круг на экране,
     означающий ровно то же, что и кнопка рядом.
  4. `MicPanel` — bottom sheet «Mic», который делал работу свиста
     ЛУЧШЕ: там были выбор инструмента, выбор слота («в конец» /
     «под курсор»), живой piano-roll и превью. `WhistleBody` был
     урезанной копией без слота и без превью.

  И при этом голосовой ввод ощущался не «некрасивым», а «сломанным».
  Три бага были найдены разбором кода, и все три — про ложь
  интерфейса, а не про эстетику:

  - «→ В ИИ» был ENABLED всякий раз, когда в поле лежал текст, но
    оркестратор принимал отправку только из `review` / `sent`
    (`VoiceAISession.runRouteFromReview`). Нажатие во время записи
    делало РОВНО НИЧЕГО: ни ошибки, ни тоста, ни смены состояния.
    Кнопка выглядела живой и была мёртвой — худшее из возможных
    сочетаний.
  - Мини-FAB определял «браузер заблокировал микрофон» regex-ом по
    ТЕКСТУ ошибки (`/permission|NotAllowed|microphone.*block/i`),
    а все пользовательские сообщения в приложении — на русском.
    Regex не мог сработать никогда: бейдж «!», ради которого он и
    существовал, не мог появиться.
  - Микрофон оставался «занятым» ещё до минуты после остановки:
    `releaseMic` вызывался ПОСЛЕ `handle.stop()`, а тот ждёт весь
    round trip реле (16-32 с замерено). Устройство физически было
    свободно — занято было только учётное состояние.

  Решение: ОДНА плавающая кнопка и ОДИН док-бар. Никакой second
  way сделать то же самое, никаких анимаций-украшений, и ни одного
  места, где интерфейс говорит пользователю неправду.

commitment: |
  1. Во всём приложении ровно ОДНА плавающая кнопка голосового
     ввода (`.voice-mini-fab`). Путь «микрофон → ноты в score» —
     это bottom sheet «Mic»; отдельной кнопки «Свист» не
     существует, подсистема свиста удалена.
  2. Голосовой док — ровно ТРИ строки: строка статуса, композер
     (текстовое поле), одно действие. Ни шапки, ни собственной
     кнопки записи, ни кнопки «Очистить текст».
  3. Композер присутствует и редактируем в каждом активном
     состоянии FSM (наследует контракт
     `wavecode-voice-composer-ux`).
  4. Строка статуса говорит ровно одну фразу на состояние FSM.
  5. Нажатие «→ В ИИ» НИКОГДА не является молчаливым no-op: либо
     отправка уходит, либо запрос ставится в очередь и уходит при
     появлении транскрипта, либо кнопки нет.
  6. Вид отказа переносится как ДАННЫЕ (`VoiceAIError.kind`), а не
     как проза: бейдж «!» на кнопке может сработать.
  7. Микрофон освобождается в момент окончания ЗАПИСИ, а не когда
     распознаватель ответит.
  8. В голосовом кластере нет бесконечных pulse-анимаций.
     Мигающая точка REC — единственная, и она несёт смысл.

