outcomes:
  - id: wavecode-voice-minimal-dock-outcome-one-control
    statement: |
      В `#/app` плавает ровно одна кнопка голосового ввода; путь
      «микрофон → ноты» открывается через Mic-шит (таб «mic»
      нижней панели).
  - id: wavecode-voice-minimal-dock-outcome-three-row-dock
    statement: |
      Голосовой док имеет три строки — статус, композер, одно
      действие — и не содержит шапки, кнопки ●REC и кнопки
      «Очистить текст».
  - id: wavecode-voice-minimal-dock-outcome-send-is-never-a-no-op
    statement: |
      Нажатие «→ В ИИ» во время записи останавливает take и
      отправляет транскрипт, как только он появляется; кнопка не
      может быть нажата «в никуда».
  - id: wavecode-voice-minimal-dock-outcome-failure-is-data
    statement: |
      Отказ классифицируется на месте возникновения и доезжает до
      UI как `VoiceAIError.kind`; бейдж «!» заблокированного
      микрофона срабатывает.
  - id: wavecode-voice-minimal-dock-outcome-mic-freed-at-capture-close
    statement: |
      После остановки записи микрофон свободен немедленно, а не
      через 16-32 с ожидания ответа распознавателя.
  - id: wavecode-voice-minimal-dock-outcome-quiet-cluster
    statement: |
      В голосовом кластере нет бесконечных анимаций: цвет кнопки
      и строка статуса несут состояние, мигает только точка REC.

