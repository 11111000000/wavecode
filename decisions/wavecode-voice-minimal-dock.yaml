axiom_link:
  - A0
  - A3

counterexample: |
  Самое сильное возражение — к свисту.

  Свист был ОДНИМ ТАПОМ: нажал кнопку → свистишь → ноты появляются
  → «Применить». Mic-шит — это ЧЕТЫРЕ шага: открыть шит → START →
  свистишь → «Add to score». Для человека, который свистит по
  десять раз в день, это минус два тапа на каждый свист, и он
  теперь в приложении, которое «про то, чтобы быстро записать
  мелодию».

  Возражение в свою защиту: Mic-шит даёт то, чего свист-кнопка не
  давала вообще — выбор слота (вставить в конец или под курсор),
  живой piano-roll с превью и превью-прослушивание. Свист-кнопка
  вставляла ноты одним способом и без прослушивания. То есть мы
  не «отняли» у пользователя быстрый свист, мы заменили кнопку на
  шит, который умеет больше, — но за два лишних тапа.

  Второе возражение: кнопка «Очистить текст» была удалена, потому
  что textarea умеет select-all-delete. Для того, кто надиктовал
  фразу и хочет начать заново, это лишние два нажатия. Ответ: в
  голосовом доке осталось одно текстовое действие, и добавление
  второго рядом с ним делало ряд из двух кнопок, где одна — копия
  встроенного поведения textarea.

antithesis: |
  (1) «Один тап на свист важнее единой кнопки».
  Возражение: единая кнопка — это про ВОСПРИНИМАЕМОСТЬ, а не про
  скорость. Две плавающие кнопки микрофона означали, что перед
  пользователем стоит вопрос «какая из них моя?» — и он решался
  каждый раз, до того как что-то заработает. Свист как ОТДЕЛЬНАЯ
  кнопка оправдан только если он отдельный сценарий; он не
  отдельный, он подмножество Mic-шита.

  (2) «Убрать pulse-анимации — это ухудшение UX».
  Возражение: pulse на кнопке не сообщал НИЧЕГО, чего не сообщал бы
  её цвет и строка статуса. Мигающая точка REC — осталась, потому
  что она единственная несёт смысл «микрофон открыт прямо сейчас».
  Это ровно тот же аргумент, что в
  `wavecode-ui-minimal-pass-phase-2`, только применённый к
  голосу.

  (3) «Очередь отправки отправит не тот текст».
  Возражение: да, и это намеренно. Пользователь нажал «→ В ИИ»,
  когда в поле лежал interim; final-транскрипт приходит позже и
  он лучше. Очередь хранит ФЛАГ, а не текст, и отправляет то, что
  лежит в поле в момент появления транскрипта. Если пользователь
  правил текст вручную — правил он, и уйдёт его версия (dirty-флаг
  не даёт распознавателю её перезаписать).

  (4) «Нет кнопки «Очистить» — это шаг назад для тех, кто
  надиктовал лишнее».
  Возражение: выделить и удалить в textarea — два нажатия на
  клавиатуре, которые работают везде; кнопка была третьим текстовым
  действием в доке, где текст — единственная настоящая работа.

assumptions:
  - id: mic-sheet-covers-whistle-capability
    state: proven
    statement: |
      Mic-шит (`MicPanel.tsx` + `micStore`) реализует тот же
      микрофон → ноты путь, что и удалённая свист-подсистема: тот
      же `MicCapture`/YIN-детектор, тот же превью-буфер
      `micPreviewNotes`. Дополнительно у Mic-шита есть выбор
      слота и piano-roll, которых у свиста не было.
    owner: human:operator
  - id: relay-round-trip-stays-in-range
    state: assumed
    statement: |
      Round trip серверного whisper-реле остаётся в диапазоне
      16-32 с. Если он станет заметно быстрее, тексты дока («Распознаю…»)
      надо будет переписать — они написаны под текущую задержку.
    owner: human:operator

