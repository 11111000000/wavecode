    - the-send-queue-sends-the-final-transcript-where-the-user-wanted-the-interim
    - removing-the-clear-button-costs-a-keystroke-for-users-who-mishear-a-phrase
    - the-mic-sheet-becomes-the-only-mic-entry-and-the-tab-bar-crowds
    - the-dock-overlaps-the-transport-bar-again-if-the-fab-cluster-height-changes
  owner: human:operator

reversal:
  - signal: users-who-whistle-report-that-the-mic-sheet-is-slower-than-the-old-button
    action: rework
    note: |
      Тогда вернуть ОДИН тап: кнопка микрофона в Mic-шите, которая
      стартует запись сразу, без открытия шита.
  - signal: the-send-queue-is-reported-as-sending-the-wrong-text
    action: rework
  - signal: the-dock-overlaps-the-transport-bar-on-a-short-viewport
    action: halt

