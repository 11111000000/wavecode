  - id: layer-rules-hold
    claim: |
      `grep -rE 'from .solid-js' ui/src/infrastructure/stt`
      возвращает пусто (после ревизии). Presentation изменения
      только в `RecordingPanel.tsx` и `VoiceFAB.tsx`;
      `application/` и `domain/` НЕ тронуты, FSM-тег `review`
      и связанные события сохранены в `voiceSession.ts`.
    acceptance:
      all:
