outcomes:
  - id: watchdog-on-silent-primary
    statement: |
      `FallbackSTT.test.ts`: первичный движок (`Stream.async` без
      `emit`) запускается без чанков и без ошибки в течение
      `WATCHDOG_MS = 2.5 с`, потом `Stream.timeoutFail` срабатывает,
      `catchAll` стартует вторичный движок и его чанки текут в
      поток. Вторичный движок, бросивший жёсткую ошибку в
      `start()`, отдаёт наружу ошибку первичного (как было).
      `permission-denied` и `aborted` от первичного по-прежнему
      НЕ ретраятся — это явное решение волны 1.
  - id: interim-chunks-during-recording
    statement: |
      `ServerWhisperSTT.test.ts`: в течение `TICK_MS = 2.5 с`
      непрерывной речи срабатывает тик, `fetch` вызывается
      один раз с накопленным клипом, потребитель видит
      `interim`-чанк. Второй тик при незавершённом первом
      запросе НЕ создаёт второй POST — гард `inFlight` ловит
      это. Тик без речи (`sawSpeech` остаётся `false`) НЕ
      вызывает fetch — пустой клип ушёл бы на сервер и whisper
      галлюцинировал бы ("Редактор субтитров Н.Закомолдина").
      `MockMediaRecorder.start(timeslice)` теперь фолс-эмиттит
      `dataavailable` каждые `timeslice` мс, чтобы у теста был
      материал для `parts`.
  - id: server-roundtrip-is-physical-not-a-bug
    statement: |
      Документация в `ServerWhisperSTT.ts` и здесь фиксирует:
      `SECONDARY_SILENT_MS = 12 с` (один server round-trip 5-9 с
      + буфер). Если кто-то позже "пожалуется" на это число — он
      должен либо поднять хост до 8+ vCPU и убрать
      `asyncio.Semaphore(1)`, либо переписать клиент
      под streaming multipart, либо раскошелиться на
      Web-Whisper-WASM. Никакой "починки на стороне клиента"
      не существует; ссылка на эту YAML — единственный
      указатель.
  - id: live-text-replaces-check-modal
    statement: |
      `RecordingPanel.test.tsx`: кнопка «Проверить»
      (`.voice-recording-panel__btn--primary`,
      `.voice-recording-panel__actions`) отсутствует в DOM в
      любом состоянии FSM, включая `paused`. `VoiceAITextReview.tsx`
      и `VoiceAITextReview.test.tsx` удалены. Импорт из
      `VoiceFAB.tsx` убран. FSM-тег `review` и события
      (`enter-review`, `edit-review`, `send-review`,
      `cancel-review`) в редукторе сохранены. **Этот outcome
      отменён в части «нет UI-аффорданса для review»
      ревизией `wavecode-voice-confirm-before-send@1`** —
      inline-форма (textarea + кнопка «→ В ИИ») внутри
      `RecordingPanel` НЕ является модалкой и НЕ
      восстанавливает удалённый `VoiceAITextReview`;
      см. `wavecode-voice-confirm-before-send@1` для
      текущего контракта. Тест `RecordingPanel.test.tsx >
      does NOT show the review affordance in paused either
      (live transcript made it redundant)` остаётся
      авторитативным для состояний, отличных от `review`
      — affordance в `paused` по-прежнему отсутствует
      (миграция review-формы ещё не подключена к
      ручной-кнопке паузы).
  - id: auto-commit-still-works
    statement: |
      `RecordingPanel.test.tsx`: путь auto-commit
      (chunk → `commit` → `requesting` → `request-sent` →
      `applying`) не тронут. `prefers the transcript over the
      counter once text arrives` тест проходит; в
      `listening` с interim-транскриптом пользователь
      видит текст, не счётчик.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc --noEmit +
      vitest + lint:no-console + validate:presets) завершается
      exit 0; все обновлённые тесты (`FallbackSTT`,
      `ServerWhisperSTT`, `RecordingPanel`) проходят. `tsc`
      strict; ни одного `any` не добавлено.

