intent:|
  Текущий CSS разделен на 5 файлов + landing + index-orchestrator
  (`ui/src/styles/{tokens,base,components,sheets,icons,legacy,landing}.css`
  = 5507 строк), но `components.css` (2141) и `legacy.css` (1364)
  содержат ~14 пересекающихся классов — две эпохи дизайн-системы
  в одном проекте. Сейчас cascade решает конфликт «побеждает
  последний импорт», то есть `legacy.css` (импортируется позже
  `components.css`) перебивает новые стили для:

  - `.piano-key`        — components.css: новый layout на CSS vars;
  legacy: старый flex-overlay. Компонент
  PianoKeyboard.tsx использует новый.
  - `.step-grid`, `.step-grid-toolbar`, `.step-grid-rows`,
  `.step-grid-row`, `.step-grid-row-label`, `.step-grid-row-sample`,
  `.step-grid-row-name`, `.step-grid-btn`, `.step-grid-hint`
  — components.css: refined typography,
  min-height 36px, line-height; legacy:
  старые 48px, grid 64px.

  Регрессия: для `.piano-key` и `.step-grid*` сейчас применяются
  СТАРЫЕ стили (последний импорт выигрывает), хотя новые классы
  в DOM используют новый дизайн. Это работает только потому что
  cascade-order «правильно совпал» с ожиданиями; любой reorder
  в index.css сломает визуал.

  Решение: ввести **cascade layers** через `@layer` в `index.css`.
  Декларация порядка слоёв один раз → cascade становится
  декларативным, не зависит от import-order:

  ```css
  @layer tokens, base, legacy, components, sheets, icons, landing;

  @import './styles/tokens.css' layer(tokens);
  @import './styles/base.css' layer(base);
  @import './styles/components.css' layer(components);
  @import './styles/sheets.css' layer(sheets);
  @import './styles/icons.css' layer(icons);
  @import './styles/legacy.css' layer(legacy);
  @import './styles/landing.css' layer(landing);
  ```

  С этим порядком: tokens < base < legacy < **components** <
  sheets < icons < landing. Компоненты выигрывают у legacy,
  что и нужно; foundation (tokens, base) — самый низкий приоритет;
  landing (page-specific) — самый высокий.

  Бонус: на следующем refactor можно снести `legacy.css` построчно,
  удаляя определения по мере того как они переезжают в
  `components.css`. Сейчас — 0 удалений, только структурирование
  cascade.

  Audit (legacy-only classes, 120 штук):
  .ai-controls-row1, .ai-edit-panel-inner, .ai-footer, .ai-message*,
  .ai-panel, .ai-retry-btn, .ai-status*, .app-body, .app-controls-row,
  .app-header*, .app-preset-row, .app-subtitle, .app-title,
  .bpm-indicator, .bpm-suffix, .caret, .cm-host, .collapse-toggle,
  .collapsible, .cps-control*, .cps-preset-btn, .cps-presets,
  .cps-readout, .ctrl-btn*, .midi-io-bar*, .mixer-btn*, .mixer-panel,
  .mobile-menu*  [удалено в Phase 1, dead code в legacy.css]
  .piano-keys*, .playhead*, .preset-select, .record-btn,
  .record-modal*, .save-preset-bar*, .score-panel-inner, .score-pane,
  .score-empty-state, .swing-*, .step-sheet-body, .transport-panel*,
  …

  Audit (components-only, новые, ~140 штук): .wc-* family +
  .step-cell, .score-debug, .piano-keys, .piano-keys-inner,
  .ai-message-content, .mixer-channel, .ai-textarea, .ai-message-role,
  и т.д.

  Audit (overlap, 14 классов):
  .ai-apply-btn (legacy has real def; components only in touch-target
  list) → legacy applies (no conflict).
  .ai-panel     (legacy has main; components only in selectors) →
  legacy applies.
  .app-body     (legacy has main; components has data-layout variants
  on same selector) → cascade: data-layout selector is
  more specific (higher), so components wins when
  attribute matches. No regression.
  .ctrl-btn     (legacy has main; components only in touch-target list)
  → legacy applies.
  .mini-toolbar / .mini-toolbar-btn → legacy applies (components only
  in touch-target list).
  .piano-key    (BOTH have real defs) → after @layer: components wins.
  CHANGE FROM TODAY. Проверка: PianoKeyboard.tsx
  использует именно новый layout (CSS vars).
  .score-panel  (legacy has main; components has data-layout variants)
  → components wins when attribute matches. No regression.
  .step-grid*   (BOTH have real defs, 9 классов) → after @layer:
  components wins. CHANGE FROM TODAY. Проверка:
  StepGrid.tsx использует новый (min-height 36px).
  .transport-controls → legacy applies.
  .wc-sheet-backdrop → only in comments, no actual definition conflict.

  Net effect: 11 конфликтов разрешаются в пользу legacy (no-op),
  3 конфликта переключаются на components (правильное направление).
  0 регрессий ожидается; 2 fix-from-today для piano-key и step-grid.
commitment: |
  Один коммит (`feat(ui): CSS cascade layers`):
counterexample: |
  The strongest objection to this decision is captured in the `antithesis` field above: (1) «@layer — лишнее усложнение, достаточно перенести legacy.css
antithesis: |
  (1) «@layer — лишнее усложнение, достаточно перенести legacy.css
  в конец components.css и удалить дубли вручную». Возражение:
  ручное удаление 14 дублей = 14 точки ошибки, 14 review. @layer —
  одна декларация, cascade сам решает. Если позже удалим
  legacy.css полностью, @layer убирается одной строкой.
  (2) «Tokens и base не нужно класть в @layer — они foundation,
  всегда выигрывают по определению». Возражение: без @layer они
  unlayered, что в cascade-rules даёт им ВЫСШИЙ приоритет, не
  низший. Если foundation неожиданно перекрывает компоненты —
  визуальные баги. С @layer(tokens) они явно «ниже».
  (3) «Landing.css не нужно в layer — он page-specific, и так
  побеждает». Возражение: да, побеждает и сейчас (последний
  import). Но если в landing.css случайно окажется класс,
  пересекающийся с components — без явного @layer(landing)
  это будет silent override. Лучше explicit.
  (4) «Cascade layers не поддерживаются старыми браузерами».
  Возражение: @layer — baseline since 2022 (Firefox 97, Chrome 99,
  Safari 15.4). Wavecode уже требует modern target (ESM, top-level
  await, AudioWorklet). Compatibility OK.
