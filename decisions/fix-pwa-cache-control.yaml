assumptions:
  - Vite content-hash в имени файла остаётся source of truth для cache-busting.
  - Caddy `header` директива в mkBackend корректно мерджится с file_server defaults.
  - angara-1 не имеет отдельного proxy перед Caddy, который мог бы сбрасывать Cache-Control.

