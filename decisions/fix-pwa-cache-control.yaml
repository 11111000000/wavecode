outcomes:
  - id: fix-pwa-cache-control-vendor-whitelist
    statement: |
      `vite-plugin-pwa` runtimeCaching в `ui/vite.config.ts`
      применяет CacheFirst только к (strudel|vendor-solid|codemirror|effect)-*.js,
      не к main bundle index-*.js.
  - id: fix-pwa-cache-control-caddy-headers
    statement: |
      Caddy vhost для `wavecode.kosov.online` отдаёт
      `Cache-Control: no-cache, must-revalidate` для index.html и
      sw.js, и `public, max-age=31536000, immutable` для /assets/*.

