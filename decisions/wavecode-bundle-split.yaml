outcomes:
  - id: wavecode-bundle-split-outcome-main-chunk
    statement: |
      Главный чанк `index-*.js` < 300 КБ gzipped (замерено ~96 КБ).
  - id: wavecode-bundle-split-outcome-strudel-lazy
    statement: |
      Strudel-чанк (~660 КБ raw / ~215 КБ gz) грузится динамически —
      только при первом `▶` (ensureRepl). Главный чанк не содержит
      кода Strudel-runtime.
  - id: wavecode-bundle-split-outcome-codemirror-lazy
    statement: |
      CodeMirror-чанк (~386 КБ raw / ~125 КБ gz) грузится динамически —
      только при первом открытии Score tab. CodeMirrorEditor уже
      использует `lazy()` через Suspense (см. wavecode-codemirror-6).
  - id: wavecode-bundle-split-outcome-visualizer-lazy
    statement: |
      VisualizerPanel (~16 КБ raw / ~6 КБ gz) грузится динамически —
      только при первом открытии вкладки «Визуализация». BottomSheets
      оборачивает рендер в `<Suspense>` с loading-fallback.
  - id: wavecode-bundle-split-outcome-vendor-solid
    statement: |
      Solid.js runtime вынесен в `vendor-solid` chunk (~26 КБ raw /
      ~10 КБ gz), кешируется отдельно от main entry — уменьшает
      размер cold-start main chunk и улучшает cache-hit-rate между
      деплоями.
