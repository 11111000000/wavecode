intent: |
  Главный entry-чанк `index-*.js` wavecode SPA должен оставаться ниже
  300 КБ gzipped при холодном старте; тяжёлые рантаймы (Strudel ~660 КБ,
  CodeMirror 6 ~386 КБ, VisualizerPanel ~16 КБ) подгружаются лениво
  при первом обращении к фиче, а не блокируют initial paint.
commitment: |
  `vite.config.ts` настроен на manualChunks: vendor-solid (26 КБ raw /
  10 КБ gz), strudel (663 КБ raw / 215 КБ gz, lazy), codemirror
  (386 КБ raw / 125 КБ gz, lazy), effect (127 КБ raw / 41 КБ gz).
  VisualizerPanel подгружается через `lazy()` в `BottomSheets.tsx`,
  только когда юзер открывает вкладку «Визуализация». Главный чанк
  index-*.js весит ~308 КБ raw / ~96 КБ gz, что существенно ниже
  бюджета 300 КБ gzipped.
counterexample: |
  The strongest objection to this decision is captured in the `antithesis`
  field: ручной bundle split добавляет риск regression (chunk
  забыли подключить, dynamic import ломает Suspense, кеш-busting на
  Workbox перестаёт работать) при выигрыше ~25-50 КБ gz на холодном
  старте — на быстром 3G разница в LCP < 100ms. Service Worker
  (vite-plugin-pwa `CacheFirst` для `assets/*.js`) и так кеширует
  чанки после первого визита, так что повторный заход уже быстрый.
  Если у юзера медленный CPU (low-end Android) — TTI выигрывает
  больше, чем LCP, и bundle split начинает окупаться; на десктопе
  оба метрики в шумовом диапазоне.
antithesis: |
  Можно НЕ делать bundle split и оставить один общий чанк (~1.5 МБ
  raw). Аргументы «против»: (a) ручной chunking — источник регрессий
  (забыли import → 404 в проде, dynamic import ломает Suspense → белый
  экран, Workbox CacheFirst перестаёт работать корректно для динамики);
  (b) выигрыш на cold-start 25-50 КБ gz — на 3G это < 100ms LCP,
  ниже порога значимости; (c) Service Worker уже кеширует assets
  через CacheFirst, повторные визиты быстрые; (d) cold-start ~150 КБ
  gz JS вполне приемлем для live-coding SPA. Решение «НЕ делать» было
  бы правильным для типового маркетингового сайта или low-traffic
  проекта, где LCP не имеет значения. Wavecode — live-coding SPA с
  частым обновлением score, где TTI ощутимо влияет на DX, и плюс
  cold-start на мобиле — primary user surface.
axiom_link:
