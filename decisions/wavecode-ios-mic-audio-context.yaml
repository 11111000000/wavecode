outcomes:
  - id: mic-context-is-primed-inside-the-gesture
    statement: |
      `WhistleMiniFAB.test.tsx > WhistleMiniFAB — the mic context
      is primed inside the gesture` и
      `VoiceAIMiniFAB.test.tsx > VoiceAIMiniFAB — the mic context
      is primed inside the gesture`: стартующее нажатие вызывает
      `primeMicAudioContext()` ровно один раз, останавливающее —
      ни разу.
  - id: capture-runs-on-the-primed-context
    statement: |
      `MicCapture.test.ts > MicCapture > uses the context that was
      primed inside the user gesture`: захват строит граф на
      primed-контексте (`createMediaStreamSource` вызван на нём)
      и закрывает его на `stop()`.
  - id: dead-context-is-reported-not-ignored
    statement: |
      `MicCapture.test.ts > MicCapture > reports a context that
      never starts instead of listening to silence`: при
      `state === 'suspended'` и отказанном `resume()` приходит
      `onError` с текстом про «аудио-контекст», состояние
      становится `errored`, а трек микрофона останавливается.
  - id: meter-reports-whether-it-runs
    statement: |
      `ServerWhisperSTT` метра уровня отдаёт `alive()`; при
      мёртвой метре лог пишет предупреждение, а take закрывается
      вручную — тишина на сервер не уходит (тест «no speech → no
      tick upload» остаётся зелёным).
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0.

