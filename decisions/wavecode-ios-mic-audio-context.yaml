axiom_link:
  - A0
  - A3

intent: |
  На iPhone не работали ни запись голоса, ни свист. Разбор
  показал: микрофон на самом деле захватывал звук — сервер
  распознал шесть записей с iPhone (лог `stt-web`, 2026-11-02
  03:32–03:34, все POST → 200 с непустым транскриптом), — но
  локальный конвейер микрофона был глухим.

  Причина: `AudioContext` микрофонного пути создавался ПОСЛЕ
  `await getUserMedia(...)`. WebKit (iOS Safari и Chrome для
  iOS — это один и тот же движок) не стартует контекст,
  созданный вне пользовательского жеста, и `resume()` там
  отказано — транзиентная активация умирает вместе с задачей,
  в которой ждали разрешение микрофона. Suspended-контекст
  отдаёт анализатору нули: индикатор уровня стоит на нуле,
  свист не даёт ни одной ноты, ошибок нет нигде.

  Решение: микрофонный `AudioContext` создаётся и запускается
  синхронно внутри жеста, который открывает запись
  (`primeMicAudioContext()` из обработчика нажатия), а захват
  забирает именно этот контекст. Контекст, который так и не
  стартовал, больше не остаётся безгласным: захват сообщает
  об этом ошибкой и отпускает микрофон.

commitment: |
  (1) Микрофонный `AudioContext` создаётся и запускается
  синхронно внутри пользовательского жеста — до любого
  `await`; обработчики нажатия (мини-FAB голоса, мини-FAB
  свиста, ●REC на панели, тумблер микрофона) вызывают
  `primeMicAudioContext()` до старта сессии.
  (2) `MicCapture` берёт именно этот контекст; если контекст
  всё же не стартовал, захват завершается ошибкой с
  понятным текстом и ОТПУСКАЕТ микрофон (треки остановлены),
  а не продолжает «слушать» тишину.
  (3) Микрофонный контекст не делится с выходным
  (`window.__wavecodeAudioCtx`) — регрессия с сэмпл-банками,
  зафиксированная в `MicCapture.ts`, не возвращается.
  (4) Метра уровня серверного STT живёт на том же контексте и
  сообщает, живой ли он (`alive()`); take без живой метры
  закрывается вручную, а не «виснет» до 100-секундного
  потолка — и при этом НЕ грузит тишину на сервер (whisper
  на тишине выдумывает фразы).

counterexample: |
  «Запись голоса на iPhone работала — сервер получил и
  распознал шесть записей, значит микрофон жив, и чинить
  надо не микрофон, а показ текста в композере». Возражения:
  (a) лог сервера доказывает только транспорт (микрофон →
  кодек → POST → whisper); локальный конвейер — отдельный
  путь, и он на iOS не работал: без живого `AudioContext` у
  приложения нет ни уровня, ни нот, ни авто-фиксации take по
  тишине; (b) распознанный текст на iPhone всё равно доезжал
  только потому, что пользователь вручную нажимал «стоп» —
  авто-фиксации по тишине не было вообще; (c) «показ текста» —
  это отдельная гипотеза без улик: сервер отдал 200 с
  непустым текстом, а клиент его показывал (иначе жалоба
  была бы про пустое поле, а не про «не работает ни запись,
  ни свист»).

  «Создать `AudioContext` в обработчике `pointerdown`, а не
  `click` — так надёжнее». Возражения: (a) на iOS
  `pointerdown` не всегда доходит до обработчика (панель
  может перехватить), а `click` — это финальная точка
  пользовательского жеста, которую браузер гарантирует; (b)
  разница между `pointerdown` и `click` в одном task'е
  отсутствует — активация переживает оба; (c) дополнительная
  точка отказа без выигрыша.

  «Раз контекст всё равно придётся создавать в жесте — проще
  отказаться от отдельного контекста и считать уровень на
  выходном». Возражения: (a) выходной контекст создаётся в
  своём жесте (кнопка Play) — до него микрофон работать не
  будет, а пользователь может начать с микрофона; (b)
  общий контекст — это ровно тот шаринг, который раньше
  ломал сэмпл-банки (см. `MicCapture.ts`); (c) микрофонный
  контекст никогда не подключается к `destination`, поэтому
  он не может за feedback'нуть в колонки.

antithesis: |
  (1) «Стоит просто перенести создание контекста внутрь
  `getUserMedia`-обработчика и не трогать UI». Возражения:
  обработчик промпта разрешения не является пользовательским
  жестом — транзиентная активация к этому моменту уже
  мертва; это и есть исходная ошибка.

  (2) «Надо ещё и `AudioContext` из выходного пути прибить
  к жесту — тогда и воспроизведение не сломается». Возражения:
  выходной контекст уже создаётся в жесте (`unlockAudioContext`
  вызывается синхронно из обработчика Play) — проблема была
  только в микрофонном пути.

  (3) «Простое решение — считать уровень через
  `MediaRecorder`/декодирование, без `AudioContext` вообще».
  Возражения: декодирование на main thread на каждом тике —
  это работа, которую iOS-браузер и так ограничивает, и оно
  не решает главного (свист всё ещё нужен `AnalyserNode` для
  pitch-детекции).

