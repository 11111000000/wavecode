      36×36 play/stop button in its bottom-right corner; tapping it
      toggles preview audio for that preset without navigating to
      `/#/app`.
  - id: single-active-preview-invariants
    statement: |
      At most one preset preview is audible at any time; tapping a
      different card's play button stops the previously-playing
      preview before starting the new one.
  - id: open-in-editor-unchanged
