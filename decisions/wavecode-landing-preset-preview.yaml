intent: |
  Let landing-page visitors audition each built-in preset from
  SnippetShowcase without navigating into the editor — a single
  tap on a per-card play button evaluates a 1-cycle preview of the
  preset's score and stops any in-flight preview from a sibling
  card, so the marketing surface becomes self-explanatory without
  inflating page complexity or duplicating audio wiring.

commitment: |
  Add `previewPreset(id)` and `stopPreview()` to
  `ui/src/presentation/state/audioActions.ts`, render a 36×36
  Play/Stop affordance in the bottom-right of each `.l-preset`
  card via `ui/src/presentation/components/landing/sections/SnippetShowcase.tsx`,
  and ship the supporting `.l-preset__play` styles plus the mathc-3.3
  decision file. Behavior: tap-to-play invokes `LiveAudioEngine.eval`
  with a 1-cycle shim of the preset's score, tap again stops,
  tapping a second card while one is playing stops the first and
  starts the second; the existing card-wide open-in-editor click is
  preserved and the play button stops event propagation so it never
  triggers navigation.

