counterexample: |
  "Spec'ing a separate short score per preset is too brittle —
  presets drift and the preview stops representing the actual
  score the user will see in the editor." Counter: the preview
  reads `BUILTIN_PRESETS[<id>].score` (a single source of truth)
  and only truncates to the first `cat([...])` section; if a
  preset is restructured, the preview reflects the same source
  the editor loads. A separate score file would duplicate
  drift and break the promise that "what you hear is what you
  edit".

antithesis: |
  "Don't ship per-card previews. Keep the landing page
  click-to-open-only, push users into the editor where they
  hit ▶ to hear anything. Adding audio to the marketing
  surface inflates complexity, drags Strudel modules into the
  landing bundle, and makes the page noisier for users who
  only want to browse."

  Rejected because: (a) the Strudel bundle is already
  chunk-split via `manualChunks.strudel` (vite.config.ts:85)
  and the landing route is the SPA entry — Strudel is loaded
  on every route anyway. (b) Users who click a card, navigate
  to the editor, hit ▶, then decide the genre is wrong burn
  ~8 seconds of cycle on each discard. Per-card preview
  turns "is this the right vibe?" into a 1-tap audition. (c)
  The added wiring is ~80 lines + a single decision file; the
  Strudel runtime, `unlockAudioContext`, and `LiveAudioEngine.eval`
  already exist — we are only adding a new caller, not new
  audio infrastructure.

