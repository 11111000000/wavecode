          result: pass
  - id: piano-transcribe-lint
    claim: |
      `npm --dir ui run lint:no-console` exits 0 — no `console.*`
      in `src/domain` or `src/application`; presentation-layer
      `console.warn` calls in `pianoRecStore.applyTranscription`
      are tolerated (matches the existing `applyToScore` pattern).
    acceptance:
      all:
        - verifier: "eslint src/domain src/application"
          result: pass
  - id: piano-transcribe-presets-validation
    claim: |
      `npm --dir ui run validate:presets` exits 0 (existing 18
      presets unchanged; this commit does not touch presets).
    acceptance:
      all:
        - verifier: "node --experimental-strip-types ../scripts/validate-presets.ts"
          result: pass
  - id: piano-transcribe-build
    claim: |
      `npm --dir ui run build` exits 0 (vite + tsc). Bundle-size
      diff reported in the PR description (main chunk should grow
      by < 5 KB gzipped given the tiny pure-function payload).
    acceptance:
      all:
        - verifier: "vite build"
          result: pass

assumptions:
  - id: piano-transcribe-assumption-bpm-stable
    state: assumed
    statement: |
      "The user knows the BPM of what they recorded; if they don't,
       the default 120 BPM is close enough that 1/16 grid cells
       group plausibly. If not, they can override the BPM field
       and click `🎼 transcribe` again."
    owner: human:operator
  - id: piano-transcribe-assumption-one-cycle-fits
    state: assumed
    statement: |
      "Recorded phrases are short (≤ 16 columns at default quantize).
       A single `<>` wrapper handles this comfortably. Longer
       recordings fall back to `note('<a b c …>')` losing rhythm
       precision beyond 16 columns — documented as future-work in
       `decisions/wavecode-piano-transcribe.yaml` `relations.follows_up`."
    owner: human:operator
  - id: piano-transcribe-assumption-evalScore-sync
    state: assumed
    statement: |
      "`replaceScore` + `evalScore(score)` is the canonical 'set
       score and play now' pair (verified in `appStore.dispatch` +
       `audioActions.evalScore`); other call sites in the codebase
       follow the same pattern."
    evidence: "git grep 'replaceScore' ui/src/"
    owner: agent

risk:
  declared_triggers:
    - bpm-mismatch-causes-grid-jitter
    - chord-vs-arpeggio-confusion
    - multi-cycle-recording-truncation
    - instrument-name-not-resolved-by-strudel
  owner: human:operator

reversal:
  - signal: pianoTranscribe.test.ts-fails
    action: rework
  - signal: user-feedback-cat-vs-space-separator
    action: rework-format-with-flag
  - signal: preview-panel-truncates-long-scores
    action: rework-css-or-switch-to-modal

counterexample: |
  "Live coding is code-first; if a user can't write mini-notation,
   they're not the target audience. Adding a piano → score
   transcription reduces the bar to entry but at the expense of
   the live-coding ethos — once you can record, you might as well
   use a DAW, where the integration is more polished."

  Counter: the live-coding ethos doesn't require writing
  mini-notation by hand — it requires editing it. The transcribe
  output is a STRUDEL SCORE the user keeps editing live. They
  still get to mutate `<c4 e4 g4>` → `<c4 e4 g4 c5>` or add `.s()`
  chains. The piano is an INPUT DEVICE for code, not a replacement
  for the code itself.

antithesis: |
  "Keep only `↑ apply` (one-line-per-note commit); users can
  hand-craft mini-notation in the editor. Skip auto-transcription."

  Rejected because: (1) every other live-coding tool with a MIDI
  input has a similar "perform → score" bridge (see Vortex
  Tracker, Sonic Pi's `live_loop` recorder, Bitwig's MIDI-to-clip).
  (2) The CSS Components aesthetic of the piano toolbar
  (`🎼 transcribe` next to `↑ apply`) is a tiny, well-bounded UI
  addition. (3) The pure function is testable and reusable — a
  Tier 2 pianoroll could call `pianoTranscribe` to seed its
  timeline from a MIDI recording.

