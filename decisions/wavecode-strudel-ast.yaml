assumptions:
  - id: strudel-ast-assumption-mini-syntax-stable
    state: assumed
    statement: |
      "Strudel mini-notation syntax in BUILTIN_PRESETS does not
       contain constructs the tokenizer cannot tokenize (e.g. JS
       template-string interpolation `${...}` inside backtick
       strings used as Strudel arguments)."
    evidence: "manual review of all 18 presets + scan for `${`"
    owner: human:operator
  - id: strudel-ast-assumption-five-ms-budget
    state: assumed
    statement: |
      "5 ms is a generous budget for a single preset on M1; the
       AST will be called from the MixerPanel reactive memo, which
       re-parses only when score identity changes (Solid's
       createMemo does not re-run on a different memo's input)."
    owner: human:operator
  - id: strudel-ast-assumption-layer-shape-stable
    state: proven
    statement: |
      "LayerDescriptor shape (index/source/name) is the public
       contract of parseStack.ts; MixerPanel + editGridLayer
       import these types from the same module."
    evidence: "git blame ui/src/domain/layers/parseStack.ts"
    owner: human:operator

risk:
  declared_triggers:
    - regression-in-mixer-row-order
    - regression-in-edit-mode-precondition
