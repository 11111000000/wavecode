  owner: human:operator

reversal:
  - signal: parseStack.test.ts-or-editGridLayer-regression
    action: revert
  - signal: ast-perf-budget-exceeds-five-ms
    action: rework

counterexample: |
  "The regex-based parseStack.ts has been working for months;
   every preset parses correctly today; the AST is over-engineering
   for a problem that does not exist." Counterexample: the regex
   parser mis-counts layers for any score where a `//` comment
   contains the substring `s("…")`, or where a string argument
   literally contains `s("drums_bd")` as data (e.g. an
   auto-generated code-completion preview). The AST skips
   comments at the token level and treats string contents as
   opaque, so this class of bug cannot occur. StepGrid's
   edit-mode precondition (exactly 4 sample rows) becomes
   structurally enforced rather than textually guessed.

antithesis: |
  "Keep the regex parser; layer-count and name detection are
   accurate enough for the demo presets; an AST is unjustified
   complexity for a single-domain helper."

   Rejected because: the AST unblocks AI-edit (rewrite a single
   `s("…")` row with semantic guarantees, not text replacements),
   StepGrid (locate the 4 sample rows by structure rather than
   by counting `s(`-tokens), and Tier 2 pianoroll (parse a
   `note("…")` body into a sequence of pitches/durations). All
   three features are blocked without an AST; the regex parser
   is the bottleneck, not the surface. The implementation cost
   is one tokenizer + one parser + one walker (~300 LOC + ~150
   LOC of tests), all domain-pure with no runtime dependencies,
   and the existing 11 parseStack.test.ts cases serve as a
   backward-compat oracle so the migration is verified against
   the prior behaviour on every commit.

