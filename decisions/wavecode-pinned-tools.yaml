  - id: wavecode-pinned-tools-guard-targets
    claim: |
      The zen guard reports the phase-1 targets met and no regression
      against the recorded baseline: no dangling token reference, no
      hardcoded colour outside the token file, at most one infinite
      animation, and no growth of the sheet-surface count — the pin
      control lives inside the existing tools sheet, it does not add a
      surface.
    acceptance:
      all:
        - verifier: "node scripts/check-zen-ui.mjs --targets"
          result: pass
  - id: wavecode-pinned-tools-quality-gate
    claim: |
      The repository quality gate is green: typecheck, unit tests,
      console lint and preset validation.
    acceptance:
      all:
        - verifier: "cd ui && npm run test:precommit"
          result: pass
  - id: wavecode-pinned-tools-store-unit
    claim: |
      The pinned-tools store holds the contract of the rail: three base
      items first, at most three pinned, tier-1 and non-pinnable tools
      refused, the choice persisted to localStorage, and a corrupted
      store ignored instead of crashing the rail.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/state/pinnedTools.test.ts"
          result: pass
  - id: wavecode-pinned-tools-sheet-unit
    claim: |
      The tools sheet shows only tier-2 cards by default, finds base
      tools on search, moves a tool into the rail when its pin is
      pressed, and explains every blocked pin.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/components/app/ToolsSheet.test.tsx"
          result: pass
  - id: wavecode-pinned-tools-reachability-e2e
    claim: |
      The e2e suite pins the new information architecture: exactly one
      «Инструменты» button in the whole interface, a tools sheet with no
      rail duplicates, a pin that moves a tool into the rail and survives
      a page reload, and a «Ещё» button on the mobile viewport too.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/tool-reachability.spec.ts"
          result: pass
  - id: wavecode-pinned-tools-kernel-validates
    claim: |
      The decision file is structurally valid under the math-coding 3.3
      schema.
    acceptance:
      all:
        - verifier: "mathc validate"
          result: pass
negative_control: |
  The checks have teeth in every direction the change could go wrong.
  If a second «Инструменты» button reappeared (the top-bar grid icon),
  `toHaveCount(1)` on `[aria-label="Инструменты"]` fails, and the
  assertion that `.wc-topbar [aria-label="Инструменты"]` is absent
  fails too. If the sheet started listing rail items again, the
  component test's exact-array assertion on the card labels fails. If
  pinning stopped persisting, the e2e check after `page.reload()` —
  which expects the pinned tool to still be in the rail — fails. If the
  pin limit were raised, the store test's `MAX_PINNED_TOOLS === 3` and
  the «четвёртая булавка блокируется лимитом» case fail. If the blocked
  pin became a real `disabled` attribute instead of `aria-disabled`,
  the assertion `hasAttribute('disabled') === false` fails — and with
  it the promise that the reason stays reachable from the keyboard.
counterexample: |
  The strongest objection is that the rail stops being a fixed contract.
  Today every user sees the same three items in the same order, which
  makes the interface learnable, makes screenshots and guides
  reproducible, and makes "where do I open the mixer?" a question with
  one answer. Personalised pinning breaks that: two people using the
  same build get different rails, a muscle memory formed yesterday may
  be wrong today, and a tool that moved out of the rail looks like it
  disappeared. The objection is accepted as a real cost. It is
  bounded by four rules: the base three never move and never leave, the
  pinned block is at most three items, it always sits after the base
  ones, and the sheet — where everything remains reachable — never
  loses a card because of it. Pinning therefore cannot remove a tool
  from the interface; it can only move a shortcut into the thumb zone.
  The alternative of a fixed rail with no pinning was rejected because
  it does not answer the owner's second complaint at all: frequently
  used tools would stay two clicks away, and the only answer to that
  is to let the user decide.
antithesis: |
  The coherent alternative was to leave the rail exactly as it is and
  solve everything through the command palette — every tool reachable
  in two keystrokes, no personalisation, no new state, nothing to
  persist. It was rejected because it answers a different complaint
  than the owner's: the palette is fast for the person who already
  knows the tool's name, and useless for the person who wants the
  mixer "right there". A second alternative was rejected as well — a
  settings screen with a checklist of tools, which would put the same
  decision one more layer away, behind a route, a scroll and a save
  button. The owner's words were «нажать какую-то галочку на каждом
  инструменте»: the checkbox belongs on the tool itself, where the
  decision is made.
assumptions:
  - id: wavecode-pinned-tools-assumption-three-slots
    state: assumed
    statement: |
      Three pinned slots is what the mobile rail can hold without
      truncating labels: the row is 60 px tall, and seven slots of
      ~54 px still fit with readable captions («Нотная», «Пианино»).
    owner: human:operator
    consequence_if_false: |
      If the rail turns out to fit only two pinned items on the
      narrowest supported phone, `MAX_PINNED_TOOLS` drops to two and the
      store test is updated with it. If it fits more, the limit is a
      product decision, not a layout one, and needs the owner's call.
  - id: wavecode-pinned-tools-assumption-local-storage
    state: assumed
    statement: |
      `localStorage` is available and durable for the preference. It is
      a preference, not data: losing it costs one re-pinning round,
      and it is never synchronised between devices.
    owner: human:operator
    consequence_if_false: |
      If a browser blocks storage in private mode, the store already
      falls back to an empty rail instead of crashing; the cost is that
      pinning does not survive the reload in that browser.
risk:
  declared_triggers:
    - duplicated-entry-return
    - rail-overflow-on-mobile
    - lost-pinning-after-update
    - pin-without-reason
  owner: human:operator
reversal:
  - signal: |
      Users report that a tool "disappeared from the rail" — that is,
      they cannot find a pinned tool they expected to stay.
    action: rework
  - signal: |
      The mobile rail starts truncating labels or the pinned block
      pushes the base items off screen.
    action: review
  - signal: |
      A second «Инструменты» entry reappears anywhere in the interface.
    action: rework
relations:
  implements:
    - wavecode-zen-ui-implementation@2
  refines:
    - wavecode-unified-input-entry@1
    - wavecode-zen-minimal-ui@2
