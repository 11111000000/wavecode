outcomes:
  - id: wavecode-pinned-tools-outcome-one-entry
    statement: |
      В интерфейсе ровно одна кнопка «Инструменты», и она живёт в рельсе
      — на десктопе и на мобиле. В верхней панели кнопки листа больше
      нет. Один вход — одна поверхность.
  - id: wavecode-pinned-tools-outcome-no-duplication
    statement: |
      Лист «Инструменты» не показывает то, что уже в рельсе: в покое в
      нём шесть карточек второго уровня и ни одной из трёх базовых. Если
      пользователь ищет базовый инструмент, он находится — но с
      заблокированной булавкой и пометкой «уже в рельсе».
  - id: wavecode-pinned-tools-outcome-pin
    statement: |
      Часто используемый инструмент можно поднять в рельс одной галочкой
      на его карточке. Рельс остаётся читаемым: базовые три пункта плюс
      не больше трёх закреплённых. Выбор сохраняется между запусками.
  - id: wavecode-pinned-tools-outcome-honest-lock
    statement: |
      Заблокированная булавка всегда объясняет, почему она заблокирована,
      и всегда называет инструмент, к которому относится. Причина —
      в доступном имени, а не в молчании.
