---
schema: math-coding/3.3
id: wavecode-pinned-tools
revision: 1
state: active
body_sha: "sha256:887df968e89b6f7503886b45a0bc783941c908778f73596220958931d310b73a"
yaml_sha: "sha256:887df968e89b6f7503886b45a0bc783941c908778f73596220958931d310b73a"

intent: |
  Владелец (2026-11-16) посмотрел на интерфейс после волны правок и
  сказал три вещи:

    * «как будто бы у нас есть какое-то дублирование»;
    * «вот вкладка, которая открывает непонятно как что»;
    * «с другой стороны много чего не хватает … все инструменты уехали
      куда-то в отдельную кнопочку наверху, а которые не влезли вниз»;
    * и конкретное требование: «должна быть возможность нажать какую-то
      галочку на каждом инструменте, чтобы он появился в меню внизу,
      если человек часто пользуется».

  Замеры на живом проде (2026-11-16, бот Chromium, production-бандл
  `index-B80rwCcv.js`) подтвердили каждое слово:

    * **Две кнопки на один лист.** `[aria-label="Инструменты"]` встречалась
      дважды: кнопка «Ещё» в рельсе и голая иконка-сетка в верхней панели.
      Обе открывали один и тот же лист `.wc-tools-sheet`. Верхняя была
      без подписи — это и есть «кнопка, которая открывает непонятно что».
    * **Лист повторял рельс.** В листе было 9 карточек: Нотная, Шаги, ИИ,
      Ввод, Пианино, Микшер, Визуализация, Экспорт, Консоль. Первые три —
      ровно те же, что стоят в рельсе, при этом подпись листа обещала
      «всё, что не в рельсе». Обещание было ложью, и ложь была видна
      безо всяких замеров.
    * **На мобиле входа внизу не было вовсе.** `.wc-rail__more` имел
      `display: none` на ширине ≤ 1023 px — на телефоне лист открывался
      только из верхней панели, то есть через ту самую голую иконку.

  То есть претензия сводится к трём вещам, и все три лечатся одной
  перестройкой:

    1. один вход в лист вместо двух, и он — рядом с инструментами, а
       не в шапке;
    2. лист без повторов рельса;
    3. способ поднять часто используемое в рельс — по требованию
       владельца, руками пользователя, а не подбором автора.

  Это решение фиксирует перестройку информационной архитектуры рельса
  и листа «Инструменты».

commitment: |
  1. **Вход в лист один.** Кнопка «Ещё» в рельсе (`.wc-rail__more`,
     `aria-label="Инструменты"`) — единственный способ открыть лист
     «Инструменты». Иконка-сетка в верхней панели удалена: два входа в
     один лист читались как «непонятно что», а голая иконка без подписи
     тем более.
  2. **«Ещё» есть на всех экранах.** На мобиле кнопка больше не
     скрывается (`display: none` → `flex: 0 0 auto; width: 60px`): вход
     в инструменты стоит там же, где сами инструменты.
  3. **Лист не повторяет рельс.** В покое лист показывает только tier 2
     (6 карточек: Ввод, Пианино, Микшер, Визуализация, Экспорт,
     Консоль). Базовые пункты рельса (Нотная, Шаги, ИИ) в листе не
     повторяются, и подпись листа «что закрепить в рельсе» теперь
     правдива.
  4. **Поиск в листе находит всё, включая базовые.** Закрепление не
     должно ломать достижимость: на «нотная» лист отвечает карточкой
     «Нотная» с заблокированной булавкой, а не «Ничего не найдено».
  5. **Галочка на карточке закрепляет инструмент в рельсе.** Булавка
     `.wc-tool-card__pin` (`aria-pressed`) добавляет инструмент в рельс;
     та же булавка его снимает. Закреплённый инструмент остаётся в
     листе — снять его можно только там.
  6. **Рельс = базовые три + до трёх закреплённых.** `MAX_PINNED_TOOLS =
     3`. Порядок: сначала базовые, потом закреплённые в порядке
     закрепления. Основание для лимита: мобильный ряд — 60 px, семь
     слотов по ~54 px с подписями («Нотная», «Пианино») ещё влезают,
     восемь — уже нет.
  7. **«Ввод» не закрепляется.** У него есть постоянная круглая кнопка,
     а вторая точка входа в тот же лист вернула бы ровно то дублирование,
     которое здесь убирается. Карточка «Ввод» в листе остаётся — иначе
     поиск по «микрофон» или «свист» отвечал бы «Ничего не найдено»;
     её булавка заблокирована.
  8. **Заблокированная булавка объясняет причину.** Не `disabled`, а
     `aria-disabled="true"` + `title` с причиной: «уже в рельсе»,
     «Открывается круглой кнопкой „Ввод“ — в рельсе незачем» или
     «закрепить можно не больше 3». Молчащая галочка — это не
     «почему нельзя», а «сломанный интерфейс».
  9. **Доступное имя булавки всегда содержит имя инструмента.** В любом
     состоянии: «Закрепить „Микшер“ в рельсе», «Убрать „Микшер“ из
     рельса», «„Микшер“ — уже в рельсе». Иначе в листе с девятью
     карточками четыре заблокированные булавки звучали бы одинаково.
  10. **Выбор переживает перезагрузку.** `localStorage`, версионированный
      ключ `wavecode-pinned-tools-v1` (как `wavecode-mobile-sheet-h-v1`).
      Инструменты — не данные композиции, поэтому IndexedDB не нужен.
  11. **Хранилище не доверяют.** При чтении отбрасываются неизвестные id,
      повторы, базовые инструменты и незакрепляемые («Ввод»). Иначе
      «Нотная» могла бы появиться в рельсе дважды — то самое дублирование,
      ради которого решение и принималось.
  12. **Реестр — источник правды.** Возможность закрепить инструмент
      описана в `toolRegistry.ts` (`pinnable`, `pinNote`), а не
      вычисляется в UI по тиру: причина принадлежит инструменту.

