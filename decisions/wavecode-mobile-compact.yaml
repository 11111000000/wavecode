assumptions:
  - id: wavecode-mobile-compact-assumption-1
    state: proven
    statement: |
      "На 412×900 mobile, sheet 'half' (50vh = 450px), cm-host = 900−56−60−96−22−450 = 216px → 14 строк @ 11px × 1.4" Evidence: "Расчёт по геометрии: header(56) + preset(44) + controls(52) + score-debug(22) + sheet(450) + tabbar(60) = 684px. 900−684 = 216px для cm-host. 216/15.4 = 14 строк."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-2
    state: proven
    statement: |
      "На sheet 'full' (70vh = 630px) cm-host = 900−56−60−96−22−630 = 36px → 2 строки @ 11px" Evidence: "Та же геометрия с 70vh sheet. 900−858 = 42px... 36px после score-debug. ≈2 строки."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-3
    state: proven
    statement: |
      "WCAG 2.1 SC 1.4.4: 200% resize без потери content/functionality. 10px × 2 = 20px ≥ 14px AA body minimum" Evidence: "W3C WCAG 2.1.4.4 — текст можно увеличить до 200% без потерь. AA body minimum = 14px (1.4× base 10px). PASS."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-4
    state: proven
    statement: |
      "iOS HIG iPhone: minimum tap target 44×44 pt. Selects — native UIElement 240×240 picker" Evidence: "Apple HIG: 'A comfortable minimum target size for tappable elements is 44x44 pt.' Но: <select> на iOS открывает UIPickerView 320×216 — tap на самом select открывает picker, не требует 44×44 самого элемента."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-5
    state: proven
    statement: |
      "Sheet snap heights на mobile были 35/50/70vh (peek/half/full), default --sheet-h = 50vh" Evidence: "ui/src/styles/sheets.css (master): peek=35vh, half=50vh, full=70vh, default sheet-h=50vh."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-6
    state: proven
    statement: |
      "ScorePanel уже имеет auto-resize: focus в editor → если sheet='full' → snapTo('half')" Evidence: "ui/src/presentation/components/app/BottomSheets.tsx:xx (mobile-split-pane polish-2) — focus handler checks desktop, hasOpenSheet, snap='full', then snapTo('half'). 2026-10-13 merge."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-7
    state: proven
    statement: |
      "Mobile split-pane layout: .app-body flex column, score-panel flex:1, sheet flex:0 0 var(--sheet-h)" Evidence: "ui/src/styles/sheets.css:181-209 — .app-body @media mobile → display:flex, flex-direction:column, min-height:0, overflow:hidden. .wc-sheet → flex:0 0 auto, height:var(--sheet-h, 50vh)."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-8
    state: proven
    statement: |
      "MiniNotationToolbar = 14 buttons × 36px min-height × 2 rows = ~88-110px. Скрыт по default на mobile (localStorage 'wavecode-mini-toolbar-v1')" Evidence: "ui/src/presentation/panels/ScorePanel.tsx (after wavecode-toast-overhead-and-toolbar-toggle) — miniToolbarOpen signal default false on mobile, toggle via snippet-toggle chip."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-9
    state: proven
    statement: |
      "Code editor font conventions: VS Code 12px, Atom 12px, iA Writer 13px, GitHub mobile 12px. ВСЕ ≥ 10px." Evidence: "VS Code default: editor.fontSize=14, но mobile/web 12. Atom default font 12. iA Writer 13. GitHub mobile code blocks 12-13. Минимум — 10-11 (Brackets default 11)."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-10
    state: proven
    statement: |
      "На mobile cm-content font-size после wavecode-toast-overhead-and-toolbar-toggle = var(--fs-xs) = 11px" Evidence: "ui/src/styles/components.css:3576-3580 — @media (max-width:720px) .cm-content { font-size: var(--fs-xs); line-height: 1.4 }."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-11
    state: proven
    statement: |
      "ScorePanel focus auto-resize НЕ срабатывает если sheet в 'half' (только при 'full'). Это означает: чтобы вернуть editor visibility при 'full', юзер тапает в editor." Evidence: "BottomSheets focus handler: checks sheet snap, if 'full' → snapTo('half'). Mobile polish-2 commit 6084c24."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-12
    state: proven
    statement: |
      "С 10px × 1.3 line-height: 1 line = 13px. 14 строк @ 11px = 215px. 18 строк @ 10px = 234px. Минимальный 178px (min-height:200 - score-debug 22) = 13.6 строк." Evidence: "Arithmetic: 13.6 × 13 = 176.8 ≈ 178px. Гарантия 'хотя бы часть' с большим запасом."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-13
    state: proven
    statement: |
      "Вертикальная экономия после wavecode-mobile-compact на 900vh viewport: 96→76 fixed-rows (−20) + sheet-h 50→40vh (−90) + cm-content line-height 1.4→1.3 (+rows) = 110+px" Evidence: "Арифметика: (44+52)−(32+44)=20, 50vh−40vh=10vh=90px (на 900vh). 11px×1.4=15.4px → 10px×1.3=13px. 215/13=16.5 строк против 215/15.4=14 строк. Экономия ~110px + 18% строк."
    owner: human:operator
  - id: wavecode-mobile-compact-assumption-14
    state: proven
    statement: |
      "Предыдущий пакет wavecode-toast-overhead-and-toolbar-toggle уже свёл з-индекс toast к 80 — выше modal(60) и fixed-rows(52/53). Не нужно трогать в этом пакете." Evidence: "ui/src/styles/tokens.css:170 (после wavecode-toast-overhead): --z-toast: 80."
    owner: human:operator
