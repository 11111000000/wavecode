    acceptance:
      all:
        - verifier: vitest-run-disclaimer-gate
          result: pass
  - id: persistence-and-version-reprompt
    statement: |
      `DisclaimerGate.test.tsx > persists the accepted version and
      hides on remount`, `> re-prompts when a stale version is
      stored`.
    acceptance:
      all:
        - verifier: vitest-run-disclaimer-gate
          result: pass
  - id: acceptance-is-fail-visible
    statement: |
      `DisclaimerGate.test.tsx > stays up when the acceptance cannot
      be written (fail-visible)` и `consentGate.test.ts > stays
      pending when the write throws`.
    acceptance:
      all:
        - verifier: vitest-run-disclaimer-gate
          result: pass
  - id: terms-remain-reachable-after-acceptance
    statement: |
      `DisclaimerGate.test.tsx > re-opens read-only from the footer
      event after acceptance`: после принятия гейт открывается
      событием `wavecode:open-terms` с `data-mode="read-only"`, без
      кнопки «Принять» и чекбокса, с кнопкой закрытия.
    acceptance:
      all:
        - verifier: vitest-run-disclaimer-gate
          result: pass
  - id: tour-is-gated-behind-consent
    statement: |
      `WelcomeTour.test.tsx > renders nothing while the legal consent
      gate is up`: при `blocked` оверлея нет, при `blocked={false}`
      тур стартует.
    acceptance:
      all:
        - verifier: vitest-run-welcome-tour
          result: pass
  - id: app-root-inert-wiring
    statement: |
      `App.tsx` содержит `<div class="app-root" inert={gate.visible()
      ? true : undefined}>` и `<WelcomeTour blocked={gate.pending()}
      />`; `base.css` объявляет `.app-root { display: contents }`;
      `tokens.css` объявляет `--z-consent-gate: 90`.
    acceptance:
      all:
        - verifier: text-scan-gate-wiring
          result: pass
  - id: e2e-config-seeds-acceptance
    statement: |
      Все три playwright-конфига задают `storageState` из
      `tests/e2e/support/consent.ts`, а
      `preset-id-hydration.spec.mjs` после `localStorage.clear()`
      восстанавливает `wavecodeTermsAccepted` перед `reload()`.
    acceptance:
      all:
        - verifier: text-scan-playwright-consent-seed
          result: pass
  - id: legal-wording-identical-to-rev-1
    statement: |
      `git diff` текста разделов 1–4, лида и сноски между
      `wavecode-disclaimer-banner` rev 1 и этим решением пуст по
      содержимому (совпадает только разметка); `DISCLAIMER_VERSION`
      равен `v1` в обоих.
    acceptance:
      all:
        - verifier: text-diff-legal-prose
          result: pass
  - id: wavecode-disclaimer-gate-kernel-validates
    statement: |
      `mathc validate decisions/wavecode-disclaimer-gate.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: "mathc validate"
          result: pass
  - id: superseded-decision-is-marked
    statement: |
      `decisions/wavecode-disclaimer-banner.yaml` имеет
      `state: superseded` и `relations.superseded_by:
      [wavecode-disclaimer-gate@1]`.
    acceptance:
      all:
        - verifier: text-scan-supersede-link
          result: pass
  - id: precommit-gate-green
    statement: |
      `cd ui && npm run typecheck && npm run lint:no-console &&
      npm run validate:presets` завершается exit 0; `npx vitest run`
      падает только на пред-существующих флейках
      (`micStore.test.ts > starts in idle phase`,
      `parser.test.ts > perf budget`), которые падают и на master.
    acceptance:
      all:
        - verifier: pnpm-ui-test-precommit
          result: pass

assumptions:
  - id: localstorage-available
    state: assumed
    statement: |
      `localStorage` доступен в браузере. В приватном режиме запись
      бросает исключение — согласие тогда не фиксируется и гейт
      покажется снова; это осознанный fail-visible (тихое согласие
      хуже его отсутствия).
    owner: human:operator
  - id: no-backend
    state: proven
    statement: |
      У wavecode нет бэкенда и аккаунтов, поэтому серверная фиксация
      согласия невозможна, а `localStorage` — единственный носитель.
      Следствие для доказывания: артефакт согласия существует только
      на стороне пользователя и может быть удалён им же — гейт
      фиксирует факт акцепта, а не защищает его от уничтожения.
    owner: human:operator

