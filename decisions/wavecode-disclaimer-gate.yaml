outcomes:
  - id: gate-is-fullscreen-and-modal
    statement: |
      Оверлей занимает весь вьюпорт (`inset: 0`, `--z-consent-gate` =
      90), панель несёт `role="dialog"` и `aria-modal="true"`; тосты
      (80) и оверлей тура (70) не могут перекрыть запрос согласия.
  - id: gate-is-expanded-from-first-frame
    statement: |
      Текст условий присутствует в DOM сразу при первом рендере,
      без нажатия «Подробнее»; кнопка `disclaimer-expand` не
      существует ни в одном состоянии.
  - id: app-is-inert-behind-the-gate
    statement: |
      Пока `gate.visible()`, все маршруты обёрнуты в
      `.app-root[inert]`; обёртка не добавляет бокса
      (`display: contents`), поэтому раскладка не меняется.
  - id: pending-gate-has-no-dismiss
    statement: |
      В состоянии `pending` отсутствует кнопка закрытия, Esc не
      закрывает, клик по подложке и по панели не закрывает.
  - id: consent-is-versioned-and-persisted
    statement: |
      «Принять» пишет `DISCLAIMER_VERSION` в
      `localStorage['wavecodeTermsAccepted']`; после перезагрузки гейт
      не показывается; любая другая строка (в т.ч. `v0`) вызывает
      повторный показ.
  - id: acceptance-is-fail-visible
    statement: |
      Если запись в `localStorage` бросает исключение, гейт
      остаётся поднятым, а в хранилище пусто — согласие не может
      быть «принято молча».
  - id: tour-does-not-start-under-the-gate
    statement: |
      Пока согласие не получено, `WelcomeTour` не рендерит ни
      оверлея, ни подсказки; после принятия тур стартует с первого
      шага.
  - id: terms-remain-reachable-after-acceptance
    statement: |
      Ссылка «Условия использования» в футере landing открывает тот
      же оверлей в read-only режиме: текст развёрнут, кнопок
      «Принять» и чекбокса нет, вместо них «×» (и Esc).
  - id: legal-wording-unchanged
    statement: |
      Формулировки всех четырёх разделов, лида и сноски про
      Apache-2.0 побайтово совпадают с текстом, действовавшим при
      `wavecode-disclaimer-banner` rev 1; `DISCLAIMER_VERSION`
      остаётся `v1`, поэтому ранее принявшие не переспрашиваются.

