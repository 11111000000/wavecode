axiom_link:
  - A0
  - A3

intent: |
  Смена формы оговорки с «мягкого» неблокирующего баннера на
  блокирующий гейт согласия.

  `wavecode-disclaimer-banner` (rev 1) заменил модальное окно на
  маленькую панель в левом нижнем углу — 420px, без backdrop, без
  scroll-lock, текст за кнопкой «Подробнее». Решение обосновывало
  это тем, что «правовая оговорка должна быть видимой, но не должна
  мешать». На практике форма не выполнила собственной цели:

    (а) панель занимает ~3% площади экрана и тонет в интерфейсе —
        замечено пользователем: «маленький дисклеймер внизу», «не
        нужно разворачивать этот дисклаймер, он должен сразу быть
        развёрнутый»;
    (б) кнопка «Принять» была на два клика глубже текста, то есть
        согласие требовало намеренного действия, которого не
        происходит;
    (в) одновременно с баннером поднимался 5-шаговый onboarding-тур
        с затемнением — два блокирующих слоя на старте, и ни один не
        сообщал, что это шлюз к приложению;
    (г) сам `wavecode-disclaimer-banner` в разделе `counterexample`
        признавал: неблокирующий баннер, висящий месяцами без
        раскрытия, НЕ является надёжным акцептом оферты. Решение
        закрыло это возражение «усилением доказательственной
        стороны», но не устранило сам факт непрочтения.

  Нужна форма, в которой условия нельзя не прочитать: полноэкранное
  перекрытие, текст развёрнут с первого кадра, единственный выход —
  галочка и «Принять». Согласие по-прежнему персистится версией в
  `localStorage`, поэтому повторного показа для принявшего нет.

commitment: |
  (1) `DisclaimerGate` — полноэкранный оверлей: `position: fixed;
      inset: 0`, слой `--z-consent-gate` = 90. Это выше тостов
      (`--z-toast` = 80) и выше оверлея onboarding-тура
      (`calc(--z-modal + 10)` = 70): ничто не может всплыть поверх
      запроса согласия. Токен добавлен в `styles/tokens.css`,
      чтобы «90» не было магическим числом в CSS.
  (2) Панель `.disclaimer-gate__panel`: `max-height: 100%` внутри
      полноэкранного flex-родителя, единственная прокручиваемая
      часть — `.disclaimer-gate__body`. На 360x640 телефон заголовок,
      лид и кнопка «Принять» остаются на экране, длинный список
      разделов прокручивается внутри, а не выталкивает их.
  (3) Текст РАЗВЁРНУТ с первого кадра. Кнопки «Подробнее» /
      «Свернуть» нет вообще; `expanded`-сигнал и
      `.disclaimer-banner--expanded` удалены. Согласие нельзя
      получить, не прочитав текст хотя бы частично.
  (4) Пока гейт поднят, приложение под ним НЕ ИНТЕРАКТИВНО.
      `App.tsx` оборачивает все маршруты в `<div class="app-root"
      inert={gate.visible()}>`. Обёртка объявлена
      `display: contents`, поэтому не добавляет собственного бокса и
      не меняет раскладку маршрутов, — но `inert` это атрибут
      поддерева DOM, а не свойство бокса, поэтому он выводит всё
      приложение из порядка табуляции и с пути указателя. Заглушка
      (собственный scrim) перекрывает всё, что `inert` не покрывает.
  (5) У гейта в состоянии `pending` НЕТ выхода кроме согласия: нет
      кнопки закрытия, Esc не закрывает, клик по подложке не
      закрывает. В read-only режиме (переоткрытие из футера) «×» и
      Esc есть. Это инверсия старого `DisclaimerModal`, где окно
      можно было закрыть и уйти без согласия.
  (6) Согласие версионировано и персистентно — без изменений:
      `localStorage['wavecodeTermsAccepted']` хранит строку
      `DISCLAIMER_VERSION` (сейчас `v1`). Версия НЕ поднята этим
      решением: формулировки не менялись, а бамп re-prompt-нул бы
      всех, кто уже принял. Любая правка текста обязана идти
      вместе с бампом версии И с правкой шаблона в юридической базе
      (`ЮрОтдел`,
      `1_projects/05_wavecode/04_templates/01_site-disclaimer.md`).
  (7) Fail-visible сохранён: если запись в `localStorage` бросает
      исключение (приватный режим, отключённое хранилище), принятие
      НЕ фиксируется и гейт остаётся поднятым. Тихое «принято»
      хуже повторного показа.
  (8) Онбординг-тур не стартует под гейтом: `WelcomeTour` получил
      проп `blocked`, который `App.tsx` передаёт как
      `gate.pending()`, а `currentStep()` возвращает `null`, пока он
      true. Нельзя обучать работе с приложением, к которому ещё не
      пустили.
  (9) Семантика доступности: панель — `role="dialog"`,
      `aria-modal="true"`, `aria-labelledby` на заголовок,
      `aria-describedby` на лид, `tabIndex={-1}`; фокус переносится
      на панель при открытии, чтобы Tab не уходил в `inert`-поддерево.
  (10) Состояние вынесено в `presentation/state/consentGate.ts`
      (`useConsentGate()`) и передаётся в компонент пропом.
      Компонент НЕ читает `localStorage` и НЕ знает о маршрутах —
      поэтому он структурно не может быть «только на `#/app`», как
      был `DisclaimerModal`.
  (11) e2e-конфиги (`playwright.config.ts`,
      `playwright.debug.config.ts`, `playwright.deployed.config.ts`)
      сеют `wavecodeTermsAccepted` через `storageState`
      (`tests/e2e/support/consent.ts`), иначе каждый спек
      наталкивался бы на гейт вместо приложения.
      `preset-id-hydration.spec.mjs` делает `localStorage.clear()` и
      `reload()` — то есть storageState там уже не помогает; спек
      поэтому сохраняет и восстанавливает ключ согласия сразу после
      очистки. Обходной путь точечный и помечен комментарием: общий
      `addInitScript`-фикстур на 21 спек не тянем.

counterexample: |
  Сильнейшее возражение против этого решения: блокирующий гейт на
  каждом новом устройстве (новый браузер, другой компьютер, после
  очистки данных сайта) — это ровно тот UX-регресс, ради которого
  modal из 47acac7 и был заменён на баннер. Пользователь, который
  закрыл вкладку на середине работы над композицией, теряет доступ к
  приложению до повторного согласия.

  Ответ, и он здесь честный: этот риск реален, но цена выбора
  асимметрична. Прежний вариант предлагал пользователю доступ к
  приложению без единого зафиксированного согласия — то есть
  оставлял его в ситуации, где доказать акцепт оферты нечем, и при
  споре о правах на композицию (а это предмет раздела 3 «Ваши
  материалы») у правообладателя не было бы ни одного артефакта.
  Мягкий баннер не «устранил регресс», а спрятал юридический риск
  ценой удобства.

  Второе возражение: «нельзя блокировать инструмент, которым
  пользуются в потоке». Ответ: блокировка действует ОДИН раз на
  версию формулировки, а не на каждый вход. `DisclaimerModal`
  показывался на каждом входе, потому что не сохранял согласие —
  это и было настоящей проблемой того решения, а не блокировка как
  таковая. Здесь принятие записывается версией, поэтому второй
  заход не блокируется никогда.

  Третье возражение: скринридер или клавиатурный пользователь
  оказывается в модалке без явного «выхода». Ответ: выход есть и он
  единственный — чекбокс и «Принять»; Esc намеренно не работает в
  `pending`, потому что иначе гейт перестаёт быть гейтом. Чтобы
  текст нельзя было пропустить, но и нельзя было застрять без
  выхода, панель получает фокус и `aria-modal`, а чекбокс — первый
  интерактивный элемент внутри неё.

antithesis: |
  Альтернатива (1): вернуть баннер, но раскрытым по умолчанию и
  по центру экрана. Отклонена: панель без backdrop и без `inert`
  остаётся dismiss-нулём — клик мимо неё, Esc или перезагрузка
  уводят пользователя, и согласие снова можно не дать, просто
  закрыв вкладку. Размер не лечит отсутствие барьера.

  Альтернатива (2): отдельная страница `/terms` и редирект на неё
  до первого входа в редактор. Отклонена по причине, названной ещё
  в `wavecode-disclaimer-banner`: роутера такого маршрута нет
  (`useHashRoute` = landing | app | admin), Caddy отдаёт `index.html`
  на любой путь, и страница без бэкенда — это ещё один экран SPA с
  собственным состоянием и своей точкой отказа. Гейт решает ту же
  задачу в одном компоненте; страница остаётся естественным
  расширением, когда появится аккаунт или оплата.

  Альтернатива (3): не спрашивать вовсе, оставить текст в футере.
  Отклонена: это ровно тот вариант, который реализован сейчас и
  который даёт нулевую доказательственную ценность. Фактически
  это и есть текущий baseline до изменения, только без баннера.

  Альтернатива (4): спросить при первом нажатии «play», а не на
  старте. Отклонена: действие пользователя уже началось (он решил
  играть), прерывать его хуже, чем преградить вход; и вопрос,
  возникающий после того, как человек что-то сделал, читается как
  задним числом навязанный.

