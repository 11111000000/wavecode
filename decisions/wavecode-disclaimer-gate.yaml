  - id: gate-is-modal
    statement: |
      `DisclaimerGate.test.tsx > blocks the landing route until the
      terms are accepted`: панель имеет `role="dialog"` и
      `aria-modal="true"`.
    acceptance:
      all:
        - verifier: vitest-run-disclaimer-gate
          result: pass
  - id: gate-is-expanded-by-default
