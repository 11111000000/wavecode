axiom_link:
  - A0
  - A3

intent: |
  Второй голосовой take подряд должен приводить к тому же, что и
  первый: текст распознан — и его можно отправить. Жалоба (2026-10-24):
  «первую композицию создал, нажимаю на голос ещё раз, текст
  распознался, но кнопки отправки нет».

  Найдено две независимые дыры, и обе заканчиваются одним и тем же —
  «текст на экране, отправить нечем»:

  (1) `arm` был no-op из `transcribing`, `requesting`, `applying`.
      `requesting`/`applying` покрывают ВЕСЬ round-trip к LLM, потому
      что `runRoute` диспатчит `request-sent` ДО вызова LLM. Нажатие
      в этом окне проглатывалось целиком: микрофон не открывался,
      записи не было, распознавания не было, ошибки не было — панель
      просто продолжала показывать «применяю правку…».

  (2) Take, у которого ФИНАЛЬНЫЙ ответ релея пришёл пустым
      (`{"text": ""}` — whisper так отвечает на клип, который не может
      разобрать), но ИНТЕРИМ содержал текст, парковался в `paused` —
      состояние без review-формы. Текст был виден, отправить его было
      нечем.

commitment: |
  Нажатие и удержание голосовой кнопки начинает take из ЛЮБОГО
  состояния FSM, в котором микрофон не открыт, и любой take, в
  котором есть хоть какой-то распознанный текст, заканчивается в
  состоянии с кнопкой отправки.

counterexample: |
  «`applying` — это состояние, в котором система занята, нажатие
  игнорировать правильно». Возражения: игнорирование нажатия не
  сообщает пользователю ничего. Он держит кнопку, говорит, ждёт — и
  получает ноль: ни записи, ни текста, ни ошибки. Панель при этом
  показывает «применяю правку…», то есть actively врёт о причине.
  Правило «нажатие всегда начинает take» совместимо с занятостью:
  незавершённый маршрут доезжает своим ходом (см. antithesis).

  «Пустой финальный ответ — это не баг, это значит, что человек
  ничего не сказал». Возражения: человек говорил — иначе не было бы
  интерима. Релей ответил пустотой на конкретный клип, а не на
  «тишину пользователя». Текст, который пользователь произнёс,
  должен доезжать до отправки; interim — это доказательство, что он
  говорил.

  «Тест-дубль редуктора в `voiceAIStore` работает — зачем
  подменять её настоящим редуктором?». Возражения: он разошёлся с
  `voiceSessionReducer` в обе стороны: не учитывал interim-чанки, не
  имел ветки `arm` вне `idle`, не имел ветки `chunk` вне `listening`.
  Тест, который гоняет копию, не проверяет ничего про FSM, на
  котором работает приложение, — и обе дыры выше живут ровно в
  слепых зонах этой копии.

antithesis: |
  «Прервать незавершённый маршрут, когда пользователь начинает новый
  take». Возражения: маршрут несёт ПРЕДЫДУЩУЮ инструкцию
  пользователя и уже в проводе; убивать его — значит выбросить
  правку, которую пользователь уже попросил. Поэтому маршрут
  доезжает своим ходом: `onApplied` пишет score в редактор, а
  событие `applied` приходит в новое состояние `listening`, где у
  редуктора нет ветки и событие просто отбрасывается. Маршрут и
  новый take сосуществуют — именно это пользователь и выразил,
  нажав снова.

  «Вместо interim использовать последний распознанный текст из
  предыдущего take». Возражения: это подставило бы чужой текст в
  буфер отправки. Interim принадлежит тому же take — он и есть
  доказательство, что take был.

scope:
