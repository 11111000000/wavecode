    - "ui/dist/**"

outcomes:
  - id: arm-works-from-every-state
    statement: |
      `arm` из `idle`, `errored`, `paused`, `review`, `transcribing`,
      `requesting`, `applying` переводит FSM в `listening`. До фикса
      `transcribing`, `requesting` и `applying` были no-op — нажатие
      проглатывалось целиком: микрофон не открывался.
  - id: sent-buffer-is-not-carried-into-the-next-take
    statement: |
      `arm` из `requesting` / `applying` начинает take с ПУСТЫМ
      буфером: инструкция там уже в проводе, и перенос её в новый
      take применил бы её второй раз («сделай композицию сделай
      бас быстрее»). `arm` из `review` / `paused` / `transcribing`
      буфер СОХРАНЯЕТ — там текст ещё не отправлен, и это контракт
      take-continuation. Два хелпера: `rearmFrom` и `rearmFresh`.
  - id: any-text-is-sendable
    statement: |
      Take с любым распознанным текстом (final ИЛИ interim)
      заканчивается в `review`, а не в `paused`. `editedText`
      review-формы берётся из `final`, а при его отсутствии — из
      `interim`, поэтому форма открывается непустой и кнопка «→ В ИИ»
      активна.
  - id: parked-take-does-not-eat-a-late-chunk
    statement: |
      Финальный чанк, пришедший в состояние `paused`, больше не
      отбрасывается: он дописывается в расшифровку и переводит FSM в
      `transcribing` — то самое состояние, на которое смотрит
      auto-review подписчика.
  - id: no-second-reducer
    statement: |
      `__dispatchVoiceAIForTests` в `voiceAIStore` больше не содержит
      рукописной копии таблицы переходов: он вызывает
      `voiceSessionReducer`. Тест-дубль был источником расхождения с
      реальной FSM и слепой зоной для обеих дыр выше.

obligations:
  - id: arm-from-busy-states-is-tested
    claim: |
      `voiceSession.test.ts` проверяет, что `arm` из `transcribing`,
      `requesting` и `applying` даёт `listening` с сохранённой
      расшифровкой, и что при этом состояние `applying` теряет поле
      `score` (правка, которую применял ИИ, не выдаётся за результат
      нового take).
    acceptance:
      all:
        - verifier: vitest-run-voice-session
          result: pass
  - id: interim-only-take-is-sendable-is-tested
    claim: |
      `voiceSession.test.ts` и `RecordingPanel.test.tsx` проверяют, что
      take только с interim-текстом даёт `editedText` = текст interim
      и активную кнопку «→ В ИИ» в DOM.
    acceptance:
      all:
        - verifier: vitest-run-voice-session
          result: pass
        - verifier: vitest-run-recording-panel
          result: pass
  - id: press-during-llm-roundtrip-is-tested
    claim: |
      `VoiceAISession.test.ts` проверяет оба окна: подвешенный LLM
      (FSM в `applying` на весь round-trip) и подвешенный
      `audio.eval` — момент, когда композиция УЖЕ ЗВУЧИТ, а FSM
      ещё в `applying`. В обоих нажатие приводит FSM в `listening`,
      а слова нового take доезжают до review-формы.
  - id: sent-and-unsent-buffers-are-distinguished
    claim: |
      `voiceSession.test.ts` проверяет, что `arm` из `requesting` /
      `applying` даёт пустую расшифровку, а `arm` из `review` /
      `transcribing` сохраняет её.
    acceptance:
      all:
        - verifier: vitest-run-voice-ai-session
          result: pass
  - id: regressions-are-pinned
    claim: |
      Каждый новый тест падает на коде до фикса: `arm` из
      `applying` даёт `applying` вместо `listening`; interim-only
      take даёт `paused` вместо `review`; review-форма открывается с
      пустым буфером. Проверено откатом файлов.
    acceptance:
      all:
        - verifier: vitest-run-voice-session
          result: pass
        - verifier: vitest-run-voice-ai-session
          result: pass
        - verifier: vitest-run-recording-panel
          result: pass
  - id: gate-green
    claim: |
      `npm run test:precommit` (tsc --noEmit + vitest + eslint
      lint:no-console + validate:presets) завершается exit 0; 115
      test-файлов / 1873 теста зелёные.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
        - verifier: pnpm-ui-lint
          result: pass

