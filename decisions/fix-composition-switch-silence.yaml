intent: |
  Жалоба юзера: при выборе другой композиции из списка продолжает
  звучать ПРЕДЫДУЩАЯ; и при создании новой композиции во время Play
  тоже слышна прежняя. Требование: переключение = полная смена звука,
  предыдущая композиция не должна звучать вообще.

  Причина — не в списке пресетов и не в редакторе. `repl.stop()`
  останавливает только ПЛАНИРОВЩИК Strudel (`Cyclist.stop()` →
  `clock.stop()` → clearInterval + `lastEnd = 0`). WebAudio-ноды, которые
  superdough уже создал и передал в аудио-граф, продолжают звучать до
  конца своих огибающих: у `ambient-drone` это `.attack(2).release(4)`,
  то есть 4–6 секунд старой композиции поверх новой.

  Вторая, более неприятная половина: `AudioContext.suspend()`
  замораживает `currentTime`. Огибающие замерших голосов замирают на
  полпути и оживают при следующем `resume()` — то есть старая
  композиция возвращается уже во время Play новой. Именно это
  наблюдал юзер в сценарии «Новая композиция → Play»: новая партитура
  пустая, а звучит прежняя.

  Замер (headless Chromium, реальный движок superdough):
  - до фикса: после «Новая» в suspended-контексте оставалось 16
    живых голосов со stop-временами 6.78…10.28 с; после Play
    (resume) RMS анализатора = 0.0698–0.0853 — громкость прежней
    композиции;
  - после фикса: живых голосов 0, RMS = 0.005 (тишина новой
    пустой композиции).

  Решение — сделать тишину явной, а не побочным эффектом:
  (1) **Реестр живых голосов.** Осцилляторы и семплы регистрируются
  в патче `AudioContext.prototype.createOscillator` /
  `createBufferSource` (патч `createOscillator` в движке уже был —
  для debug-счётчика), worklet-голоса (`s("supersaw")`,
  `s("wavetable")` — у них нет `stop()`) — через патч глобального
  конструктора `window.AudioWorkletNode`.
  (2) **Master-gate** — GainNode между анализатором и destination
  (`source → analyser → gate → destination`). Одним `gain` глушится
  всё, что уже звучит: сначала тихий fade-out (anti-click), потом —
  жёсткая остановка нод.
  (3) **`silence()`** = планировщик остановлен → гейт закрыт fade-ом →
  живые голоса убиты (`stop()` + `disconnect()`). Контекст при этом
  НЕ замораживается: `suspend()` в eval-пути означал бы
  замороженные огибающие и iOS-проблему «resume() вне user-gesture
  отклоняется».
  (4) **`eval()`** (любая смена партитуры: выбор пресета, AI-правка,
  re-eval транспорта) начинается с `await silence()` и заканчивается
  открытием гейта — старый звук гарантированно мёртв к моменту, когда
  новый паттерн уже запланирован.
  (5) **`stop()`** (кнопка «Стоп») — сначала `silence()`, потом
  `suspend()`. Порядок load-bearing: состояние контекста — это
  состояние транспорта в UI (кнопка Play/Stop), поэтому контекст
  замораживать по-прежнему нужно, но только ПОСЛЕ того, как голоса
  убиты.

  App-слой менять не пришлось: `onLoadPreset` уже делает
  `replaceScore` + `evalScore`, а `evalScore` ведёт в `audio.eval`,
  где теперь стоит `silence()`.
commitment: |
  Один коммит + decision + e2e-регрессия. Поведение, которое меняется
  осознанно: при смене композиции теперь есть короткая (~25 мс +
  транспиляция) пауза между старым и новым звуком — раньше старый хвост
  накладывался на новый, теперь его нет. Кнопка «Стоп» по-прежнему
  замораживает AudioContext (это состояние транспорта в UI), но тишина
  теперь честная: голоса убиты до заморозки, поэтому ничего не
  «оживает» при следующем Play.

  Не меняется: hot-swap микшера (`setLayerMix`) и горячая замена
  партитуры в StepGrid (`setScore`) — они по-прежнему подменяют
  паттерн без остановки планировщика, без аудио-разрыва и без убийства
  голосов (это отдельный, осознанный трейд-офф).
counterexample: |
  Сильнейшее возражение к этому решению: «убивать ноды вручную —
  хрупко, superdough всё равно владеет жизненным циклом голосов; если
  он начнёт переиспользовать источники (буфер-пул), наш `stop()` убьёт
  ноду, которую superdough отдаст следующему хапу».
  Ответ: (1) реестр пополняется на КАЖДЫЙ вызов
  `createOscillator`/`createBufferSource`, то есть на каждый новый
  голос — переиспользования источника в superdough 1.3.0 нет
  (`AudioBufferSourceNode` одноразовый по спецификации); (2) если
  такое переиспользование появится, симптом будет «тишина после
  переключения», а не «старая музыка поверх новой» — регрессионный
  e2e это поймает.
antithesis: |
  (1) «Не трогать ноды — просто не suspend-ить контекст, тогда старые
  голоса доиграют естественно». Возражение: это чинит только
  «оживание» после suspend, но не хвост: 4–6 секунд ambient-drone
  поверх новой композиции — ровно то, что юзер и описал.
  (2) «Сделать отдельный AudioContext на каждую композицию —
  старый закрыть, новый создать». Возражение: superdough, загрузчик
  семплов и визуализатор привязаны к одному контексту; это рефакторинг
  размером с сам фикс и с риском для iOS-пути.
  (3) «Оставить один AudioContext, но глушить старый паттерн через
  `repl.setPattern(silence)` вместо kill нод». Возражение: планировщик
  перестаёт играть, но уже созданные ноды продолжают звучать — хвост
  остаётся, это и есть исходный баг.
  (4) «Просто чинить список пресетов». Возражение: список не виноват —
  выбор пресета корректно доезжает до `audio.eval`; виноват audio-слой.
