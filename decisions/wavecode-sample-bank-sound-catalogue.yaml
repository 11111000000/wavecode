intent: |
  Пользователь: «сейчас если свистишь, то дефолтный инструмент
  Piano — как сэмпл ничего не звучит; хотелось бы, чтобы можно было
  просто щёлкать ритм, и он реально сделает хай-хэт; проанализируй,
  какие сэмпы можно использовать; и хотелось бы выбирать инструменты
  кликнув прямо в коде, где инструмент, — увидеть всех реально
  доступных, либо выбрать в меню, удобно на мобильном».

  Три симптома, один корень.

  (1) «Ничего не звучит». `WhistleStore` коммитит
      `note("…").s("piano")`. Имя `piano` НЕ зарегистрировано в
      soundMap: банк пиано регистрирует `piano_a1…piano_c7`, а
      bank-alias (`piano → piano_a4`), который закрывал это имя,
      был демонтирован в `wavecode-sample-bank-underscore`.
      Незарегистрированное имя — не «тихий» слой: superdough
      бросает `sound piano not found! Is it loaded?` на триггере,
      и падает ВЕСЬ паттерн, а не только его слой.

  (2) «Пресеты звучат не на той высоте». Банки `piano` и `synth`
      описаны в формате «массив» (`piano_a4: ["A4.mp3"]`), а
      superdough в этой ветке считает сэмпл C2-корневым и
      транспонирует как `midi - 36`: `note("a4").s("piano_a4")` →
      +33 полутона (проверено на `superdough/util.mjs`, версия
      1.3.0). Ветка «объект, ключ — нота» выбирает БЛИЖАЙШУЮ
      доставленную ноту и транспонирует по разнице — это и есть
      правильная форма банка.

  (3) «Щёлкнуть ритм нельзя». Транзиенты (kick/snare/hat/click)
      микрофон ловит и классифицирует, но свист их ВЫБРАСЫВАЛ:
      в snippet шли только ноты. При этом 19.10 транзиенты были
      вырезаны из свиста намеренно — пользователь жаловался
      «при свисте вставляют в барабаны какие-то»: онсет САМОГО
      свиста тоже транзиент, и он попадал в барабан.

  Плюс запрос на интерфейс: список реально доступных инструментов
  и выбор — и в коде (клик по имени звука), и в меню (мобильный).

commitment: |
  (1) Банки `piano` и `synth` переводятся в note-keyed форму
      (`piano: {a1: [...], …}`, `synth_bass: {c1: [...], …}`) —
      superdough выбирает ближайшую ноту и транспонирует по
      разнице. Банк ударных остаётся массивом: удар не несёт
      ноты.

  (2) Пресеты переводятся на новые имена (`piano_a4` → `piano`,
      `synth_bass-c2` → `synth_bass`, `synth_lead-e4`/`g4` →
      `synth_lead`, `synth_pad-c3` → `synth_pad`).

  (3) Появляется каталог звуков `domain/sounds.ts` — единственный
      список имён, которые superdough РЕАЛЬНО знает: осцилляторы
      (`registerSynthSounds`: triangle/sawtooth/square/sine/
      supersaw/sbd/шум) плюс сэмплы трёх банков. Каталог
      проверяется тестом против soundMap библиотеки и против
      доставленных манифестов + mp3-файлов, поэтому «призрачных»
      имён в нём быть не может.

  (4) Свист коммитит и ноты, И транзиенты: снапшот строится
      через `micSnippetFromBuffers` — ту же функцию, что и в
      MicPanel, так что превью и вставка в score совпадают.

  (5) Транзиент, совпавший с устойчивой нотой (в пределах
      допуска 60 мс), — это онсет САМОГО свиста и отбрасывается
      (`filterPercussionHits`); транзиент без ноты рядом — это
      щелчок и остаётся. Так снимается баг 19.10 и выполняется
      новая просьба одновременно.

  (6) Инструмент свиста выбирается в панели (нативный `<select>`,
      пригоден на телефоне) и кликом по имени звука прямо в коде
      (CM6-расширение `instrumentClickPicker` + карточка выбора).
      Оба списка — из каталога, то есть предлагают только
      рабочие имена.

  (7) MicPanel больше не предлагает фиктивные `synth`/`drums`:
      его список — каталог + псевдо-инструмент «только барабаны»
      (слой нот отбрасывается, в score идёт только ритм).

  (8) `tsc --noEmit` + `vitest` + `lint:no-console` +
      `validate:presets` — exit 0; `mathc validate` на этом файле —
      exit 0.

