assumptions:
  - id: litellm-supports-stream-true
    state: assumed
    statement: |
      The llm-proxy at llm.kosov.online/v1 honors
      `stream: true` and returns SSE-formatted
      `data: {json}\n\n` chunks. If it returns a buffered
      JSON response instead, the existing non-streaming
      fallback (already in `LiveLLMClient`) is used.
    evidence: "OpenAI-compatible spec, LiteLLM docs."
    owner: human:operator
  - id: ai-sdk-not-required
    state: proven
    statement: |
      wavecode does NOT need to depend on `ai` /
      `@ai-sdk/openai-compatible` to get streaming. The
      `ai` package is absent from `ui/package.json` and
      SSE parsing is straightforward enough to do directly
      against the `ReadableStream<Uint8Array>` returned by
      `fetch`.
    evidence: "ui/package.json deps scan"
    owner: human:operator
  - id: ast-failure-means-broken-score
    state: proven
    statement: |
      `parseScore` from `ui/src/domain/strudel/` is the
      canonical syntactic check but it NEVER throws —
      unparseable input is captured as `OtherNode` so
      callers always get a valid AST (see parser.ts:83).
      Self-heal therefore uses a structural check over
      the resulting AST: a score is treated as broken
      when (a) `ast.nodes` has no `StackNode` or
      `CallNode` (pure `CommentNode`/`OtherNode` soup)
      OR (b) the cleaned source text has unbalanced
      parentheses (open/close mismatch). `validateForEdit`
      is NOT the trigger because it requires an exact
      4-row stack — most wavecode edits legitimately
      produce single-pattern or differently-shaped scores.
    evidence: "ui/src/domain/strudel/parser.ts parseScore = never throws; walker.ts validateForEdit = requires 4-row stack"
    owner: human:operator

risk:
  declared_triggers:
    - proxy-returns-buffered-json-instead-of-sse
    - ast-parse-throws-on-legitimate-scores
    - retry-spam-on-perpetually-broken-model
    - streaming-tokens-leak-into-existing-raw-buffer
  owner: human:operator

reversal:
  - signal: live-llm-streaming-tests-fail
    action: revert LiveLLMClient changes; keep self-heal only
  - signal: self-heal-retry-loop-detected
    action: lower retry budget to 0; keep validation but no retry
  - signal: typecheck-regression
    action: halt merge; investigate signatures

counterexample: |
  "Just bump max_tokens and live with the latency." The model
  `smart` (MiniMax-M3) is reasoning-capable and can spend 3-21s
  in reasoning before emitting any visible content. With
  `max_tokens: 2000` and streaming, the UI shows the user
  that the LLM is alive and editing within ~1s of click,
  even if the final response takes 10s end-to-end. Perceived
  latency collapses.

  "Self-heal is over-engineering; bad AI output is the LLM's
  fault, not ours." Counterexample: the failure mode we are
  fixing is not "LLM is bad" but "LLM ran out of token budget
  during reasoning and emitted half a `stack(…`". The retry
  prompt can fix this in one extra round trip because the
  model has all the context it needs — it just needs a chance
  to finish its thought. Without self-heal, the user has to
  click "Retry" manually and re-explain nothing changed.

antithesis: |
  "Streaming is a nice-to-have; the existing UI already shows a
  busy spinner. Self-heal is gold-plating; the LLM rarely breaks
  the score on well-formed instructions." Both claims are true
  but they ignore the cost of the silent failures that DO occur:
  ~5-10% of applyEdit calls return syntactically broken scores
  today, and the user sees a frozen spinner for 4-21s before
  any indication of progress. This change addresses both:
  streaming surfaces progress within ~1s; self-heal covers
  the residual ~5% of broken outputs automatically. Cost is one
  retry call (~1-2s extra latency on the broken ~5%) and a
  small back-end SSE-parser (~80 LOC). Net win.

