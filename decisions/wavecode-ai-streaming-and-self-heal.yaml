outcomes:
  - id: streaming-tokens-surface
    statement: |
      `LiveLLMClient.streamCompletion` returns a ReadableStream
      whose chunks arrive within ~1s of the request, not after
      the full body is buffered. Verified by a test that reads
      only the first chunk and asserts its delta is non-empty.
  - id: applyedit-callbacks
    statement: |
      `applyEditStream` invokes `onToken` for every
      `CompletionChunk` delta before completion, `onComplete`
      with the cleaned score on success, and `onError` with
      the original error on hard failure.
  - id: self-heal-once
    statement: |
      When the first AI response is AST-invalid
      (`parseScore` throws or `validateForEdit` returns
      `{ ok: false }`), exactly one retry call is made. A unit
      test with a doubly-broken fixture confirms the retry
      budget is exactly 1.
  - id: back-compat-applyedit
    statement: |
      `applyEdit` keeps its previous signature
      (`Effect<string, ...>`); existing callers and the
      existing `llmEdit.test.ts` continue to pass without
      modification.
  - id: no-console-domain-application
    statement: |
      `lint:no-console` (eslint over `src/domain` and
      `src/application`) reports zero violations. All new
      diagnostics flow through the existing logger
      (`infrastructure/log/*`).

