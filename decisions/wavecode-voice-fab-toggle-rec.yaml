outcomes:
  - id: fab-is-a-toggle
    statement: |
      `VoiceAIMiniFAB` и `WhistleMiniFAB` обрабатывают `click`:
      первый клик вызывает `startVoiceAI` / `startWhistle`, второй
      (при живом take) — `stopVoiceAI` / `stopWhistle`. Обработчиков
      `pointerup`/`pointerleave`, завершающих take, в этих файлах
      нет.
  - id: recording-outlives-the-finger
    statement: |
      `VoiceAIMiniFAB.test.tsx > REGRESSION: the take survives the
      finger leaving the button` и `WhistleMiniFAB.test.tsx` с тем же
      именем: после pointerdown+pointerup+click у
      `handle.start` ровно один вызов и ноль вызовов `handle.stop`.
  - id: fab-shows-the-rec-state
    statement: |
      Во время записи у FAB стоит `data-rec-state="on"`,
      `aria-pressed="true"`, вместо иконки микрофона/свиста рендерится
      `.voice-mini-fab__rec-dot`, чип подписи читает «REC».
  - id: panel-has-delete-and-clear
    statement: |
      В панели записи есть `.voice-recording-panel__delete`
      («Удалить» — удаляет аудио, текст остаётся) и
      `.voice-recording-panel__btn--clear` («Очистить текст» —
      очищает поле распознанного текста и делает «→ В ИИ»
      неактивной).
  - id: whistle-pause-keeps-the-buffer
    statement: |
      `startMic({ keepBufferedNotes: true })` не сбрасывает буфер
      сегментатора при перезапуске микрофона; после паузы и
      продолжения ноты остаются в `micPreviewNotes`, а
      `commitWhistle` очищает буфер только после успешной вставки
      в score.
  - id: confirm-before-send-intact
    statement: |
      Голосовой take по-прежнему заканчивается в `review`: текст
      попадает в редактируемое поле панели, а `→ В ИИ` — единственный
      путь к LLM. Тест `RecordingPanel.test.tsx > renders an editable
      textarea seeded with the recognised text` остаётся зелёным.
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0.
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-voice-fab-toggle-rec.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.

obligations:
  - id: toggle-replaces-hold
    claim: |
      `VoiceAIMiniFAB.tsx` и `WhistleMiniFAB.tsx` не содержат
      обработчиков `onPointerUp` / `onPointerLeave`, завершающих
      take: запись живёт дольше пальца.
    acceptance:
      all:
        - verifier: text-scan-no-hold-release-handlers
          result: pass
  - id: rec-state-is-published
    claim: |
      Обе кнопки публикуют `data-rec-state` («on» во время записи)
      и рендерят `.voice-mini-fab__rec-dot`; в CSS есть правило
      `.voice-mini-fab[data-rec-state='on']`.
    acceptance:
      all:
        - verifier: text-scan-rec-state-published
          result: pass
  - id: panel-delete-and-clear-exist
    claim: |
      `RecordingPanel.tsx` рендерит `.voice-recording-panel__delete`
      и `.voice-recording-panel__btn--clear`; тесты
      `RecordingPanel.test.tsx` проверяют, что «Удалить» не
      показывается после flush и в `review`, а «Очистить текст»
      опустошает поле и выключает «→ В ИИ».
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: toggle-behaviour-is-tested
    claim: |
      `VoiceAIMiniFAB.test.tsx` и `WhistleMiniFAB.test.tsx` зелёные:
      первый клик стартует, второй останавливает, отпускание пальца
      не останавливает, во время flush клик — no-op.
    acceptance:
      all:
        - verifier: vitest-run-voice-mini-fab
          result: pass
  - id: whistle-buffer-survives-resume
    claim: |
      `micStore.startMic` принимает `keepBufferedNotes`, и
      `whistleStore.startWhistle` передаёт его. `micStore.test.ts`
      фиксирует: перезапуск микрофона с флагом сохраняет уже
      сыгранные ноты, а без флага — очищает буфер;
      `whistleStore.test.ts` фиксирует, что `commitWhistle` чистит
      буфер после успешной вставки в score.
    acceptance:
      all:
        - verifier: vitest-run-mic-store
          result: pass
        - verifier: vitest-run-whistle-store
          result: pass
  - id: layer-boundaries-untouched
    claim: |
      Ни один файл в `ui/src/domain/`, `ui/src/application/` или
      `ui/src/infrastructure/` не изменён этим пакетом, и ни одна
      правка не добавляет импорт через слой.
    acceptance:
      all:
        - verifier: text-scan-no-domain-layer-change
          result: pass
  - id: typecheck-lint-green
    claim: |
      `npm run typecheck`, `npm run lint:no-console` и
      `npm run validate:presets` завершаются exit 0.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
        - verifier: pnpm-ui-lint
          result: pass
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-voice-fab-toggle-rec.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: mathc validate
          result: pass

