axiom_link:
  - A0
  - A3

intent: |
  Пользователь описал желаемое поведение голосового кластера
  своими словами: «кнопка голоса один раз нажата — она меняется
  на типа кнопку REC, значит что запись идёт; в окошке видно, что
  запись идёт; когда её ещё раз нажимаем — происходит стоп, и видно,
  что запись в расшифровке; и свиста один раз нажали — начались,
  второй раз нажали — это как бы пауза». Плюс две кнопки в панели:
  «удалить» и маленькая «очистить весь текст».

  Переведённое на язык требований:

  (1) Обе мини-кнопки (Голос и Свист) — ТУМБЛЕРЫ, а не
      «держать». Одно нажатие запускает запись, второе её
      останавливает. Запись обязана ПРОДОЛЖАТЬСЯ после того, как
      палец отпустил кнопку: удержание принципиально не может это
      выразить.

  (2) Пока идёт запись, сама кнопка становится кнопкой REC: точка,
      красная подсветка, чип «REC». Состояние читается с кнопки, а
      не только из панели.

  (3) В панели записи появляется кнопка «Удалить», которая удаляет
      АУДИО и оставляет ТЕКСТ (так ответил пользователь на
      уточняющий вопрос), и маленькая кнопка «Очистить текст»,
      которая очищает поле распознанного текста в панели (тоже
      ответ пользователя).

  (4) Для свиста второе нажатие — это ПАУЗА: ноты остаются в
      буфере, панель остаётся открытой («Применить» должна быть
      доступна), следующее нажатие продолжает тот же take, а не
      начинает новый с нуля.

  Что было до этого решения: `VoiceAIMiniFAB` различал «удержание
  ≥ 50 мс» (старт сессии) и «тап» (только вооружить панель и ждать
  ●REC внутри неё); `WhistleMiniFAB` работал по принципу
  «зажал-свистнул-отпустил». Панель имела собственную кнопку ●REC
  для голоса. Пользовательский сценарий «нажал один раз — идёт
  запись, нажал ещё раз — стоп» в такой модели был недостижим:
  запись всегда жила вместе с пальцем.

commitment: |
  (1) `VoiceAIMiniFAB` и `WhistleMiniFAB` переходят на toggle:
      `click` начинает take, следующий `click` его останавливает
      (для свиста — ставит на паузу). Никакой обработчик
      `pointerup`/`pointerleave` больше не завершает запись: отпускание
      пальца не влияет на take.

  (2) Во время записи кнопка отображает REC-состояние: точка вместо
      иконки (`data-rec-state="on"`, класс `voice-mini-fab__rec-dot`),
      чип «REC» вместо «Голос»/«Свист», красная подсветка и пульс.

  (3) Голосовая «вооружённая» фаза (`voiceAIPanelArmed`) и
      `VoiceAIArmedBody` удаляются: FAB сам является REC-контролом,
      второй способ начать тот же take был бы дублирующим и
      недостижимым. Кнопка ●REC в панели остаётся для свиста
      (она управляет take, который идёт из FAB), но не для голоса.

  (4) Пауза свиста сохраняет буфер: `stopWhistle` освобождает
      микрофон, но не трогает ноты; продолжение take стартует с
      `keepBufferedNotes`, чтобы сегментатор не сбросил уже
      насвистанное. «Применить» вставляет ВЕСЬ буфер.

  (5) Панель получает «Удалить» (удаляет аудио, текст остаётся) и
      маленькую «Очистить текст» (очищает поле распознанного
      текста). «Удалить» показывается только пока take реально
      пишется: после flush аудио уже летит на сервер, и кнопка,
      обещающая его удалить, была бы ложью.

  (6) Контракт подтверждения перед отправкой не меняется: take
      заканчивается в `review`, текст попадает в редактируемое
      поле, до «→ В ИИ» ничего не уходит в LLM.

  (7) Слои не меняются: правки только в `presentation/` и в CSS.
      `tsc --noEmit` + `vitest` + `lint:no-console` +
      `validate:presets` — exit 0; `mathc validate` на этом файле —
      exit 0.

counterexample: |
  «Тап-тумблер хуже удержания: он открывает микрофон при
  случайном касании, а удержание хотя бы требовало намерения.
  Стоит оставить hold-to-record, а toggle-REC оставить только в
  панели». Возражения: (а) требование «запись продолжается после
  отпускания» физически не выражается удержанием — take умирает
  вместе с пальцем, и это ровно то, что пользователь описал как
  неработающее; (б) «случайное касание» — это ровно тот же
  случай, который в 2026-10 закрывался «вооружённой» фазой, но
  ценой второго обязательного клика по ●REC, то есть ценой
  нарушения требуемого сценария «нажал один раз — идёт запись»;
  (в) случайный старт не остаётся незамеченным: кнопка
  мгновенно становится красной REC-точкой, панель показывает
  «записываю… N с» и живую метку громкости, микрофон держится под
  мьютексом, а второй тап его выключает; (г) удержание не
  выражает и «паузу» — оно не может оставить буфер нот доступным
  для «Применить», не превращая отпускание в отмену.

  «Тогда оставим hold-to-record, но добавим рядом отдельную
  маленькую кнопку REC». Возражения: два контрола на одно
  действие — источник расхождения состояний (кнопка «говорит» REC,
  сессия не стартовала). Панель уже имела такую кнопку ●REC, и она
  была именно тем, что пользователь игнорировал: он просил, чтобы
  «кнопка голоса» сама была REC-кнопкой.

antithesis: |
  «Оставить hold-to-record как основной жест, а toggle добавить
  третьим способом — shift+click». Возражения: (1) скрытый
  модификатор не находится без инструкции, а инструкция — это
  ровно то, что пользователь пытался убрать; (2) два разных
  способа остановить take дают два разных состояния (один
  отменяет take, другой сливает его в расшифровку), и в
  «вооружённой» модели это уже породило отдельный доменный тег
  `armed`; (3) пользователь сформулировал поведение в терминах
  «нажал один раз / нажал ещё раз» — это описание toggle, а не
  модификатора.

