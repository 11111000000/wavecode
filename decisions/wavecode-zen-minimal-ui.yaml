outcomes:
  - id: wavecode-zen-minimal-ui-outcome-language
    statement: |
      У интерфейса есть один описанный визуальный язык (в текущем
      коде — Chroma Indigo Spectrum), и `docs/design.md` совпадает
      с ним; отдельного «phosphor/CRT»-описания в документации нет.
  - id: wavecode-zen-minimal-ui-outcome-reachability
    statement: |
      Каждый реализованный инструмент (score, step grid, piano,
      mixer, AI, voice, presets, console, share) достижим из
      состояния покоя не более чем за одно действие и не зависит
      от знания скрытых хоткеев.
  - id: wavecode-zen-minimal-ui-outcome-no-dangling-tokens
    statement: |
      Число обращений к несуществующим токенам в `ui/src/styles`
      равно нулю (`node scripts/check-zen-ui.mjs --strict`).
  - id: wavecode-zen-minimal-ui-outcome-a11y-floor
    statement: |
      Интерактивные цели не меньше 24×24 CSS px, у каждой есть
      видимый `:focus-visible`, контраст текста ≥ 4.5:1.
  - id: wavecode-zen-minimal-ui-outcome-structure
    statement: |
      Приложение имеет пять структурных поверхностей (холст, рельс,
      транспорт, входной док, лист «Инструменты») и не более 20
      интерактивных регионов в состоянии покоя; AI открывается
      выдвижным слоем поверх холста, а не панелью рядом с ним.
  - id: wavecode-zen-minimal-ui-outcome-input-dock
    statement: |
      Голос и ритм — два явных режима одного входного дока с
      переключателем; ритм доступен не более чем за два действия из
      любого состояния, а плавающих кнопок в приложении ровно одна.
  - id: wavecode-zen-minimal-ui-outcome-tool-registry
    statement: |
      Каждый инструмент описан в `toolRegistry.ts`, и рельс, лист
      «Инструменты», палитра команд и e2e-проверка достижимости
      строятся из этого одного списка; инструментов в состоянии
      «реализовано, но не выведено» не остаётся.
