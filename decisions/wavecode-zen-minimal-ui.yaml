intent: |
  Решение владельца (2026-11-15): весь интерфейс wavecode переводится
  в минималистичный «дзенский» режим. Воздух управляет структурой,
  лишнего нет, но всё необходимое остаётся: каждый реализованный
  инструмент должен быть виден в интерфейсе и достижим за один шаг,
  без перегрузки экрана.

  Вторая редакция (2026-11-15, после аудита): владелец утвердил
  направление целиком и передал спорные вопросы на решение по
  рекомендациям аудита. Ниже зафиксированы конкретные ответы; полный
  план «от философии до реализации» — `docs/2026-11-15-zen-ui-plan.md`,
  визуальный макет целевого состояния — `docs/2026-11-15-zen-ui-wireframe.html`.

  Аудит (docs/2026-11-15-zen-ui-audit.md) показал, что сегодня
  направление разъехалось с кодом и с корпусом решений:

  * `docs/design.md:3-5` описывает «phosphor-amber REPL / CRT»,
    тогда как `ui/src/styles/tokens.css:1-12` уже несёт «Chroma
    Indigo Spectrum» (violet primary, cyan live, magenta record);
    документация описывает несуществующий интерфейс;
  * код использует безаномалию и скруглённые радиусы (8-12px),
    glow и бесконечные анимации — визуальный шум, прямо
    противоречащий «дзенской» цели;
  * 25 обращений к `var(--x)` указывают на несуществующие токены
    (`--amber`, `--fg-muted`, `--z-popover`, `--shadow-modal` и
    ещё семь имён) — визуальные свойства молча теряются;
  * корпус решений содержит два несовместимых активных контракта
    навигации: `wavecode-bottom-bar-unified@1` (6 табов, без
    overflow-меню) и `wavecode-ui-minimal-pass-phase-2@1` (3 таба);
    и два несовместимых голосовых: `wavecode-voice-fab@1`
    (1 большой + 2 мини-FAB) и `wavecode-voice-minimal-dock@1`
    (одна кнопка, один док);
  * 129 hover-правил против 13 `:focus-visible` — интерфейс
    рассчитан на мышь, а не на клавиатуру и не на сенсор.

  Направление фиксируется здесь; конкретные правки — фазами
  (см. план в аудите), каждая фаза — отдельным решением.
commitment: |
  1. **Пустота несущая.** Разделение и отступы задаются шкалой
     `--space-*`; декоративные тени, glow, scanline и градиентные
     подложки не добавляются без отдельного решения. Радиусы
     сводятся к двум ступеням (0 для управляющих элементов
     и кода, 12 px для поверхностей).
  2. **Полнота без перегрузки.** Ни один реализованный инструмент
     не исчезает из интерфейса. Если экран перегружен, инструмент
     уходит в раскрываемый слой (sheet/drawer), но не за хоткей,
     спрятанный в справке.
  3. **Один навигационный контракт.** Ровно один активный способ
     добраться до каждого инструмента: нижняя панель или маршрут
     листов. Дублирующиеся ряды вкладок и плавающие кнопки,
     повторяющие уже доступный инструмент, удаляются.
  4. **Токены — единственный источник цвета.** Новых литералов
     цвета вне `ui/src/styles/tokens.css` не появляется; висящие
     `var(--x)` обнуляются.
  5. **Доступность — пол, а не украшение.** Контраст текста
     ≥ 4.5:1, нетекстовых элементов ≥ 3:1, цели ≥ 24×24 CSS px,
     каждая интерактивная кнопка имеет видимый фокус, все
     бесконечные анимации уважают `prefers-reduced-motion`.
  6. **Документация соответствует коду.** `docs/design.md`
     описывает фактически выпущенную визуальную систему.
  7. **Регрессии измеримы.** `scripts/check-zen-ui.mjs` падает при
     росте доли шума и при падении покрытия фокусом;
     `scripts/zen-ui-baseline.json` фиксирует текущий уровень.

  Ревизии 2 — ответы на спорные вопросы, которые владелец передал
  на решение по рекомендациям аудита:

  8. **Палитра не меняется, меняется её дозировка.** База —
     Chroma Indigo Spectrum (`tokens.css:1-12`). Свечения
     (`--primary-glow`, `--cyan-glow`, `--magenta-glow`,
     `--warm-glow`) удаляются; `--warm` остаётся только для темпа и
     метронома; поверхностная шкала сокращается с 5 уровней до 3;
     золотой уходит из активных состояний и hover.
  9. **Навигация: четыре уровня.** Tier 0 — холст, транспорт,
     top bar, одна кнопка ввода. Tier 1 — рельс из четырёх
     пунктов (Нотная, Шаги, ИИ, Ввод). Tier 2 — один лист
     «Инструменты». Tier 3 — палитра команд `⌘K`. Глубина
     раскрытия ≤ 2. На десктопе рельс вертикальный, AI — выдвижной
     слой поверх холста, а не панель рядом.
  10. **Ритм — второй режим входного дока.** Голос и Ритм делят
      одну плавающую кнопку и один док с явным переключателем
      «Голос | Ритм». Логика ветки `feat/rhythm-recorder`
      переиспользуется, третья плавающая кнопка не добавляется —
      это сохраняет `wavecode-voice-minimal-dock@1`.
  11. **Инструменты-сироты не остаются сиротами.** MIDI и
      WAV-экспорт выводятся в лист «Инструменты → Экспорт»; сетка
      мелодии — режим в листе «Шаги»; `editScore` подключается к
      модели, если прокси принимает `tools`, иначе обещание
      убирается из README; дублирующий `TransportPanel` удаляется.
  12. **Реестр инструментов — источник правды.**
      `ui/src/presentation/state/toolRegistry.ts` описывает каждый
      инструмент (id, ярлык, иконка, уровень, поверхность, хоткей);
      из него строятся рельс, лист «Инструменты», палитра команд и
      e2e-проверка достижимости. Состояние «реализовано, но не
      выведено» запрещено.
axiom_link:
  - A1
