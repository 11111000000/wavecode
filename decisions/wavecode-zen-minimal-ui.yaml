negative_control: |
  `node scripts/check-zen-ui.mjs` has teeth: removing a single token
  definition (`--space-md`) from `ui/src/styles/tokens.css` in a
  scratch copy of the tree raises `danglingRefs` from 25 to 193 and
  the guard exits 1 with `danglingRefs: 193 > baseline 25`. The same
  holds for the focus-floor rule: deleting `:focus-visible` rules
  drops `focusVisibleSelectors` below the recorded floor and the
  guard fails.
counterexample: |
  The strongest objection is that a "zen" interface without visible
  chrome hides exactly the affordances a newcomer needs, and that the
  reachable-by-one-action guarantee is a promise the current mobile
  layout cannot keep without turning into a dock of icons — the very
  clutter this decision claims to remove. The objection is
  acknowledged but does not survive the evidence: the corpus already
  contains two incompatible navigation contracts, which means the
  present cost is duplication, not minimalism; and NN/g's
  progressive-disclosure guidance caps disclosure at two levels, so
  a tool sheet reached in one action satisfies both the reachability
  guarantee and the depth limit.
antithesis: |
  The coherent counter-position is to keep the expressive,
  high-density "synthwave terminal" language and simply prune the
  obviously broken parts (dangling tokens, missing focus rings,
  duplicated tabs), treating visual restraint as a matter of taste
  rather than a commitment. It was considered and rejected because
  it leaves the two active contradictory navigation contracts in
  force and because the measured gaps are not aesthetic preferences:
  25 silently dropped visual properties, 129 hover rules against 13
  focus rules, and 15 `outline: none` declarations mean parts of the
  interface are currently broken for keyboard and touch users rather
  than merely loud.
assumptions:
  - id: wavecode-zen-minimal-ui-assumption-touch-primary
    state: assumed
    statement: |
      The primary use context is a phone or tablet held in one hand,
      so a one-action reach rule must hold for touch, not only for
      mouse and keyboard.
    owner: human:operator
    consequence_if_false: |
      If the primary context is a desktop monitor, the dock may
      become a persistent left rail with deeper disclosure.
risk:
  declared_triggers:
    - tool-reachability-regression
    - focus-visibility-regression
    - visual-language-drift
    - navigation-contract-ambiguity
  owner: human:operator
reversal:
  - signal: |
      Reachability tests fail for a shipped tool, or users report
      that a tool "disappeared" from the interface.
    action: rework
  - signal: |
      Time-to-first-sound or task completion in the usability pass
      gets worse against the pre-change baseline.
    action: review
