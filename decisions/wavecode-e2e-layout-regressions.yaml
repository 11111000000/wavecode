outcomes:
  - id: wavecode-e2e-layout-regressions-outcome-piano-reachable
    statement: |
      На desktop (1280×800) disclosure «▼ Пианино» и кнопка REC
      панели пиано кликабельны: `elementFromPoint` в центре кнопки
      возвращает саму кнопку, а не перекрывающий её транспорт-бар.
  - id: wavecode-e2e-layout-regressions-outcome-console-close
    statement: |
      Кнопка «×» консольной панели кликабельна на desktop — консоль
      лежит выше транспорт-бара по z-index.
  - id: wavecode-e2e-layout-regressions-outcome-editor-floor
    statement: |
      Редактор счёта не схлопывается в 0px при раскрытом пиано:
      `.cm-host` получает не менее 140px.
