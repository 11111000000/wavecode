outcomes:
  - id: pianoroll-ast-extraction
    statement: |
      `extractNoteEvents(score)` через AST извлекает note events
      (midi, startCycle, endCycle) из любого валидного score,
      содержащего `note(...)` / `n(...)` / `chord(...)` /
      `cat([...])`. Mini-notation парсится по позиции токена
      внутри строкового литерала (frequency-spacing model
      `<a b c d>` = 4 steps, `[a b]` = 1 step × all notes).
  - id: pianoroll-canvas-render
    statement: |
      `<Pianoroll />` рендерит ноты в canvas: X = time в cycle
      units, Y = pitch (MIDI 24..96 по умолчанию). Цвет нот по
      sample/category (`s("…")` → palette по хэшу name).
      Playhead — вертикальная линия, обновляемая RAF.
  - id: pianoroll-edit-click
    statement: |
      Клик на пустое поле добавляет ноту через `replaceScore` →
      перепарс через AST → новый snippet инжектится (additive —
      новый note в стек) или, если первый non-comment stmt =
      bare `note(...)` — модифицируется inline. Shift+клик на
      ноту → удаление через `replaceScore`.
  - id: pianoroll-zoom-pan
    statement: |
      Ctrl+wheel = zoom (множитель 1.1..0.5). Wheel = pan по X.
      Drag-правым-кликом или Alt+drag = pan по X/Y. State
      управляется Solid signals, пересчёт видимого региона
      реактивный.
  - id: pianoroll-empty-state
    statement: |
      Если `extractNoteEvents(score).length === 0`, поверх
      canvas рендерится overlay с подсказкой:
      "Edit a `note(...)` to see events here".
  - id: pianoroll-debounce
    statement: |
      Score → re-parse → render debounced 350ms через
      `createEffect` + setTimeout (как VisualizerPanel).
      Клики и drag НЕ debounce — они пере-записывают весь score
      через `replaceScore`.
  - id: pianoroll-score-panel-toggle
    statement: |
      `ScorePanel` добавляет 2-кнопочный toggle «text | roll»
      сразу над CodeMirror/Canvas. По умолчанию `text`
      (CodeMirror). Выбор сохраняется в localStorage
      (`wavecode-score-view-mode-v1`).

