    claim: |
      Pianoroll component tests (vitest + solid-testing-library):
      re-parse на Creep preset → ненулевой note count; zoom/pan
      signals обновляются; click добавляет ноту (через onChange);
      Shift+click удаляет ближайшую ноту.
    acceptance:
      all:
        - verifier: "vitest run ui/src/presentation/components/Pianoroll.test.tsx"
          result: pass
  - id: pianoroll-debounce-timing
    claim: |
      Debounced re-parse работает: 350ms timeout на score-change.
