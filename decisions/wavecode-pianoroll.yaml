assumptions:
  - id: pianoroll-assumption-canvas-supports-2d
    state: assumed
    statement: |
      "Canvas 2D context поддерживается во всех целевых браузерах
       (Chromium-based desktop, Firefox, Safari ≥14). Для
       интерактивных нот достаточно 2D — WebGL избыточен."
    owner: human:operator
  - id: pianoroll-assumption-mini-notation-frequency
    state: assumed
    statement: |
      "Strudel mini-notation `<a b c d>` интерпретируется как 4
       ровных шага (1/4 каждый). `[a b]` — один шаг со всеми
       нотами одновременно (chord). Этот convention совпадает
       со Strudel-doc и pianoTranscribe.ts."
    evidence: "git grep '<' ui/src/domain/presets.ts | head -3"
    owner: agent
  - id: pianoroll-assumption-mutation-replaces-score
    state: assumed
    statement: |
      "Edit через pianoroll перезаписывает весь score (не
       делает AST-merge). Это совпадает с поведением
       editGridLayer / pianoTranscribe.applyTranscription — все
       визуальные мутаторы в wavecode работают через
       `replaceScore` целиком."
    evidence: "audioActions.evalScore line 110"
    owner: agent

risk:
  declared_triggers:
    - canvas-perf-degrades-with-many-notes
    - edit-merge-corrupts-user-comments-preserved-by-ast
    - wheel-zoom-conflicts-with-page-scroll-on-mobile
  owner: human:operator

reversal:
  - signal: pianoroll.test.tsx-fails
    action: rework
  - signal: bundle-size-grows-30kb-beyond-budget
    action: move-helpers-to-utility-file-shrinking-component
  - signal: visual-rendering-broken-on-safari
    action: rework-canvas-to-svg-fallback

counterexample: |
  "Pianoroll — overkill для step-grid паттернов; юзер рисует
   4×8 сетку, не 128 дорожек. DAW-парадигма не подходит для
   mini-notation-driven паттернов."

  Counter: pianoroll НЕ обязателен для простых паттернов —
  CodeMirror остаётся по умолчанию. Pianoroll — opt-in для
  больших melodичных score (Creep, Jazz ii-V-I, Piano ballad),
  где визуальное редактирование нот экономит время.

antithesis: |
  "CodeMirror уже покрывает всё — текст и есть piano roll для
   Strudel-юзеров. Skip pianoroll, сфокусироваться на AI-edit."

  Rejected потому что: (1) Pianoroll не заменяет CM6 — это
  альтернативный view для тех, кто мыслит дорожками. (2)
  Pure-function helper (extractNoteEvents) переиспользуется
  будущими фичами (MIDI export, AI-edit suggest). (3) Простой
  implementation не блокирует AI-edit — оба развиваются
  параллельно.

