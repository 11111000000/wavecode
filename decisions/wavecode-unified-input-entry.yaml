outcomes:
  - id: wavecode-unified-input-entry-outcome-one-entry
    statement: |
      В приложении есть ровно одна кнопка ввода — круглая «Ввод», и она
      всегда открывает лист ввода. Вторых входов в запись не осталось:
      в рельсе «Ввода» нет, отдельного инструмента «Микрофон» нет, у
      FAB нет режима записи.
  - id: wavecode-unified-input-entry-outcome-three-tabs
    statement: |
      Ввод различает три модальности — Речь, Свист, Ритм — вкладками в
      одном листе. Пользователь не должен угадывать, что он сейчас
      записывает: подпись вкладки, глагол в статусной строке и кнопка
      действия стоят рядом и всегда описывают одно и то же.
  - id: wavecode-unified-input-entry-outcome-rail-three
    statement: |
      Рельс держит три пункта — Нотная, Шаги, ИИ — и не смешивает
      адресата (ИИ) со способом захвата (Ввод).
  - id: wavecode-unified-input-entry-outcome-sheet-header
    statement: |
      Заголовок правого ящика на десктопе не перекрывается строкой
      транспорта: лист начинается под ней, и кнопка закрытия доступна.
