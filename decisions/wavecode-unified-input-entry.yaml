    claim: |
      The zen guard reports the phase-1 targets met and no regression
      against the recorded baseline: no dangling token reference, no
      hardcoded colour outside the token file, at most one infinite
      animation, and no growth of the sheet-surface count — the input
      sheet replaces the microphone sheet, it does not add a surface.
    acceptance:
      all:
        - verifier: "node scripts/check-zen-ui.mjs --targets"
          result: pass
  - id: wavecode-unified-input-entry-quality-gate
    claim: |
      The repository quality gate is green: typecheck, unit tests,
      console lint and preset validation.
    acceptance:
      all:
        - verifier: "cd ui && npm run test:precommit"
          result: pass
  - id: wavecode-unified-input-entry-input-entry-e2e
    claim: |
      The e2e suite pins the new information architecture: the rail has
      exactly three items, the round button opens the input sheet, the
      sheet has exactly three tabs, each tab shows its own body and its
      own action button, and the old entries are gone.
    acceptance:
      all:
        - verifier: "cd ui && npx playwright test tests/e2e/input-entry.spec.ts tests/e2e/tool-reachability.spec.ts"
          result: pass
