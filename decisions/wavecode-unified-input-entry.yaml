    claim: |
      The tab strip is reachable from the keyboard: arrow keys, Home and
      End switch the tab and move the focus onto it.
    acceptance:
      all:
        - verifier: "cd ui && npx vitest run src/presentation/components/app/InputSheet.test.tsx"
