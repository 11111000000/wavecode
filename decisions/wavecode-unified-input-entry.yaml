negative_control: |
  The e2e check has teeth in both directions. If the rail grew back to
  four items, `toHaveCount(3)` fails; if a second round input button
  appeared, `toHaveCount(1)` on `.voice-mini-fab` fails. If the tab
  strip were replaced by a two-way switch, `toHaveCount(3)` on
  `.input-tab` fails — and so does the unit test that counts the tabs by
  their labels («Речь», «Свист», «Ритм»). The keyboard check has teeth
  too: with the roving `tabindex` and no arrow handling, the two
  inactive tabs are unreachable, and the unit test that asserts
  `document.activeElement` moved to the next tab fails. The guard's
  `sheetClasses` metric has teeth in the same way: if the input sheet
  had been a NEW surface next to the microphone sheet, the count would
  have grown past the baseline and `--targets` would have failed.
counterexample: |
  The strongest objection is that this removes a shortcut. The old FAB
  started the recording with one click — the sheet added a second click
  and a tab choice before every take. For a user who records the same
  thing a hundred times a day, that is friction, and the argument "one
  button, one meaning" is worth less than the seconds it costs. The
  objection is accepted for the power user and mitigated in two ways:
  the sheet remembers the last used tab, and the FAB keeps a single
  click path to the recording (it opens the sheet on the «Речь» tab,
  which is where the recording button is one click away). The
  alternative — leaving a second, hidden recording shortcut — was
  rejected precisely because it is the thing that made the old FAB
  ambiguous.
antithesis: |
  The coherent alternative was to keep the rail at four items and rename
  the old FAB. It was rejected because the names were not the problem:
  whatever the FAB was called, the user still had two buttons that led
  to the same dock and a third that meant something else entirely. The
  second alternative — a dock with a switcher («Голос | Ритм») — was
  rejected because the modality count grew from two to three, and a
  two-way switch cannot show three ways at once: the user would have to
  guess whether "Свист" is inside "Голос" or beside it. A tab strip
  shows all three at once, which is what makes the question "am I
  recording a melody or a rhythm?" answerable without clicking.
assumptions:
  - id: wavecode-unified-input-entry-assumption-three-modalities
    state: assumed
    statement: |
      Three modalities are the complete set of ways to capture material
      into wavecode: speech, whistle (or any pitched sound) and rhythm.
      A fourth way would need a fourth tab, and the strip stays readable
      only while it fits.
    owner: human:operator
    consequence_if_false: |
      If a new capture mode appears, it becomes a fourth tab and the
      strip must be re-measured; if the modes grow to five, the strip
      turns into a menu and the decision has to be reworked.
  - id: wavecode-unified-input-entry-assumption-speech-online
    state: assumed
    statement: |
      The speech path stays a network call to the STT service. The sheet
      says so honestly: «Речь» promises a round trip, «Свист» and
      «Ритм» are local and instant.
    owner: human:operator
    consequence_if_false: |
      If a local recogniser appears, the difference in latency between
      the tabs disappears and the tab names may need to shift from
      "modality" to "pipeline".
risk:
  declared_triggers:
    - input-ambiguity-report
    - sheet-header-clipped
    - rail-density-regression
    - capture-latency-regression
  owner: human:operator
reversal:
  - signal: |
      Users report that the second click (FAB → sheet) makes recording
      slower than the old one-click FAB, and that they keep opening the
      sheet to record speech.
    action: rework
  - signal: |
      A right drawer is again covered by the transport bar, or a sheet
      title is clipped.
    action: review
  - signal: |
      The tab strip stops fitting on a narrow viewport and the labels
      wrap or truncate.
    action: rework
relations:
  implements:
    - wavecode-zen-ui-implementation@1
  refines:
    - wavecode-zen-minimal-ui@2
