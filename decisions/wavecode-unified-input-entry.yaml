intent: |
  Ввод в wavecode был размазан по четырём местам, и все четыре назывались
  почти одинаково:

    * круглая кнопка «Голос» (она же REC, она же тап-пад в ритме);
    * пункт рельса «Ввод» — открывал тот же самый док голоса;
    * пункт листа «Инструменты» «Микрофон» — а это уже свист (микрофон →
      высота тона → MIDI-ноты);
    * переключатель «Голос | Ритм» внутри дока.

  Владелец сформулировал путаницу прямо: «зачем нам и ассистент отдельно
  от ввода внизу непонятно» и «как вообще сделать так, чтобы у юзера
  вообще не было путаницы, что он сейчас голос записывает мелодию или
  там ритм».

  Причина путаницы — не в количестве функций, а в том, как они названы и
  где лежат:

    1. **Два входа в одно.** «Ввод» в рельсе и «Голос» — кнопка вели в
       один и тот же док. Второй вход ничего не добавлял.
    2. **Два разных действия названы по одному устройству.** «Голос» —
       это распознавание речи, «Микрофон» — это высота тона. Устройство
       одно (микрофон), а смысл разный; называть их по устройству —
       значит просить пользователя угадывать.
    3. **Одна кнопка — два поведения с молча меняющейся подписью.** FAB
       назывался «Голос», а в ритме подпись молча менялась на «Ритм» и
       кнопка становилась тап-падом. Пользователь не мог знать, что
       нажмёт.
    4. **Разные категории стояли рядом.** «ИИ» и «Ввод» в рельсе
       читались как два равных способа получить музыку, хотя ИИ — это
       адресат, а Ввод — способ захвата.

  Это решение фиксирует перестройку информационной архитектуры ввода:
  одна круглая кнопка с одним значением, один лист с тремя вкладками,
  названными по намерению, и рельс из трёх пунктов.

commitment: |
  1. **Одна кнопка — одно значение.** Круглая кнопка «Ввод»
     (`InputFAB`, `.voice-mini-fab[aria-label="Ввод"]`) ВСЕГДА открывает
     лист ввода. Она никогда не начинает запись и никогда не меняет
     подпись. Записью занимается кнопка внутри вкладки «Речь», тапом
     ритма — кнопка «Отметить» внутри вкладки «Ритм».
  2. **Один лист, три вкладки.** `InputSheet` (`kind="input"`,
     `.wc-sheet[data-kind="input"]`) с полосой вкладок
     (`role="tablist"`): **Речь | Свист | Ритм**. Названия — по
     намерению, а не по устройству: устройство одно, смыслов три.
  3. **Каждая вкладка отвечает на вопрос «что я сейчас делаю».**
     Вкладка «Речь» — кнопка записи + строка статуса с глаголом
     («Готов к записи…», «Слушаю…», «Распознаю…») + композер; «Свист» —
     панель микрофона по высоте тона; «Ритм» — темп, сетка 4×8 и кнопка
     «Отметить». Подпись вкладки, глагол в статусе и кнопка действия
     лежат рядом всегда — разойтись им негде.
  4. **Рельс — три пункта.** «Нотная | Шаги | ИИ». «Ввод» ушёл в
     tier 2 (лист «Инструменты» + `⌘K`), потому что ИИ и Ввод — разные
     категории, а в рельсе они читались как два равных способа получить
     музыку.
  5. **Отдельного «Микрофона» в листе инструментов больше нет.** Свист
     живёт вкладкой «Свист»: устройство не должно называться в двух
     местах.
  6. **Переключение вкладки освобождает микрофон прежней модальности.**
     «Речь» и «Свист» делят один физический микрофон; закрытие листа
     гасит всё (в режиме `review` текст сохраняется, незавершённая
     запись отбрасывается).
  7. **Старый код удалён, а не спрятан.** `VoiceFAB`,
     `VoiceAIMiniFAB` и `RecordingPanel` вместе с тестами удалены из
     репозитория; класс `.voice-recording-panel` переименован в
     `.speech-input`, потому что плавающей панели голоса больше нет.
  8. **Клавиатура дотягивается до всех вкладок.** Полоса вкладок —
     настоящий `tablist` с бегущим `tabindex`, поэтому стрелки
     (`←`/`→`/`Home`/`End`) переключают вкладку и уводят на неё фокус;
     без этого две вкладки из трёх были бы недостижимы с клавиатуры.
  9. **Слои починены.** Правый ящик на десктопе начинается ПОД строкой
     транспорта, а не под ней: заголовок листа («Ввод», «ИИ-ассистент»)
     больше не срезан транспортом, а его кнопка закрытия — доступна.
