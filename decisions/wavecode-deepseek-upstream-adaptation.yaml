axiom_link:
  - A0
  - A3

intent: |
  2026-10-26 прокси llm-proxy переключили с MiniMax на DeepSeek
  (`smart` → deepseek-v4-pro, `fast` → deepseek-flash): Token Plan
  MiniMax-аккаунта №1 исчерпан, upstream отдавал 429 «Token Plan usage
  limit reached (2056)», и весь трафик через прокси (wavecode,
  genium-clean, geopulse) падал.

  Клиент wavecode к этому моменту врал в трёх местах, и каждая ложь
  стоила диагностики:

  (1) Контроль reasoning не доезжал. Клиент слал `reasoning_effort`
      top-level, но у прокси глобальный `litellm_settings.drop_params=
      true`, и LiteLLM молча выкидывает provider-специфичные поля
      верхнего уровня. Замер через llm.kosov.online (model=fast):
      top-level `reasoning_effort=low` → 1221 completion-токенов, 7.9 s;
      `extra_body.reasoning_effort=low` → 125 токенов, 1.8 s. То есть
      «мало размышлений» не работало: модель размышляла на полный
      бюджет, а при `max_tokens=2000` приходила с
      `finish_reason=length` и пустым content.

  (2) Ошибка 429 подменялась шаблоном «LLM HTTP 429: rate-limited by
      proxy. Подожди и retry.» — тело ответа с настоящей причиной
      выбрасывалось. Ровно это уводило диагностику 2026-10-26 в тупик:
      оператору было сказано «подожди» про лимит, который не был нашим
      и повтором не лечился.

  (3) Подписи в UI обещали MiniMax («M3», «M2.1», `routesTo:
      MiniMax-*`), хотя прокси уже отдавал DeepSeek.

commitment: |
  (1) Формат тела запроса определяется профилем upstream
      (`VITE_LLM_UPSTREAM`: `deepseek` | `minimax`, по умолчанию
      `deepseek`): для DeepSeek контроль reasoning едет в
      `extra_body.reasoning_effort`, для MiniMax — в
      `extra_body.thinking.type='disabled'` (для тира `fast`).

  (2) `max_tokens` = 4000: reasoning не съедает бюджет даже на
      `deepseek-v4-pro` с effort=high.

  (3) Ошибки говорят правду: 429 с «Token Plan / Insufficient Balance /
      quota» трактуется как исчерпанный лимит провайдера (повтор не
      поможет) и показывает текст от провайдера; прочие 429 — как rate
      limit провайдера; пустой ответ с `finish_reason=length`
      диагностируется как «лимит токенов исчерпан на размышления».

  (4) Подписи моделей в UI соответствуют фактической маршрутизации
      прокси.

      Ревизия 2 (2026-11-02): пункт про подпись «min» снят — замер
      того же дня опроверг его посылку. `reasoning_effort=none` DeepSeek
      РЕАЛЬНО отключает (0 символов reasoning, первый токен 1.07-1.44 с
      против 4.57-10.27 с у `low` и 7.35-11.23 с у `high`, 3/3 прогона),
      тогда как `off` и `minimal` действительно игнорируются. Поэтому
      клиентский «off» означает `none`, а подпись — «выкл». Подробности и
      остальные обязательства этой ревизии — в решении
      `wavecode-llm-latency-fast-path`.

counterexample: |
  «Достаточно поменять две строки в linter-совместимых местах: убрать
  top-level `reasoning_effort` и поправить лейблы на „DeepSeek"».

  Возражения: (а) без `extra_body` контроль reasoning не работает вовсе
  — прокси дропает поле, и «мало размышлений» продолжает означать
  «много размышлений»; (б) подписи без диагностики ошибок оставляют
  ровно ту ловушку, в которую попала диагностика 2026-10-26: UI
  показывает «rate-limited by proxy», хотя провайдер исчерпал тариф;
  (в) `max_tokens=2000` без запаса означает, что первый же длинный
  промпт на `deepseek-v4-pro` вернёт пустой content — то есть исходный
  баг воспроизведётся при первом же реальном запросе.

  «Оставить клиент полностью провайдер-независимым и не трогать тело
  запроса вовсе». Возражения: LiteLLM с `drop_params=true` делает
  провайдер-независимость иллюзорной — поле, которое провайдер понимает,
  до провайдера не дойдёт, а поле, которое не понимает, будет отброшено
  молча. Единственная форма, которая работает для обоих, — `extra_body`.

antithesis: |
  «Оставить `reasoning_effort` top-level и считать, что рано или поздно
  LiteLLM перестанет дропать provider-специфичные поля». Возражения:
  `drop_params=true` — явная настройка прокси, а не баг; менять её
  значит менять поведение всех потребителей (genium-clean, geopulse),
  которые полагаются на то, что лишние поля молча выбрасываются.

  «Убрать опцию размышления из UI совсем». Возражения: размышление
  реально влияет на качество ответа, а «минимум» честнее, чем ложное
  обещание полного отключения, которого провайдер не даёт.

  «Не поднимать `max_tokens`, а оставить 2000 и надеяться, что при
  effort=low хватит». Возражения: при effort=low через `extra_body`
  reasoning занимает ~130 токенов и 2000 хватает, но это верно только
  для коротких правок; `smart` (v4-pro) на длинном промпте при
  effort=high съедает 4000+ токенов размышлениями. Запас нужен именно
  потому, что модель может уйти в reasoning на любом запросе.

