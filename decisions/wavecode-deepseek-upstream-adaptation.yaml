outcomes:
  - id: reasoning-control-reaches-the-provider
    statement: |
      Клиент отправляет контроль reasoning в `extra_body`
      (`reasoning_effort` для DeepSeek, `thinking.type='disabled'` для
      MiniMax) и никогда — в top-level: LiteLLM дропает top-level
      provider-специфичные поля.
  - id: token-budget-survives-reasoning
    statement: |
      `max_tokens` в теле запроса равен 4000, поэтому reasoning не
      съедает бюджет до `finish_reason=length` с пустым content.
  - id: errors-name-the-real-cause
    statement: |
      429 с признаками исчерпанного лимита провайдера («Token Plan /
      Insufficient Balance / quota») даёт сообщение «исчерпан лимит/
      баланс upstream-провайдера» с текстом провайдера и указанием,
      что повтор не поможет; прочие 429 — «rate limit от провайдера».
      Строка «rate-limited by proxy» в клиенте отсутствует.
  - id: empty-answer-is-explained
    statement: |
      Поток, в котором провайдер не отдал ни символа текста, падает с
      сообщением про `finish_reason=length` и израсходованный на
      размышления бюджет, а не как безликое «пустой ответ».
  - id: ui-labels-match-routing
    statement: |
      `MODEL_TIERS` в UI описывает текущую маршрутизацию прокси
      (`smart` → deepseek-v4-pro, `fast` → deepseek-flash) и не
      содержит устаревших MiniMax-подписей. Ревизия 2: подпись опции
      размышления «off» — «выкл», а не «min»: DeepSeek отключает
      reasoning на `reasoning_effort=none` (замер 2026-11-02).
  - id: precommit-green
    statement: |
      `cd ui && npm run test:precommit` (tsc strict + vitest +
      lint:no-console + validate:presets) завершается exit 0.
  - id: mathc-validate-clean
    statement: |
      `mathc validate decisions/wavecode-deepseek-upstream-adaptation.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.

