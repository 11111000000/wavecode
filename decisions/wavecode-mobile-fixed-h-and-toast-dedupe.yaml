assumptions:
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-1
    state: proven
    statement: |
      "Rendered .app-controls-row height = 59px на mobile, не 52px" Evidence: "playwright_browser_evaluate getBoundingClientRect на 412×900: controlsRow.bottom = 159, controlsRow.top = 100, height = 59. Computed padding: 6+6, не 4+4. CSS @media rule (max-width:720px) .app-controls-row { padding: 4px; } присутствует в components.css:3008-3011, но проигрывает non-media rule на строке 3018-3046 потому что source order: non-media идёт ПОСЛЕ @media, equal specificity → last wins. Token --controls-h: 52 (в tokens.css:131) тоже не отражает reality."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-2
    state: proven
    statement: |
      "Rendered .app-preset-row height = 36px на mobile, не 32px" Evidence: "playwright_browser_evaluate: presetRow.top = 56, bottom = 92, height = 36. Computed padding: 2+2 (mobile @media rule в components.css:3004-3007 + inline index.html rule). min-height 32 + padding 4 = 36."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-3
    state: proven
    statement: |
      "8px gap between presetRow (ends 92) and controlsRow (starts 100)" Evidence: "controlsRow.top = calc(var(--header-h) + var(--preset-row-h)) = 56 + 44 = 100 (--preset-row-h = 44px, см. tokens.css:130). Но presetRow actual = 36. Расхождение 8px → visual gap 8px."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-4
    state: proven
    statement: |
      "SampleLoader эмитит 3 'loaded' events для 3 банков (piano/drums/synth)" Evidence: "ui/src/infrastructure/audio/SampleLoader.ts:610 — `emit(state.loaded, state.total, 'loaded')` после каждого `await preloadAllBuffers`. state.total per-bank = 21/49/73. UI предыдущего поведения: 3 тоста «Сэмплы загружены N/N» подряд."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-5
    state: proven
    statement: |
      "vitest 5 pre-existing failures не от моих изменений" Evidence: "До изменений (baseline): 5 failed, 724 passed. После изменений: 5 failed, 724 passed. Failure list: uiState.test.ts setTab(mixer|status|step|piano) expects 'full' (получает 'half' после editor-max-sheet-half пакета, commit 1d51ee6) + loadStoredSheetHeight expects 340 (получает null — localStorage mock не инициализирован). Эти тесты — KNOWN issue из предыдущего пакета, не моя регрессия."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-6
    state: proven
    statement: |
      "Toast debounce тестом: 1 toast после 3 dispatched events" Evidence: "playwright_browser_evaluate dispatchEvent × 3 (21/21, 49/49, 73/73) → wait 2.2s → .toast-item count = 1, title «Сэмплы загружены», body «73/73 готовы к воспроизведению». До фикса было 3 тоста с bodies «21/21», «49/49», «73/73» соответственно."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-7
    state: proven
    statement: |
      "cm-host теперь полностью видим на mobile" Evidence: "playwright_browser_take_screenshot mobile-fixed-h-verify.jpeg: line 1 «// Creep (Radiohead) — G → B → C → Cm, indie-rock 4/4» и line 2 «stack(» обе полностью видимы сверху cm-host, нет overlap с controlsRow. До фикса screenshot показал бы обрезанную первую строку."
    owner: human:operator
  - id: wavecode-mobile-fixed-h-and-toast-dedupe-assumption-8
    state: proven
    statement: |
      "Desktop padding-top формула не сломана" Evidence: "playwright_browser_evaluate на 1280×800: .app-body paddingTop = '96px' (calc(44+52)). Mobile @media rule — max-width:720px, не применяется. Desktop uses line 2621 `padding-top: calc(var(--preset-row-h) + var(--controls-h))` — без изменений."
    owner: human:operator
