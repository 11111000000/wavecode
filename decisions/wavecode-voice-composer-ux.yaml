axiom_link:
  - A0
  - A3

intent: |
  Жалоба пользователя на голосовой ввод (2026-10-27): «Сейчас
  повторная запись не работает… вообще это всё работает при отправке
  в ИИ, и нет обратной связи: ушло не ушло, что оно крутится или
  нет. Остановить/отменить тоже непонятно как. И возможность
  отредактировать текст должна быть сразу как только он появляется
  — то есть вообще всегда текст в поле вводом, хотим отредактируем,
  тут же отменим текущую отправку и например отправим заново».

  Разбор кода (FSM `ui/src/domain/voice/voiceSession.ts`,
  оркестратор `ui/src/application/voice/VoiceAISession.ts`, стор
  `ui/src/presentation/state/voiceAIStore.ts`, панель
  `ui/src/presentation/components/RecordingPanel.tsx`) показал, что
  жалоба — не один баг, а следствие того, что у голосового ввода
  ДВА РАЗНЫХ лица в одном и том же месте:

  (1) **Текст редактируем только в одном состоянии.** Пока FSM в
      `listening`, панель показывала ТОЛЬКО ЧТЕНИЕ (`<span
      class="…__transcript">`), а `<textarea>` рендерилась лишь в
      состоянии `review`. Между ними — `transcribing`, `requesting`,
      `applying` — поля не было вовсе. Нажатие «→ В ИИ» переводило
      FSM в `requesting`, textarea размонтировалась, и ТЕКСТ
      ИСЧЕЗАЛ вместе с возможностью его поправить.

  (2) **Обратной связи нет.** `requesting`/`applying` отображались
      одной строкой текста («жду ответ ИИ…»), а по событию `applied`
      редуктор переходил в `idle` — панель исчезала целиком. Ни
      спиннера, ни «✓ применено», ни следа отправленного текста.
      Пользователь физически не мог отличить «ушло» от «не ушло» и
      «ещё крутится» от «зависло».

  (3) **«Отменить» было нечем.** Кнопка ✕ в голове панели
      вызывала `dismissVoiceAI` → `dispatch({type:'dismiss'})`, но
      редукер обрабатывал `dismiss` ТОЛЬКО из `paused` и `errored`.
      Из `listening`/`transcribing`/`requesting`/`applying`/`review`
      событие было no-op: микрофон освобождался, take выбрасывался,
      а FSM оставался ПИННУТЫМ в `listening` — панель продолжала
      считать секунды для сессии, которой больше нет. Выйти можно
      было только через mini-FAB, который тут же начинал новую
      запись, о которой никто не просил.

  (4) **«Повторная запись не работает».** В окне флаша (аудио уже
      ушло в распознаватель, транскрипт ещё не пришёл — на серверном
      реле это 16–32 с) mini-FAB находился в фазе `stopping`, и
      нажатие на него ПРОГЛАТЫВАЛОСЬ. Оркестратор умел дождаться
      дренажа и взять следующий take, но UI до него не допускал.

  (5) **Правки терялись.** Буфер жил локальным сигналом внутри
      компонента review-формы. Запись ещё раз → FSM уходит из
      `review` → форма размонтируется → правки пропали; при
      возврате в `review` поле перезаполнялось сырой расшифровкой.

  Итог: пользователь не мог ни поправить услышанное, ни понять,
  что происходит с его словами, ни остановить процесс, ни
  отправить второй раз. Это не «мелкая косметика» — это четыре
  отказа одного базового жеста.

commitment: |
  Голосовой ввод становится ОДНИМ композером: одно редактируемое
  поле, которое существует и редактируется в каждом состоянии
  сессии; строка статуса, которая в любой момент говорит, что
  именно делает приложение; кнопка отмены отправки, которая
  возвращает текст в поле; и состояние `sent`, в котором панель
  остаётся открытой с текстом, чтобы его можно было поправить и
  отправить заново.

counterexample: |
  «Текст и так редактируется — в состоянии `review` есть
  textarea, этого достаточно». Возражения: состояние `review`
  существует меньше секунды в happy path и недостижимо во время
  работы LLM. Пользователь, который правит распознанное, должен
  успеть это сделать — а править нечего, потому что половина
  времени поля на экране нет. «Достаточно» здесь означает «в
  остальных случаях — нет».

  «Спиннер и статусная строка — украшение, а не контракт».
  Возражения: панель — единственное место, где пользователь видит
  состояние машины. Если в нём написано «применяю правку…», а
  через секунду панель исчезает, у пользователя нет ни способа
  узнать, применилось ли, ни способа это отменить. Отсутствие
  обратной связи — это не «украшение», это отсутствие управления
  собственным действием.

  «`dismiss` не обрабатывался из активных состояний случайно —
  возможно, так задумано: закрыть панель должен только `idle`».
  Возражения: событие, на которое реагирует кнопка с подписью
  «закрыть», обязано закрывать. Иначе кнопка врёт: она освобождает
  микрофон, выбрасывает take и оставляет панель на экране с
  продолжающимся счётчиком — состояние, которого не существует.
  Проверка «событие не приводит ни к какому изменению ⇒ оно
  бессмысленно» и здесь выполняется: изменение есть, и оно ровно
  одно — FSM возвращается в `idle`.

antithesis: |
  (1) «Сделать поле всегда редактируемым — значит показать
      пользователю текст, который ещё не готов: полупустую
      расшифровку, пока распознаватель думает». Возражения: в
      живой расшифровке полно мусора, и его правка вручную бессмысленна.
      Но поле и не обязано быть «правимым» — оно обязано быть
      ДОСТУПНЫМ. Пользователь может стереть лишнее, может
      подготовить формулировку заранее, может исправить опечатку,
      которую уже видит. Право вмешаться — не право получить
      идеальный текст.

  (2) «Оставить панель открытой после отправки — значит она
      будет висеть над редактором и мешать работать». Возражения:
      панель и так висит над редактором во время записи. Разница
      в том, что после отправки у пользователя появляется выбор
      (закрыть ✕ / поправить и отправить снова), а без этого
      выбора панель просто исчезает. Кроме того, закрытие теперь
      явно: одна кнопка с подписью «Отменить запись и закрыть
      панель».

  (3) «Отмена отправки — это лишнее: LLM всё равно ответит, и
      правка применится». Возражения: `cancelSend` прерывает fiber
      маршрута ДО того, как он допишет score в редактор, поэтому
      отменённая отправка не применяется. Это ровно тот случай,
      где «пользователь ошибся» должно стоить дешевле, чем
      «композиция молча изменена».

