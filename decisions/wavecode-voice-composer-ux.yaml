outcomes:
  - id: one-field-always-editable
    statement: |
      `.voice-recording-panel__review-textarea` присутствует в DOM
      и не disabled во всех состояниях голосового ввода (`arming`,
      `listening`, `transcribing`, `review`, `requesting`,
      `applying`, `sent`, `errored`). Текст, который пришёл от
      распознавателя, попадает в поле сразу, а после того как
      пользователь что-то в нём напечатал, распознаватель больше
      не переписывает поле (`voiceAIDraftDirty`).
  - id: status-line-never-silent
    statement: |
      `.voice-recording-panel__status-text` показывает ровно одну
      фразу на состояние: «Готовлю микрофон…», «Записываю… N с»,
      «Распознаю…», «Текст готов — правьте и отправляйте»,
      «Отправляю в ИИ…», «Применяю правку…»,
      «✓ Правка применена — можно отправить заново»,
      «Запись на паузе…» или текст ошибки. Спиннер
      (`.voice-recording-panel__spinner`) появляется ровно в тех
      состояниях, где приложение ждёт не пользователя
      (`requesting`, `applying`, `transcribing`, флаш).
  - id: cancel-and-resend
    statement: |
      Пока запрос в проводе (`requesting`/`applying`), первичная
      кнопка панели — «Отменить отправку»: fiber маршрута
      прерывается, FSM возвращается в `review`, текст остаётся в
      поле. После успешной отправки FSM приходит в новое состояние
      `sent`: панель остаётся открытой с тем же текстом, который
      можно править и отправить снова (`send-review` из `sent`).
  - id: dismiss-works-everywhere
    statement: |
      `dismiss` — wildcard-переход редукера: из любого активного
      состояния он даёт `idle`. Кнопка ✕ в голове панели поэтому
      реально закрывает панель (а не «останавливает запись»
      в одних состояниях, «отменяет отправку» в других и «ничего»
      в третьих). Остановить запись, оставив текст, — отдельная
      кнопка ●REC в теле панели.
  - id: second-take-is-not-swallowed
    statement: |
      Нажатие на mini-FAB в окне флаша (аудио ушло, транскрипт ещё
      не пришёл) больше не игнорируется: фаза `stopping` переименована
      в `busy`, и нажатие запускает следующий take — оркестратор
      дожидается дренажа сам (`drainRef`).
  - id: buffer-lives-in-the-store
    statement: |
      Буфер (то, что видит пользователь и что уходит в LLM) живёт в
      `voiceAIStore` как `voiceAIDraft` + `voiceAIDraftDirty`, а не
      в локальном сигнале компонента и не в FSM. Он переживает
      размонтирование панели (переключение на режим свиста) и все
      переходы FSM; новый take с пустым буфером отличает «продолжить
      take» от «начать заново» (`continuesCurrentTake`).

obligations:
  - id: field-present-in-every-state
    claim: |
      `RecordingPanel.test.tsx` параметризованным тестом проверяет
      наличие `.voice-recording-panel__review-textarea` без
      `readonly`/`disabled` в восьми состояниях FSM.
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: status-phrase-per-state
    claim: |
      `RecordingPanel.test.tsx` проверяет фразу статусной строки в
      каждом состоянии (`arming` → «Готовлю микрофон…», `listening` →
      «Записываю», `review` → «Текст готов», `requesting` →
      «Отправляю», `applying` → «Применяю», `sent` → «Правка
      применена») и наличие спиннера только в «ждущих» состояниях.
    acceptance:
      all:
        - verifier: vitest-run-recording-panel
          result: pass
  - id: dismiss-wildcard-tested
    claim: |
      `voiceSession.test.ts` параметризованным тестом проверяет
      `dismiss → idle` из девяти активных состояний.
    acceptance:
      all:
        - verifier: vitest-run-voice-session
          result: pass
  - id: cancel-send-tested
    claim: |
      `VoiceAISession.test.ts` проверяет, что `cancelSend` во время
      висящего маршрута возвращает FSM в `review` с текстом, и
      что из `sent` текст можно отправить снова (второй вызов LLM).
    acceptance:
      all:
        - verifier: vitest-run-voice-ai-session
          result: pass
  - id: buffer-rules-tested
    claim: |
      `voiceAIStore.test.ts` проверяет: буфер зеркалит расшифровку;
      `final` и `interim` соединяются (две фразы в одной сессии не
      теряются); правка пользователя не перезаписывается
      распознавателем; «Очистить» не даёт распознавателю вернуть
      текст; новый take обнуляет буфер, а продолженный — нет.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-store
          result: pass
  - id: second-take-press-tested
    claim: |
      `VoiceAIMiniFAB.test.tsx` проверяет, что нажатие в окне флаша
      вызывает `start` (а не игнорируется) — это регрессия
      «повторная запись не работает».
    acceptance:
      all:
        - verifier: vitest-run-voice-ai-mini-fab
          result: pass
  - id: gate-green
    claim: |
      `npm run test:precommit` (tsc --noEmit + vitest +
      eslint lint:no-console + validate:presets) завершается
      exit 0; `npx vite build` exit 0.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
        - verifier: pnpm-ui-lint
          result: pass
  - id: mathc-validate-clean
    claim: |
      `mathc validate decisions/wavecode-voice-composer-ux.yaml`
      завершается exit 0 без `MC-*` reject-диагностик.
    acceptance:
      all:
        - verifier: mathc validate
          result: pass

risk:
  declared_triggers:
    - the-panel-stays-open-after-every-send-and-covers-the-transport-bar
    - the-buffer-survives-a-take-the-user-meant-to-discard
    - the-recogniser-keeps-writing-into-a-field-the-user-is-editing
    - the-cancel-button-is-read-as-a-second-send-button
    - the-sent-state-makes-the-next-fab-press-look-like-a-reset
  owner: human:operator

reversal:
  - signal: the-panel-blocks-the-editor-on-small-screens
    action: revert
  - signal: users-cannot-find-the-send-button-because-it-changes-label
    action: halt

