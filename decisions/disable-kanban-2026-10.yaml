risk:
  declared_triggers:
    - id: lost-cross-agent-visibility
      description: |
        Tasks that previously flowed through the kanban board become
        invisible to other agents running concurrently in different
        sessions. Mitigation: the kanban server and MCP tools remain
        live; if visibility is needed, agents can opt-in on a per-task
        basis when explicitly asked by the user.
    - id: user-explicit-asks-kanban-mid-task
      description: |
        The user asks an agent mid-task to "post progress to kanban"
        or "claim task #N". Mitigation: per commitment #2, agents may
        call `mcp_kanban_*` on explicit per-task request without
        re-enabling the default workflow.
    - id: accidental-reintroduction
      description: |
        A future agent (or human) re-pastes the old kanban section
        into AGENTS.md from a copy-paste source. Mitigation: this
        decision file's `obligations[0]` provides a verifiable
        constraint that rejects reintroduction without a new
        decision (state transition `retired` → superseded).
  owner: human:operator

reversal:
  - signal: user-explicitly-asks-to-re-enable-kanban
    action: |
      File a new decision (`decisions/re-enable-kanban-<date>.yaml`)
      with `relations.supersedes: disable-kanban-2026-10@1`,
      transition this decision's `state` to `superseded`, and
      restore the AGENTS.md kanban section (or a successor).
  - signal: kanban-removal-blocks-cross-session-workflow
    action: |
      Investigate; likely outcome is to scope kanban per-task rather
      than revert wholesale. Update this decision via revision.

counterexample: |
  "The kanban board provided structured progress visibility that the
  chat alone does not: every commit, error, and artifact was a discrete
  post_progress event with a status timeline. Removing it loses that
  structure for the operator."

  Counterargument: the same structure is already available via git
  (`git log --oneline -20`, `git diff`, branch names) and via the
  `decisions/*.yaml` kernel. The chat-thread IS the session timeline;
  the operator reads it. The kanban-mediated timeline was a parallel
  write-log to a third system that required agents to remember to
  post_progress at every step — a non-trivial compliance cost for a
  single-operator solo project where the same information was already
  in the chat and in git.

antithesis: |
  "Keep agent-kanban as the source of truth for AI-agent tasks in
  wavecode. The post-progress / request-review / complete ritual
  forces structured updates and gives a kanban.kosov.online URL
  the operator can share."

  Rejected because:
  (a) The user explicitly asked to disable kanban in this repo;
      user preference is the strongest signal here.
  (b) For a single-operator solo project, the operator is the chat
      session and already sees progress in real time without a
      secondary write surface.
  (c) The four-step ritual (claim → post_progress → request_review →
      complete) added latency between commits and operator visibility
      for no observable benefit.
  (d) The kanban board still exists and can be opted into per-task;
      this decision disables the default, not the capability.

  Alternatives considered and rejected:
  - "Keep kanban but make it optional in AGENTS.md." — equivalent
    in outcome to this decision, but bloats AGENTS.md with a long
    "use kanban IF user requests" section. Cleaner to default off.
  - "Move kanban instructions to a separate skill file." — still
    exposes agents to the workflow and re-introduces the same
    compliance cost. Not worth it.

