intent: |
  Stop using the agent-kanban MCP server (https://kanban.kosov.online)
  as the workflow surface for AI-agent work in wavecode. AI agents
  operating in this repo no longer claim / post_progress / request_review
  / complete tasks via the kanban board by default. Direct user↔agent
  conversation replaces the kanban-mediated task state machine.

  This is a workflow-policy decision, not a code/architecture one: the
  change touches `AGENTS.md` (instructions to agents) and adds this
  decision file under `decisions/`. The kanban server, MCP endpoint,
  bearer token, and `wavecode-kanban` skill all remain in place at the
  server / operator level (in `~/Projects/AngaraConfig/`) but are
  inactive for wavecode.

commitment: |
  1. `AGENTS.md` no longer contains a "Kanban (agent-kanban) — ОБЯЗАТЕЛЬНО
     для всех AI-агентов" section, nor any project-instructions text
     referring to `mcp_kanban_*`, `KANBAN_BEARER`, or the `wavecode-kanban`
     skill (case-insensitive match against the project-instructions
     section).
  2. AI agents operating in this repo do not call `mcp_kanban_*` tools
     by default. Calling them is permitted only on explicit per-task
     user request ("use kanban for this task").
  3. The `wavecode-kanban` skill is not loaded by default; it is loaded
     only if the user explicitly asks the agent to use kanban.
  4. Server-level kanban configuration (MCP server entry, bearer token,
     kanban-nginx config) is left intact outside this repo's scope; the
     disabling is purely a wavecode-side policy change.

