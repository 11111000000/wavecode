counterexample: |
  "Проще всего отдать playheadу фазу из самого планировщика: Strudel
   знает, что играет — пусть он и рисует стрелку."

  Возражение: у Strudel нет понятия «позиция внутри паттерна» —
  паттерн бесконечен, и его API отдаёт только абсолютные координаты
  хапов. Фазу приходится считать, а считать её можно двумя
  способами: по структуре скорба (AST) или эмпирически, сравнивая
  хапы цикла N с циклом 0. Эмпирический способ врёт на
  самоподобных паттернах (`cat([x, x])` — период определится как 1
  вместо 2), а AST-способ считает период ровно так же, как
  нарисованные ноты, — то есть playhead гарантированно не может
  указать на несуществующий такт. Поэтому AST.

antithesis: |
  "Не трогать движок: добавить в presentation-слой второй
   таймер, который сам считает доли цикла по `cps`."

  Отклонено: presentation-слой не знает ни момента старта eval, ни
  текущего `cps`, ни того, что паттерн замедлен `.slow(1.3)`.
  Свой таймер в UI — это вторая копия часов движка, которая
  разъедется с ним при первой же смене темпа или hot-swap. Часы
  принадлежат движку; presentation получает от них число и сам
  решает, как его нарисовать.

