intent: |
  Piano roll — это «диаграмма-гант» по нотам: слева направо такты,
  снизу вверх высоты. Пока играет композиция, по ганту должна идти
  линия playhead, чтобы видеть, ГДЕ сейчас звучит мелодия.

  Эта линия была намертво прибита к первому такту: при любой
  композиции длиннее одного такта она ездила по первому бару туда-
  сюда, пока музыка играла дальше. Причина — не в Strudel и не в
  отрисовке, а в подмене величин: RAF-цикл брал у движка
  `getCycleProgress()`, который по контракту возвращает ДОЛЮ внутри
  текущего цикла (0..1 — так удобно степ-секвенсору), а рисовал её
  как АБСОЛУТНЫЙ номер такта. Позиция физически не могла выйти за
  пределы первого такта.

axiom_link:
  - A0
  - A1
  - A3

commitment: |
  1. Playhead движка читает АБСОЛУТНУЮ позицию планировщика
     (`AudioEngine.getCyclePosition()` — счётчик циклов, который
     продолжает расти, пока паттерн повторяется), а не долю внутри
     текущего цикла.
  2. Абсолютная позиция переводится в такты САМОГО скорба:
     делится на глобальный масштаб времени (`.slow(f)` замедляет
     паттерн — такты идут медленнее) и заворачивается по длине
     одной репетиции паттерна. Обе величины считаются из того же
     AST, по которому нарисованы ноты, — playhead и ноты живут в
     одной системе координат и не могут разойтись.
  3. Подсветка играющей ноты использует ту же фазу: подсвечивается
     та нота, которая звучит СЕЙЧАС, в любом месте таймлайна (а не
     только в первом такте).
  4. Ось X начинается с фазы 0 паттерна (первый такт репетиции) и
     заканчивается на один такт после последнего — запас справа, в
     который playhead не уезжает.
  5. `getCycleProgress()` сохраняет контракт 0..1: StepGrid,
     MelodyGrid и TransportPanel завязаны именно на долю внутри
     текущего цикла. Новый метод — отдельный, с явным именем.
  6. Время масштабирования читается только с верхнего уровня скорба:
     `.slow()` внутри ветки `stack` относится к этой ветке, и
     нарисованная модель её тоже не растягивает.

outcomes:
  - id: playhead-crosses-the-timeline
    statement: |
      На многобарной композиции playhead идёт слева направо по всем
      тактам репетиции и возвращается на первый такт, когда паттерн
      повторяется.
  - id: sounding-note-is-highlighted
    statement: |
      Подсвечивается нота, которая звучит в данный момент, в любом
      месте таймлайна.
  - id: slowed-score-stays-in-sync
    statement: |
      Для скорба с `.slow(f)` playhead движется в f раз медленнее
      тактовscheduler'а — визуально он остаётся на тех нотах, которые
      слышны.
  - id: fraction-contract-untouched
    statement: |
      `AudioEngine.getCycleProgress()` по-прежнему возвращает долю
      внутри текущего цикла (0..1) — потребители степ-секвенсора не
      затронуты.

