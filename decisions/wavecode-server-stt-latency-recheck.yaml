    - "ui/dist/**"
    - "ui/src/domain/**"

outcomes:
  - id: release-stops-the-take
    statement: |
      Отпускание кнопки голоса гарантированно останавливает take.
      Локальный press-FSM больше не сбрасывается в `idle` на
      устаревшем чтении `voiceAIState().tag` (ленч `sessionStarted`),
      а `onPointerUp` спрашивает оркестратор, а не зеркало.
      До фикса: `data-press="idle"` при `voiceAIState().tag ===
      'listening'`, ноль вызовов `stopVoiceAI` после отпускания —
      микрофон оставался открытым, `MediaRecorder` писал дальше,
      счётчик секунд тикал после отпускания, текст не появлялся.
  - id: budgets-outlive-the-relay
    statement: |
      `SERVER_ENGINE_SILENCE_SEC` 20 → 60, `DRAIN_MAX_MS` 12_000 →
      60_000, `FLUSH_WAIT_MAX_MS` 10_000 → 60_000: каждый перекрывает
      измеренную задержку релея (15.8–17.1 s тёплый прогон, 32.2 s под
      очередью ретраев) с запасом на один вложенный round-trip.
  - id: watchdog-stands-down-mid-flush
    statement: |
      Watchdog тишины не срабатывает, пока `voiceAIFlushing()` — флаш
      по отпусканию намеренно держит FSM в `listening` с пустым
      буфером (это и рисует «распознаю…»), то есть движок отвечает,
      а не молчит.
  - id: interim-ticks-cost-one-round-trip
    statement: |
      Первый interim-тик возможен не раньше `TICK_MIN_ELAPSED_MS =
      10_000` от старта take, далее раз в `TICK_MS = 10_000`. Короткая
      фраза доходит до сервера ровно один раз — по отпусканию, — вместо
      того чтобы ждать за своим же тиком.
  - id: no-console-in-changed-layers
    statement: |
      `npm run lint:no-console` (правило `no-console: error` над
      `src/domain` и `src/application`) проходит: все диагностические
      сообщения идут через `logger.push` / `consoleStore.pushToast`.

obligations:
  - id: release-test-covers-production-fsm-shape
    claim: |
      `VoiceAIMiniFAB.test.tsx` содержит тест, который ставит настоящий
      handle через `__setVoiceAIHandleForTests`, публикует `listening`
      через `__publishVoiceAIStateForTests` и проверяет, что
      `data-press` равен `holding` до отпускания, а после `pointerup`
      `stop` вызван ровно один раз и `voiceAIPanelArmed()` равен
      `false`. Без фикса этот тест падает с
      `expected 'idle' to be 'holding'` — проверено откатом компонента.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-mini-fab
          result: pass
  - id: watchdog-bound-is-measured-not-guessed
    claim: |
      `voiceAIStore.test.ts` дублирует `SERVER_ENGINE_SILENCE_SEC`
      литералом и проверяет, что FSM жива через 32 s (худший
      измеренный round-trip), а умирает после 60 s. Watchdog,
      который обвиняет движок раньше его собственного ответа,
      запрещён.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-store
          result: pass
  - id: flush-silences-watchdog
    claim: |
      `voiceAIStore.test.ts` содержит тест с handle, чей `stop`
      никогда не резолвится (модель round-trip на 30 s): при
      `voiceAIFlushing() === true` watchdog не переводит FSM в
      `errored` даже после 120 s.
    acceptance:
      all:
        - verifier: vitest-run-voiceai-store
          result: pass
  - id: tick-gate-mirrored-in-tests
    claim: |
      `ServerWhisperSTT.test.ts` дублирует `TICK_MIN_ELAPSED_MS` и
      `TICK_MS` литералами, и тест interim-тика проверяет, что POST
      не уходит раньше `TICK_MIN_ELAPSED_MS + 100`. Расхождение
      константы с тестом обязано быть видно как правка, а не
      поглощаться.
    acceptance:
      all:
        - verifier: vitest-run-server-whisper-stt
          result: pass
  - id: stale-latency-claims-are-gone
    claim: |
      Ни один из файлов `ServerWhisperSTT.ts`, `voiceAIStore.ts`,
      `VoiceAISession.ts`, `RecordingPanel.tsx` не предъявляет
      старую цифру как текущую. Упоминания «2.6-5.2 s» остались
      ровно в трёх местах и все три помечены как исторические
      («the old note claimed», «The previous bound here was 20 s,
      written against», «was written against») — то есть цифра
      названа, чтобы объяснить, почему бюджет сдвинули, а не чтобы
      оправдать текущее поведение. Цифры «5-9 s» в этих файлах не
      осталось вовсе.
    acceptance:
      all:
        - verifier: text-scan-no-stale-stt-latency-claim
          result: pass
  - id: gate-green
    claim: |
      `npm run typecheck`, `npm run lint:no-console` и
      `npm run validate:presets` завершаются exit 0; 140 тестов
      голосового/STT контура зелёные.
    acceptance:
      all:
        - verifier: pnpm-ui-typecheck
          result: pass
        - verifier: pnpm-ui-lint
          result: pass

