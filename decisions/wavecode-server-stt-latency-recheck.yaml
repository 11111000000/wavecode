axiom_link:
  - A0
  - A3

intent: |
  Клиентский голосовой путь перестанет сообщать «движок распознавания
  сломан» о медленном, но исправном whisper-релее, и перестанет
  выбрасывать расшифровку, которая была в полёте. Фактическая
  задержка релея пере-измерена (2026-10-23) и больше не совпадает с
  цифрой «2.6–5.2 s», на которую были написаны все клиентские
  бюджеты: 1-секундный клип — 17.1 s, 3-секундный — 15.8–16.6 s,
  take с телефона — 32.2 s.

commitment: |
  Ни один клиентский таймаут голосового пути не может сработать раньше
  измеренной задержки релея, и ни один из них не имеет права выбросить
  расшифровку, которая ещё в полёте. Сама задержка релее — серверная
  проблема (модель, потоки, окно энкодера), и она этим пакетом не
  решается: клиент перестаёт стрелять в неё, а не чинит её.

counterexample: |
  «Таймаут — это страховка от зависшего движка, страшно его убирать».
  Возражения: страховка есть, и она осталась — 60 s против
  измеренного максимума 32.2 s. Но пока она была 20 s (а
  `FLUSH_WAIT_MAX_MS` 10 s, `DRAIN_MAX_MS` 12 s), она срабатывала на
  КАЖДОМ здоровом take: на 20-й секунде watchdog переводил FSM в
  `errored`, а расшифровка приходила на 32-й и попадала в мёртвое
  состояние. Страховка, которая стреляет по всем проходящим, хуже её
  отсутствия — она сообщает пользователю ложь.

  «Раз whisper медленный — вернуть облачный Web Speech, он даёт
  части за 1–2 s». Возражения: этот вариант уже отвергнут в
  `wavecode-server-stt@1` по приватности (Chrome отправляет аудио в
  Google), и он же объясняет, почему backend по умолчанию —
  `server`. Переизмерение задержки не переигрывает тот довод.

  «Просто переписать 5-9 s на 17 s в комментариях и оставить цифры
  в коде». Возражения: комментарии — не исполняемый код, а бюджеты
  в коде и есть то, что ломало пользователя. Замена только в
  прозе оставила бы те же 20/10/12 секунд и тот же баг.

  «Не трогать `TICK_MS`, пусть interim-тики стримят раньше».
  Возражения: тик, поднятый на 2.5-й секунде, занимает единственный
  слот релея на ~16 s, и release-flush выстраивается в очередь за
  ним. Короткая фраза платила два round-trip за одну фразу — либо
  теряла флаш. Interim-стриминг на релее, которое не укладывается в
  удержание кнопки, не даёт ничего.

antithesis: |
  «Поднять бюджеты до 60 s и считать, что задача закрыта».
  Возражения: это делает голосовой ввод пригодным и неубийственным,
  но не делает его быстрым. Пользователь по-прежнему ждёт ~16–32 s
  до первого слова. Это снимает ложное сообщение об ошибке, но не
  создаёт ту UX, ради которой фича и делалась; настоящее лечение —
  серверное (модель `ggml-base-q5_1`, 4 vCPU QEMU без GPU, фиксированное
  30-секундное окно энкодера whisper.cpp). Этот пакет честно
  объявляет, что закрывает только половину.

  «Оставить watchdog на 20 s — раньше пользователь хотя бы понимал,
  что что-то идёт не так». Возражения: он понимал неверно. Он
  получал «Не удалось получить текст от движка распознавания» и
  правил микрофон, которого никто не сломал.

