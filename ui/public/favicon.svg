<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1"   stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0a0a0e" stroke="url(#bg)" stroke-width="1.6"/>
  <path d="M8 24 L11 24 L13 14 L15 34 L17 18 L20 30 L22 24 L25 24" stroke="url(#bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <circle cx="32" cy="24" r="2.6" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="38" y="20" width="2" height="8" rx="0.6" fill="#f472b6" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.0s" repeatCount="indefinite"/>
  </rect>
</svg>
