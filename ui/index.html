<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="wavecode" />

    <title>wavecode · live-coding · AI · Strudel</title>

    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <style>
      :root {
        --bg-base: #0c0d0e;
        --fg: #f4a62b;
        --fg-dim: #b8801e;
        --amber: #ffb547;
        --amber-glow: rgba(255, 181, 71, 0.45);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-base);
        color: var(--fg);
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        font-size: 13px;
        overflow: hidden;
      }
      #root { height: 100%; }

      .boot-screen {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-shadow: 0 0 8px var(--amber-glow);
      }
      .boot-screen .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--amber);
      }
      .boot-screen .tagline {
        font-size: 11px;
        color: var(--fg-dim);
        letter-spacing: 0.08em;
        text-transform: lowercase;
      }
      .boot-screen .bar {
        font-size: 12px;
        color: var(--amber);
        font-family: inherit;
        letter-spacing: 0.06em;
      }
      .boot-screen .bar .dot {
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink {
        to { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="logo">∿∿∿ wavecode</div>
        <div class="tagline">live-coding · ai · strudel</div>
        <div class="bar">boot 1.0 [▓▓▓░░░]<span class="dot">_</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
