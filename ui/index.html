<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="wavecode" />

    <title>wavecode · live-coding music · AI · Strudel</title>
    <meta name="description" content="wavecode — браузерный live-coding инструмент для музыки с AI-агентом. Pure-frontend SPA. Strudel mini-notation + Web Audio API + LLM tool-calling." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <style>
      /* ===== CRITICAL: design tokens (≈3KB) =====
       * Inline to keep FCP fast on throttled 4G. Дублирующиеся правила
       * в bundled index.css перебиваются inline (source order: inline
       * идёт раньше, Vite-бандл применяется после). Подмножество —
       * только то, что читают topbar + preset-row + audio-loading-pill. */
      :root {
        --surface-0:  #0a0a0e;
        --surface-1:  #11121a;
        --surface-2:  #181a25;
        --surface-3:  #1f2230;
        --bg:         var(--surface-0);
        --fg:         #f4f4f5;
        --fg-dim:     #a1a1aa;
        --fg-ghost:   #52525b;
        --fg-inverse: #0a0a0e;
        --amber:      #ffaa3b;
        --amber-soft: rgba(255, 170, 59, 0.14);
        --amber-glow: rgba(255, 170, 59, 0.45);
        --cyan:       #5eead4;
        --cyan-soft:  rgba(94, 234, 212, 0.14);
        --magenta:    #f472b6;
        --border:        #27272a;
        --border-strong: #3f3f46;
        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-pill: 999px;
        --fs-2xs: 10px;
        --fs-xs:  11px;
        --fs-sm:  12px;
        --fs-md:  13px;
        --ls-tight: -0.02em;
        --ls-wide:  0.04em;
        --space-2xs: 4px;
        --space-xs:  6px;
        --space-sm:  8px;
        --space-md:  12px;
        --space-lg:  16px;
        --fw-medium:   500;
        --fw-semibold: 600;
        --font-sans: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'Geist Mono', 'JetBrains Mono', monospace;
        --font-display: 'Geist', var(--font-sans);
        --header-h:     56px;
        --tabbar-h:     60px;
        --touch-target: 44px;
        --control-h:    32px;
        --safe-top:     env(safe-area-inset-top, 0);
        --safe-bottom:  env(safe-area-inset-bottom, 0);
        --z-sheet: 40;
        --shadow-glow-amber: 0 0 12px var(--amber-glow);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      #root { height: 100%; }

      /* ===== CRITICAL: boot loader (пока не подгрузился Solid) ===== */
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(255, 170, 59, 0.08), transparent 50%),
          radial-gradient(ellipse at 70% 80%, rgba(94, 234, 212, 0.06), transparent 50%),
          var(--bg);
      }
      .boot .logo {
        filter: drop-shadow(0 0 16px rgba(255, 170, 59, 0.25));
      }
      .boot .word {
        font-size: 32px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: -0.04em;
        font-family: 'Geist', system-ui, sans-serif;
      }
      .boot .tagline {
        font-size: 11px;
        color: var(--fg-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: 'Geist Mono', monospace;
      }
      .boot .bar {
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        color: var(--amber);
        letter-spacing: 0.06em;
        margin-top: 8px;
      }
      .boot .bar .dot {
        display: inline-block;
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }

      /* ===== CRITICAL: topbar (виден сразу после mount) ===== */
      .wc-topbar {
        position: sticky;
        top: 0;
        z-index: calc(var(--z-sheet) + 5);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        height: var(--header-h);
        padding: 0 var(--space-md);
        background: rgba(10, 10, 14, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--border);
      }
      .wc-topbar__title {
        font-family: var(--font-display);
        font-size: var(--fs-md);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-tight);
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wc-topbar__logo {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--amber);
        text-shadow: 0 0 6px var(--amber-glow);
        letter-spacing: var(--ls-wide);
        margin-right: var(--space-xs);
      }
      .wc-topbar__actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .wc-topbar__led {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: 0 var(--space-md);
        height: 32px;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: var(--fs-xs);
        color: var(--fg);
        font-family: var(--font-mono);
        white-space: nowrap;
      }
      .wc-icon-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--touch-target);
        height: var(--touch-target);
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        color: var(--fg-dim);
        cursor: pointer;
        flex-shrink: 0;
      }
      .wc-icon-btn[data-active='true'] { color: var(--amber); }

      /* ===== CRITICAL: preset-row + chips (сразу под topbar) ===== */
      .app-preset-row {
        display: flex;
        gap: var(--space-xs);
        align-items: center;
        flex-wrap: wrap;
        position: relative;
        z-index: calc(var(--z-sheet) + 5);
      }
      .preset-select {
        min-height: var(--control-h);
        padding: 0 var(--space-lg) 0 var(--space-md);
        font-family: var(--font-sans);
        font-size: var(--fs-sm);
        color: var(--fg);
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }
      .wc-chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        height: 24px;
        padding: 0 var(--space-sm);
        font-size: var(--fs-xs);
        font-weight: var(--fw-medium);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      .wc-chip[data-active='true'] {
        background: var(--amber);
        color: var(--fg-inverse);
        border-color: var(--amber);
      }

      /* ===== CRITICAL: audio loading pill (sample preload feedback) ===== */
      .audio-loading-pill {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2xs);
        padding: 2px var(--space-xs);
        background: var(--amber-soft);
        color: var(--amber);
        border: 1px solid var(--amber);
        border-radius: var(--radius-pill);
        font-family: var(--font-mono);
        font-size: var(--fs-2xs);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-wide);
        text-transform: lowercase;
        animation: audio-loading-pulse 1.5s ease-in-out infinite;
      }
      @keyframes audio-loading-pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="logo" width="240" height="80" viewBox="0 0 48 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0"   stop-color="#ffaa3b"/>
              <stop offset="0.5" stop-color="#5eead4"/>
              <stop offset="1"   stop-color="#f472b6"/>
            </linearGradient>
          </defs>
          <path d="M2 8 L4 8 L5 4 L6 12 L7 5 L8 11 L9 8 L11 8" stroke="url(#bg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="14" cy="8" r="1.4" fill="#ffaa3b">
            <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <path d="M17 8 L19 8 L20 5 L21 11 L22 8 L24 8" stroke="url(#bg)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
          <rect x="26" y="6" width="1.6" height="4" fill="#f472b6">
            <animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/>
          </rect>
          <path d="M30 8 L32 6 M30 8 L32 10" stroke="#a1a1aa" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
          <rect x="34" y="4.5" width="2" height="7" stroke="#5eead4" stroke-width="0.9" fill="none" opacity="0.7">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
          </rect>
          <g font-family="monospace" font-size="3.4" fill="#a1a1aa" opacity="0.65">
            <text x="38" y="11.5">wc</text>
          </g>
          <circle cx="2"  cy="2"  r="0.4" fill="#52525b"/>
          <circle cx="46" cy="2"  r="0.4" fill="#52525b"/>
          <circle cx="2"  cy="14" r="0.4" fill="#52525b"/>
          <circle cx="46" cy="14" r="0.4" fill="#52525b"/>
        </svg>
        <div class="word">wavecode</div>
        <div class="tagline">live-coding · ai · strudel</div>
        <div class="bar">loading<span style="color:var(--cyan)"> [▓▓▓▓░░]</span><span class="dot" style="color:var(--magenta)">_</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
