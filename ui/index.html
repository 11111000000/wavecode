<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="wavecode" />

    <title>wavecode · live-coding · AI · Strudel</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <style>
      /* ===== CRITICAL: design tokens (≈3KB) =====
       * Inline to keep FCP fast on throttled 4G. Дублирующиеся правила
       * в bundled index.css перебиваются inline (source order: inline
       * идёт раньше, Vite-бандл применяется после). Подмножество —
       * только то, что читают topbar + preset-row + audio-loading-pill. */
      :root {
        --surface-0:  #0a0a0e;
        --surface-1:  #11121a;
        --surface-2:  #181a25;
        --surface-3:  #1f2230;
        --bg:         var(--surface-0);
        --fg:         #f4f4f5;
        --fg-dim:     #a1a1aa;
        --fg-ghost:   #52525b;
        --fg-inverse: #0a0a0e;
        --amber:      #ffaa3b;
        --amber-soft: rgba(255, 170, 59, 0.14);
        --amber-glow: rgba(255, 170, 59, 0.45);
        --cyan:       #5eead4;
        --cyan-soft:  rgba(94, 234, 212, 0.14);
        --magenta:    #f472b6;
        --border:        #27272a;
        --border-strong: #3f3f46;
        --radius-xs: 4px;
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-pill: 999px;
        --fs-2xs: 10px;
        --fs-xs:  11px;
        --fs-sm:  12px;
        --fs-md:  13px;
        --ls-tight: -0.02em;
        --ls-wide:  0.04em;
        --space-2xs: 4px;
        --space-xs:  6px;
        --space-sm:  8px;
        --space-md:  12px;
        --space-lg:  16px;
        --fw-medium:   500;
        --fw-semibold: 600;
        --font-sans: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'Geist Mono', 'JetBrains Mono', monospace;
        --font-display: 'Geist', var(--font-sans);
        --header-h:     56px;
        --tabbar-h:     60px;
        --touch-target: 44px;
        --control-h:    32px;
        --safe-top:     env(safe-area-inset-top, 0);
        --safe-bottom:  env(safe-area-inset-bottom, 0);
        --z-sheet: 40;
        --shadow-glow-amber: 0 0 12px var(--amber-glow);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      #root { height: 100%; }

      /* ===== CRITICAL: boot loader (пока не подгрузился Solid) ===== */
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(255, 170, 59, 0.08), transparent 50%),
          radial-gradient(ellipse at 70% 80%, rgba(94, 234, 212, 0.06), transparent 50%),
          var(--bg);
      }
      .boot .logo {
        filter: drop-shadow(0 0 16px rgba(255, 170, 59, 0.25));
      }
      .boot .word {
        font-size: 32px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: -0.04em;
        font-family: 'Geist', system-ui, sans-serif;
      }
      .boot .tagline {
        font-size: 11px;
        color: var(--fg-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: 'Geist Mono', monospace;
      }
      .boot .bar {
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        color: var(--amber);
        letter-spacing: 0.06em;
        margin-top: 8px;
      }
      .boot .bar .dot {
        display: inline-block;
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }

      /* ===== CRITICAL: topbar (виден сразу после mount) ===== */
      .wc-topbar {
        position: sticky;
        top: 0;
        z-index: calc(var(--z-sheet) + 5);
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        height: var(--header-h);
        padding: 0 var(--space-md);
        background: rgba(10, 10, 14, 0.85);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--border);
      }
      .wc-topbar__title {
        font-family: var(--font-display);
        font-size: var(--fs-md);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-tight);
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wc-topbar__logo {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--amber);
        text-shadow: 0 0 6px var(--amber-glow);
        letter-spacing: var(--ls-wide);
        margin-right: var(--space-xs);
      }
      .wc-topbar__actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--space-xs);
      }
      .wc-topbar__led {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        padding: 0 var(--space-md);
        height: 32px;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: var(--fs-xs);
        color: var(--fg);
        font-family: var(--font-mono);
        white-space: nowrap;
      }
      .wc-icon-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--touch-target);
        height: var(--touch-target);
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        color: var(--fg-dim);
        cursor: pointer;
        flex-shrink: 0;
      }
      .wc-icon-btn[data-active='true'] { color: var(--amber); }

      /* ===== CRITICAL: transport-bar + chips (сразу под topbar) =====
       *
       * wavecode-mobile-transport-bar: .app-preset-row + .app-controls-row
       * слиты в один .app-transport-bar (collapsible). Un-layered inline
       * имеет приоритет над @layer components в bundled CSS, поэтому
       * эту копию нужно держать в синхроне с src/styles/components.css. */
      .app-transport-bar {
        position: fixed;
        top: var(--header-h);
        left: 0;
        right: 0;
        z-index: calc(var(--z-sheet) + 12);
        display: flex;
        flex-direction: column;
        background: rgba(10, 10, 14, 0.92);
        backdrop-filter: blur(12px) saturate(160%);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        border-top: 1px solid var(--border);
      }
      .app-transport-bar[data-collapsed='true'] .app-transport-bar__body {
        display: none;
      }
      @media (max-width: 720px) {
        .app-transport-bar__toggle-label {
          display: none;
        }
        .app-body[data-transport-collapsed='true'] {
          padding-top: var(--app-transport-h-collapsed) !important;
        }
        .app-body[data-transport-collapsed='false'] {
          padding-top: var(--app-transport-h-expanded) !important;
        }
      }
       .preset-select {
         min-height: var(--control-h);
         padding: 0 var(--space-lg) 0 var(--space-md);
         font-family: var(--font-sans);
         font-size: var(--fs-sm);
         color: var(--fg);
         background: var(--surface-1);
         border: 1px solid var(--border);
         border-radius: var(--radius-md);
         cursor: pointer;
         appearance: none;
         -webkit-appearance: none;
         /* wavecode-transport-bar-preset-always: fill available width
          * in the strip so preset is always visible. */
         width: 100%;
       }
      .wc-chip {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        height: 24px;
        padding: 0 var(--space-sm);
        font-size: var(--fs-xs);
        font-weight: var(--fw-medium);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      .wc-chip[data-active='true'] {
        background: var(--amber);
        color: var(--fg-inverse);
        border-color: var(--amber);
      }

      /* ===== CRITICAL: audio loading pill (sample preload feedback) ===== */
      .audio-loading-pill {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2xs);
        padding: 2px var(--space-xs);
        background: var(--amber-soft);
        color: var(--amber);
        border: 1px solid var(--amber);
        border-radius: var(--radius-pill);
        font-family: var(--font-mono);
        font-size: var(--fs-2xs);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-wide);
        text-transform: lowercase;
        animation: audio-loading-pulse 1.5s ease-in-out infinite;
      }
      @keyframes audio-loading-pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="logo" width="80" height="80" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0"   stop-color="#ffaa3b"/>
              <stop offset="0.5" stop-color="#5eead4"/>
              <stop offset="1"   stop-color="#f472b6"/>
            </linearGradient>
            <filter id="bootglow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.4" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="10" fill="#0a0a0e" stroke="url(#bg)" stroke-width="1.6"/>
          <path d="M8 24 L11 24 L13 14 L15 34 L17 18 L20 30 L22 24 L25 24" stroke="url(#bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#bootglow)"/>
          <circle cx="32" cy="24" r="2.6" fill="#ffaa3b">
            <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <rect x="38" y="20" width="2" height="8" rx="0.6" fill="#f472b6" opacity="0.85">
            <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.0s" repeatCount="indefinite"/>
          </rect>
        </svg>
        <div class="word">wavecode</div>
        <div class="tagline">live-coding · ai · strudel</div>
        <div class="bar">boot 1.1 <span style="color:var(--cyan)">[▓▓▓▓░░]</span><span class="dot" style="color:var(--magenta)">_</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
