<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="wavecode" />

    <title>wavecode · live-coding · AI · Strudel</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" sizes="180x180" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <style>
      :root {
        --bg: #0a0a0e;
        --fg: #f4f4f5;
        --fg-dim: #a1a1aa;
        --amber: #ffaa3b;
        --amber-glow: rgba(255, 170, 59, 0.5);
        --cyan: #5eead4;
        --magenta: #f472b6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      #root { height: 100%; }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(255, 170, 59, 0.08), transparent 50%),
          radial-gradient(ellipse at 70% 80%, rgba(94, 234, 212, 0.06), transparent 50%),
          var(--bg);
      }
      .boot .logo {
        filter: drop-shadow(0 0 16px rgba(255, 170, 59, 0.25));
      }
      .boot .word {
        font-size: 32px;
        font-weight: 600;
        color: var(--fg);
        letter-spacing: -0.04em;
        font-family: 'Geist', system-ui, sans-serif;
      }
      .boot .tagline {
        font-size: 11px;
        color: var(--fg-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-family: 'Geist Mono', monospace;
      }
      .boot .bar {
        font-family: 'Geist Mono', monospace;
        font-size: 12px;
        color: var(--amber);
        letter-spacing: 0.06em;
        margin-top: 8px;
      }
      .boot .bar .dot {
        display: inline-block;
        animation: blink 1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="logo" width="240" height="80" viewBox="0 0 48 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0"   stop-color="#ffaa3b"/>
              <stop offset="0.5" stop-color="#5eead4"/>
              <stop offset="1"   stop-color="#f472b6"/>
            </linearGradient>
          </defs>
          <path d="M2 8 L4 8 L5 4 L6 12 L7 5 L8 11 L9 8 L11 8" stroke="url(#bg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="14" cy="8" r="1.4" fill="#ffaa3b">
            <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <path d="M17 8 L19 8 L20 5 L21 11 L22 8 L24 8" stroke="url(#bg)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
          <rect x="26" y="6" width="1.6" height="4" fill="#f472b6">
            <animate attributeName="opacity" values="1;0;1" dur="1.0s" repeatCount="indefinite"/>
          </rect>
          <path d="M30 8 L32 6 M30 8 L32 10" stroke="#a1a1aa" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
          <rect x="34" y="4.5" width="2" height="7" stroke="#5eead4" stroke-width="0.9" fill="none" opacity="0.7">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
          </rect>
          <g font-family="monospace" font-size="3.4" fill="#a1a1aa" opacity="0.65">
            <text x="38" y="11.5">wc</text>
          </g>
          <circle cx="2"  cy="2"  r="0.4" fill="#52525b"/>
          <circle cx="46" cy="2"  r="0.4" fill="#52525b"/>
          <circle cx="2"  cy="14" r="0.4" fill="#52525b"/>
          <circle cx="46" cy="14" r="0.4" fill="#52525b"/>
        </svg>
        <div class="word">wavecode</div>
        <div class="tagline">live-coding · ai · strudel</div>
        <div class="bar">boot 1.1 <span style="color:var(--cyan)">[▓▓▓▓░░]</span><span class="dot" style="color:var(--magenta)">_</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
